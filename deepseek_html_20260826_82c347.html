<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>俱乐大玩家 · 超级AI定制版</title>
    <style>
        :root {
            --bg-page: #0a0e1a;
            --bg-card: #111827;
            --bg-card2: #1a2332;
            --bg-input: #0d1422;
            --border-color: #2a3a5a;
            --text-primary: #e8eef8;
            --text-secondary: #8aa0c8;
            --accent: #e8c468;
            --accent2: #f5dd9a;
            --shadow: rgba(0,0,0,0.5);
            --radius: 14px;
            --transition: 0.2s ease;
            --nav-height: 48px;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            background: var(--bg-page);
            color: var(--text-primary);
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            font-size: 14px;
            line-height: 1.6;
            padding-bottom: 40px;
        }
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:var(--bg-page); }
        ::-webkit-scrollbar-thumb { background:var(--accent); border-radius:4px; }

        /* ===== 验证覆盖层 ===== */
        #authOverlay {
            position: fixed; inset:0; z-index:999999;
            background: var(--bg-page);
            display: flex; align-items:center; justify-content:center;
            padding:20px;
            transition: opacity 0.4s ease;
        }
        #authOverlay.hidden { opacity:0; pointer-events:none; }
        .auth-box {
            width:420px; max-width:100%;
            background: var(--bg-card);
            border:1px solid rgba(232,196,104,0.12);
            border-radius:var(--radius);
            padding:34px 28px 24px;
            text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,0.6);
            position:relative; overflow:hidden;
        }
        .auth-box .auth-icon { font-size:44px; display:block; margin-bottom:2px; }
        .auth-box .auth-title {
            font-size:22px; font-weight:800;
            background:linear-gradient(135deg,var(--accent2),var(--accent));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text;
            margin-bottom:2px;
        }
        .auth-box .auth-badge {
            display:inline-block;
            background:linear-gradient(135deg,#ffd700,#f5a623);
            color:#0b1526; font-weight:800;
            padding:3px 20px; border-radius:30px; font-size:13px;
            box-shadow:0 0 30px rgba(255,215,0,0.15);
            border:1px solid rgba(255,215,0,0.15);
            margin:4px 0 12px;
        }
        .auth-box .auth-sub {
            color:var(--text-secondary);
            font-size:13px; margin-bottom:10px; line-height:1.7;
        }
        .auth-box .auth-input-wrap {
            position:relative; margin-bottom:12px;
        }
        .auth-box .auth-input-wrap input {
            width:100%; padding:13px 18px;
            background:var(--bg-input);
            border:2px solid var(--border-color);
            border-radius:12px;
            color:var(--text-primary);
            font-size:17px; font-weight:600;
            text-align:center; letter-spacing:4px;
            font-family:'SF Mono','Menlo',monospace;
            outline:none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .auth-box .auth-input-wrap input:focus {
            border-color:var(--accent);
            box-shadow:0 0 0 4px rgba(232,196,104,0.06);
        }
        .auth-box .auth-btn {
            width:100%; padding:13px 0;
            border:none; border-radius:12px;
            font-size:16px; font-weight:700;
            color:#0b1526;
            background:linear-gradient(135deg,var(--accent),#c9a23e);
            cursor:pointer;
            transition: transform 0.15s, box-shadow 0.3s;
            box-shadow:0 4px 20px rgba(232,196,104,0.15);
            letter-spacing:0.5px;
        }
        .auth-box .auth-btn:active { transform:scale(0.97); }
        .auth-box .auth-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
        .auth-box .auth-error {
            color:#f87171; font-size:13px; min-height:22px; margin-top:4px;
        }
        .auth-box .auth-footer {
            margin-top:16px; color:var(--text-secondary);
            font-size:11px; opacity:0.4; line-height:1.8;
        }
        .auth-box .auth-footer .author { font-size:11px; opacity:0.5; margin-top:2px; }

        /* ===== 主界面 ===== */
        #appWrap { max-width:820px; margin:0 auto; padding:0 12px 20px; display:none; }
        #appWrap.show { display:block; }

        .top-nav {
            position: sticky; top:0; z-index:1000;
            background: var(--bg-page);
            border-bottom: 1px solid rgba(42,58,90,0.25);
            padding: 0 10px; height: var(--nav-height);
            display: flex; align-items: center; gap: 4px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.3);
            flex-wrap: nowrap; overflow-x: auto;
        }
        .top-nav::-webkit-scrollbar { display:none; }
        .top-nav .nav-group {
            display: flex; align-items: center; gap:3px;
            flex-shrink:0; padding:0 4px;
            border-right:1px solid rgba(42,58,90,0.15);
        }
        .top-nav .nav-group:last-child { border-right:none; }
        .top-nav .nav-group .label {
            font-size:10px; color:var(--text-secondary); opacity:0.5;
            padding-right:2px; font-weight:600; display:none;
        }
        .top-nav button {
            padding:4px 10px; border:none; background:transparent;
            color:var(--text-secondary); font-size:12px; font-weight:600;
            cursor:pointer; border-radius:6px; white-space:nowrap;
            font-family:inherit; transition:all 0.15s; line-height:1.4; min-height:30px;
        }
        .top-nav button.active {
            color:var(--accent2); background:rgba(232,196,104,0.06);
        }
        .top-nav button.active::after {
            content:''; display:block; height:2px; background:var(--accent);
            border-radius:2px; margin-top:1px; width:60%; margin-left:auto; margin-right:auto;
        }
        .top-nav button.mode-btn.active {
            background:rgba(232,196,104,0.10);
            border:1px solid rgba(232,196,104,0.12);
        }
        .top-nav button.mode-btn.active::after { display:none; }
        .top-nav .nav-right {
            display:flex; align-items:center; gap:4px;
            flex-shrink:0; padding-left:6px;
            border-left:1px solid rgba(42,58,90,0.15);
            margin-left:auto;
        }
        .top-nav .nav-right .vip-tag {
            font-size:9px; color:var(--accent2);
            border:1px solid rgba(232,196,104,0.2);
            padding:1px 8px; border-radius:12px; font-weight:700;
            white-space:nowrap;
        }

        .header {
            padding:10px 4px 6px;
            display:flex; flex-direction:column; align-items:center; text-align:center;
            border-bottom:1px solid rgba(42,58,90,0.10);
            margin-bottom:6px;
        }
        .header .main-title {
            font-size:18px; font-weight:800; color:var(--accent2);
            letter-spacing:0.5px;
            display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center;
        }
        .header .main-title .super-tag {
            background:linear-gradient(135deg,#ffd700,#f5a623);
            color:#0b1526; font-weight:800; padding:1px 12px;
            border-radius:30px; font-size:10px;
            box-shadow:0 0 30px rgba(255,215,0,0.12);
            border:1px solid rgba(255,215,0,0.12);
            display:inline-block; line-height:1.6;
        }
        .header .sub-title {
            font-size:11px; color:var(--text-secondary);
            margin-top:1px; opacity:0.5; letter-spacing:0.5px;
        }
        .header .header-actions {
            margin-top:4px; display:flex; justify-content:center; align-items:center; gap:12px; flex-wrap:wrap;
        }
        .header .header-actions .remain-time {
            font-size:12px; font-weight:600;
            background:rgba(78,201,122,0.06);
            padding:2px 14px; border-radius:20px;
            border:1px solid rgba(78,201,122,0.08);
            transition: color 0.3s, border-color 0.3s;
        }
        .header .header-actions .remain-time.permanent { color:#fbbf24; border-color:rgba(251,191,36,0.15); background:rgba(251,191,36,0.06); }
        .header .header-actions .remain-time.active { color:#4ec97a; border-color:rgba(78,201,122,0.15); background:rgba(78,201,122,0.06); }
        .header .header-actions .remain-time.warning { color:#fbbf24; border-color:rgba(251,191,36,0.15); background:rgba(251,191,36,0.06); }
        .header .header-actions .remain-time.danger { color:#f87171; border-color:rgba(248,113,113,0.15); background:rgba(248,113,113,0.06); }
        .header .header-actions .unbind-btn {
            font-size:11px; color:#f87171;
            cursor:pointer; padding:2px 12px;
            border-radius:20px; border:1px solid rgba(248,113,113,0.15);
            background:rgba(248,113,113,0.05);
            transition:all 0.2s; user-select:none; font-weight:500;
        }
        .header .header-actions .unbind-btn:hover { background:rgba(248,113,113,0.12); }
        .header .header-actions .unbind-btn:active { transform:scale(0.95); }

        .tour-guide {
            padding:6px 12px 8px;
            font-size:11px; color:var(--text-secondary);
            line-height:1.8;
            background:rgba(232,196,104,0.015);
            border-radius:var(--radius);
            border:1px solid rgba(42,58,90,0.15);
            margin:0 0 8px 0; opacity:0.8;
        }

        .map-mode-row {
            display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;
        }
        .map-mode-row .map-switch {
            display:flex; gap:4px;
            background:rgba(0,0,0,0.15);
            border-radius:12px; padding:4px;
            border:1px solid rgba(42,58,90,0.12);
            flex:2; min-width:200px;
        }
        .map-mode-row .map-switch button {
            flex:1; padding:5px 4px; background:transparent; border:none;
            border-radius:9px; color:var(--text-secondary);
            font-size:11px; font-weight:600; cursor:pointer;
            transition:all 0.15s; white-space:nowrap;
            min-width:36px; font-family:inherit;
        }
        .map-mode-row .map-switch button.on {
            background:linear-gradient(135deg, rgba(232,196,104,0.12), rgba(232,196,104,0.04));
            color:var(--accent2);
            box-shadow:0 0 16px rgba(232,196,104,0.04);
            border:1px solid rgba(232,196,104,0.08);
        }
        .map-mode-row .mode-switch {
            display:flex; gap:4px;
            background:rgba(0,0,0,0.15);
            border-radius:12px; padding:4px;
            border:1px solid rgba(42,58,90,0.12);
            flex:1; min-width:140px;
        }
        .map-mode-row .mode-switch button {
            flex:1; padding:5px 4px; background:transparent; border:none;
            border-radius:9px; color:var(--text-secondary);
            font-size:11px; font-weight:600; cursor:pointer;
            transition:all 0.15s; white-space:nowrap;
            font-family:inherit;
        }
        .map-mode-row .mode-switch button.active {
            background:linear-gradient(135deg, rgba(232,196,104,0.12), rgba(232,196,104,0.04));
            color:var(--accent2);
            border:1px solid rgba(232,196,104,0.08);
        }

        .quick-actions {
            display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; margin-bottom:10px;
        }
        .quick-actions .qa-btn {
            background:var(--bg-card);
            border:1px solid rgba(42,58,90,0.15);
            border-radius:10px; padding:8px 4px;
            text-align:center; cursor:default;
            font-family:inherit; color:var(--text-secondary);
            font-size:11px; font-weight:600; line-height:1.3;
        }
        .quick-actions .qa-btn .qa-icon { display:block; font-size:16px; margin-bottom:1px; }
        .quick-actions .qa-btn .qa-value { color:var(--accent2); font-weight:800; font-size:12px; display:block; margin-top:1px; }
        .quick-actions .qa-btn .qa-label { font-size:9px; opacity:0.6; }

        .section {
            background:var(--bg-card);
            border:1px solid rgba(42,58,90,0.2);
            border-radius:var(--radius);
            margin-bottom:12px; overflow:hidden;
            box-shadow:0 4px 20px var(--shadow);
        }
        .sec-head {
            padding:8px 12px;
            border-bottom:1px solid rgba(42,58,90,0.10);
            background:rgba(0,0,0,0.10);
        }
        .sec-title {
            display:flex; align-items:flex-start; gap:8px;
        }
        .sec-title .icon {
            width:28px; height:28px; border-radius:10px;
            display:flex; align-items:center; justify-content:center;
            font-size:13px; font-weight:700; color:#0b1526;
            flex-shrink:0;
        }
        .sec-title .name {
            font-size:14px; font-weight:700; color:var(--text-primary);
        }
        .sec-title .role {
            font-size:11px; color:var(--text-secondary); opacity:0.8; line-height:1.5;
        }
        .sec-title .role .tip2 {
            color:var(--accent); display:block; font-size:11px; opacity:0.9;
        }
        .sec-body { padding:8px 10px 10px; }

        .row {
            display:flex; align-items:center; gap:5px;
            padding:4px 2px; border-bottom:1px solid rgba(42,58,90,0.05);
            flex-wrap:wrap;
        }
        .row:last-child { border-bottom:none; }
        .row .lbl { min-width:50px; font-weight:600; font-size:12px; color:var(--text-primary); }
        .row .qty { width:56px; flex-shrink:0; }
        .row .sub { flex:1; text-align:right; font-weight:700; font-size:13px; color:var(--accent2); font-variant-numeric:tabular-nums; min-width:44px; }

        input[type="number"], input[type="text"] {
            width:100%; padding:5px 3px;
            background:var(--bg-input);
            border:1px solid var(--border-color);
            border-radius:8px; color:var(--text-primary);
            font-size:12px; font-weight:600; text-align:center;
            outline:none; -moz-appearance:textfield;
            transition: border-color var(--transition), box-shadow var(--transition);
            font-family:inherit;
        }
        input[type="number"]:focus, input[type="text"]:focus {
            border-color:var(--accent);
            box-shadow:0 0 0 3px rgba(232,196,104,0.05);
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }

        .total-bar {
            margin-top:8px; padding:6px 10px;
            background:linear-gradient(135deg, rgba(232,196,104,0.04), rgba(232,196,104,0.015));
            border:1px solid rgba(232,196,104,0.06);
            border-radius:10px;
            display:flex; justify-content:space-between; align-items:center;
            flex-wrap:wrap; gap:2px;
        }
        .total-bar .t-item {
            display:flex; align-items:center; gap:4px; font-size:11px;
        }
        .total-bar .t-item .label { color:var(--text-secondary); font-weight:500; }
        .total-bar .t-item .value { font-weight:800; color:var(--accent2); font-variant-numeric:tabular-nums; }
        .total-bar .t-item .value.rec { color:#4ec97a; }
        .total-bar .t-item .value.profit { color:#fbbf24; }
        .total-bar .t-item .value.estimate { color:#60a5fa; }

        .confidence-bar {
            display:flex; align-items:center; gap:6px;
            font-size:11px; color:var(--text-secondary);
            margin-top:5px; padding:2px 0;
        }
        .confidence-bar .bar-track {
            flex:1; height:4px; background:rgba(255,255,255,0.05);
            border-radius:2px; overflow:hidden; min-width:40px;
        }
        .confidence-bar .bar-fill {
            height:100%; border-radius:2px; transition:width 0.5s ease;
            background:linear-gradient(90deg, #f87171, #fbbf24, #34d399);
        }
        .confidence-bar .label { font-weight:500; min-width:30px; text-align:right; color:var(--accent2); }

        .mode-tag {
            display:inline-block; padding:1px 12px; border-radius:12px;
            font-size:10px; font-weight:700; letter-spacing:0.3px;
            margin-bottom:6px;
        }
        .mode-tag.conservative { background:rgba(78,201,122,0.10); color:#4ec97a; border:1px solid rgba(78,201,122,0.15); }
        .mode-tag.balanced { background:rgba(232,196,104,0.10); color:var(--accent2); border:1px solid rgba(232,196,104,0.15); }
        .mode-tag.aggressive { background:rgba(248,113,113,0.12); color:#f87171; border:1px solid rgba(248,113,113,0.20); }

        .car-pool-btns {
            display:flex; align-items:center; gap:6px;
            margin-top:4px; padding:4px 0; flex-wrap:wrap;
        }
        .car-pool-btns .label { font-size:12px; color:var(--text-secondary); font-weight:500; margin-right:4px; }
        .car-pool-btns .car-btn {
            padding:4px 12px; border:1px solid var(--border-color);
            border-radius:8px; background:transparent;
            color:var(--text-secondary); font-size:11px; font-weight:600;
            cursor:pointer; transition:all 0.15s;
            font-family:inherit; white-space:nowrap;
        }
        .car-pool-btns .car-btn.active {
            background:rgba(232,196,104,0.12);
            border-color:var(--accent);
            color:var(--accent2);
        }
        .car-pool-btns .car-btn .badge { font-size:9px; opacity:0.6; }
        .car-pool-btns .car-tag { font-size:11px; color:var(--accent2); font-weight:700; min-width:60px; }

        .reset-row { margin-top:6px; display:flex; justify-content:flex-end; }
        .btn-reset {
            padding:3px 12px; background:transparent;
            border:1px solid var(--border-color);
            color:var(--text-secondary);
            border-radius:8px; font-size:11px; cursor:pointer;
            transition:all 0.2s; font-weight:500; font-family:inherit;
        }
        .btn-reset:hover { border-color:#f87171; color:#f87171; }

        .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:3px; vertical-align:middle; flex-shrink:0; }
        .dot.red { background:#e05555; }
        .dot.orange { background:#e8943a; }
        .dot.purple { background:#a66be0; }
        .dot.blue { background:#4a9ae8; }
        .dot.green { background:#4ec97a; }

        .page { display:none; animation:fadeUp 0.25s ease; }
        .page.active { display:block; }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(8px); }
            to { opacity:1; transform:translateY(0); }
        }

        @media (max-width:480px) {
            .top-nav button { font-size:10px; padding:3px 6px; min-height:24px; }
            .top-nav .nav-group .label { display:none; }
            .top-nav .nav-right .vip-tag { font-size:8px; padding:1px 5px; }
            .sec-body { padding:6px 6px 8px; }
            .row .lbl { min-width:42px; font-size:11px; }
            .row .qty { width:48px; }
            .total-bar .t-item { font-size:10px; }
            #appWrap { padding:0 6px 16px; }
            .car-pool-btns .car-btn { padding:3px 8px; font-size:10px; }
            .quick-actions { grid-template-columns:1fr 1fr; }
            .header .main-title { font-size:16px; }
            .tour-guide { font-size:10px; padding:4px 8px 6px; }
            .map-mode-row { flex-direction:column; }
            .map-mode-row .map-switch, .map-mode-row .mode-switch { flex:1; }
            .map-mode-row .map-switch button, .map-mode-row .mode-switch button { font-size:10px; padding:4px 2px; min-width:30px; }
        }
        @media (min-width:600px) {
            .top-nav .nav-group .label { display:inline-block; }
            .quick-actions { grid-template-columns:1fr 1fr 1fr 1fr; }
        }
    </style>
</head>
<body>

    <!-- ===== 验证覆盖层 ===== -->
    <div id="authOverlay">
        <div class="auth-box">
            <span class="auth-icon">🔐</span>
            <div class="auth-title">俱乐大玩家 · 价值计算器</div>
            <div class="auth-badge">🌟 超级AI定制版</div>
            <div class="auth-sub">作者QQ：205263367</div>
            <div class="auth-input-wrap">
                <input id="cardInput" type="text" placeholder="请输入卡密" autocomplete="off" spellcheck="false" />
            </div>
            <button id="verifyBtn" class="auth-btn">激活</button>
            <div id="authError" class="auth-error"></div>
            <div class="auth-footer">
                <div class="author">作者 QQ：205263367</div>
            </div>
        </div>
    </div>

    <!-- ===== 主界面 ===== -->
    <div id="appWrap">

        <nav class="top-nav" id="topNav">
            <div class="nav-group">
                <span class="label">角色</span>
                <button class="active" data-tab="huo">霍姑姑</button>
                <button data-tab="gao">高晋</button>
                <button data-tab="su">苏琦</button>
                <button data-tab="an">安可</button>
            </div>
            <div class="nav-group">
                <span class="label">模式</span>
                <button class="mode-btn active" data-mode="balanced">⚖️ 均衡</button>
                <button class="mode-btn" data-mode="conservative">🛡️ 保守</button>
                <button class="mode-btn" data-mode="aggressive">🔥 激进</button>
            </div>
            <div class="nav-right">
                <span class="vip-tag">📊 迪城校准版</span>
            </div>
        </nav>

        <div class="header">
            <div class="main-title">
                俱乐大玩家 · 价值计算器
                <span class="super-tag">📊 迪城校准版</span>
            </div>
            <div class="sub-title">角色估值 / 地图切换 / 均格反查</div>
            <div class="header-actions">
                <span class="remain-time" id="headerRemain">⏱ 加载中...</span>
                <span class="unbind-btn" id="unbindBtn">🔓 解绑设备</span>
            </div>
        </div>

        <div class="tour-guide">

    <!-- ============================================================
     keyt.cn 验证系统 + 动态剩余时间 + 解绑功能

    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js">
    </script>
    <script>
        // ============================================================
        // keyt.cn 验证配置
        // ============================================================
        var CONFIG = {
            API_URL: 'https://www.keyt.cn/kami/qq204443214/check.php',
            APP_NAME: 'a'
        };
        var CACHE_TIME = 86400;
        var VERIFY_CACHE_DAYS = 7;
        var VERIFY_CACHE_MS = VERIFY_CACHE_DAYS * 24 * 60 * 60 * 1000;

        var appWrap = document.getElementById('appWrap');
        var authOverlay = document.getElementById('authOverlay');

        // ============================================================
        // 存储工具
        // ============================================================
        var Storage2 = {
            set: function(k, v) {
                try { localStorage.setItem(k, v); return; } catch (e) {}
                try { document.cookie = k + '=' + encodeURIComponent(v) + '; path=/; max-age=' + CACHE_TIME; } catch (e2) {}
            },
            get: function(k) {
                try { var val = localStorage.getItem(k); if (val !== null) return val; } catch (e) {}
                try { var match = document.cookie.match(new RegExp('(^| )' + k + '=([^;]+)')); if (match) return decodeURIComponent(
                        match[2]); } catch (e2) {}
                return null;
            },
            remove: function(k) {
                try { localStorage.removeItem(k); } catch (e) {}
                try { document.cookie = k + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;'; } catch (e2) {}
            }
        };

        // ============================================================
        // 设备指纹
        // ============================================================
        function getDeviceId() {
            var saved = Storage2.get('device_id');
            if (saved) return saved;
            var parts = [];
            try {
                var canvas = document.createElement('canvas');
                var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    var info = gl.getExtension('WEBGL_debug_renderer_info');
                    if (info) {
                        var gpu = gl.getParameter(info.UNMASKED_RENDERER_WEBGL) || '';
                        if (gpu) parts.push('gpu:' + gpu);
                    }
                }
            } catch (e) {}
            if (parts.length === 0) {
                try {
                    var c = document.createElement('canvas');
                    c.width = 256;
                    c.height = 64;
                    var ctx = c.getContext('2d');
                    if (ctx) {
                        ctx.fillStyle = '#f60';
                        ctx.fillRect(100, 1, 62, 20);
                        ctx.fillStyle = '#069';
                        ctx.font = '14px Arial';
                        ctx.fillText('Keyt.cn', 2, 15);
                        ctx.fillStyle = 'rgba(100,200,50,0.5)';
                        ctx.beginPath();
                        ctx.arc(50, 30, 15, 0, Math.PI * 2);
                        ctx.fill();
                        parts.push('canvas:' + CryptoJS.MD5(c.toDataURL()).toString());
                    }
                } catch (e) {}
            }
            if (parts.length === 0) {
                parts.push('screen:' + (screen.width || 0) + 'x' + (screen.height || 0) + 'x' + (screen.colorDepth || 24));
                var os = navigator.platform || '';
                if (os.indexOf('Win') !== -1) os = 'Windows';
                else if (os.indexOf('Mac') !== -1) os = 'Mac';
                else if (os.indexOf('Linux') !== -1) os = 'Linux';
                else if (os.indexOf('iPhone') !== -1 || os.indexOf('iPad') !== -1) os = 'iOS';
                else if (os.indexOf('Android') !== -1) os = 'Android';
                else os = 'Other';
                parts.push('os:' + os);
                parts.push('lang:' + (navigator.language || navigator.userLanguage || 'zh-CN'));
            }
            var deviceId = 'web_' + CryptoJS.MD5(parts.join('|')).toString();
            Storage2.set('device_id', deviceId);
            return deviceId;
        }

        // ============================================================
        // 验证状态缓存管理（7天有效期）
        // ============================================================
        function saveVerifyStatus(card, days, minutes, cardType, verifyTime) {
            var now = Date.now();
            var data = {
                card: card,
                days: days,
                minutes: minutes,
                cardType: cardType || '未知',
                verified: true,
                timestamp: now,
                verifyTime: verifyTime || now,
                expireAt: now + VERIFY_CACHE_MS
            };
            try {
                localStorage.setItem('keyt_verify_status', JSON.stringify(data));
                Storage2.set('card', card);
                document.cookie = 'card_verified=true; path=/; max-age=' + (VERIFY_CACHE_MS / 1000);
                document.cookie = 'remain_days=' + encodeURIComponent(days) + '; path=/; max-age=' + (VERIFY_CACHE_MS / 1000);
                document.cookie = 'remain_minutes=' + minutes + '; path=/; max-age=' + (VERIFY_CACHE_MS / 1000);
                document.cookie = 'card_type=' + encodeURIComponent(cardType) + '; path=/; max-age=' + (VERIFY_CACHE_MS / 1000);
                document.cookie = 'verify_time=' + verifyTime + '; path=/; max-age=' + (VERIFY_CACHE_MS / 1000);
            } catch (e) {}
            return data;
        }

        function checkLocalVerify() {
            try {
                var raw = localStorage.getItem('keyt_verify_status');
                if (!raw) return null;
                var data = JSON.parse(raw);
                if (!data.verified) return null;
                if (Date.now() > data.expireAt) return null;
                if (!data.card) return null;
                return data;
            } catch (e) { return null; }
        }

        function clearVerifyStatus() {
            try {
                localStorage.removeItem('keyt_verify_status');
                document.cookie = 'card_verified=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                document.cookie = 'remain_days=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                document.cookie = 'remain_minutes=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                document.cookie = 'card_type=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                document.cookie = 'verify_time=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            } catch (e) {}
        }

        function getCookie(name) {
            var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            if (match) return decodeURIComponent(match[2]);
            return null;
        }

        function request(url, callback) {
            var xhr = null;
            try { xhr = new XMLHttpRequest(); } catch (e) {
                try { xhr = new ActiveXObject('Microsoft.XMLHTTP'); } catch (e2) {}
            }
            if (!xhr) { callback('error|no_xhr'); return; }
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    callback(xhr.status === 200 ? xhr.responseText : 'error|network_error');
                }
            };
            xhr.send();
        }

        // ============================================================
        // 向服务器验证（带防抖）
        // ============================================================
        var pendingVerify = false;

        function verifyWithServer(card, callback) {
            if (pendingVerify) {
                callback(false, null, null, null);
                return;
            }
            pendingVerify = true;
            var deviceId = getDeviceId();
            var url = CONFIG.API_URL + '?card=' + encodeURIComponent(card) + '&mac=' + encodeURIComponent(deviceId) +
                '&app=' + CONFIG.APP_NAME;
            request(url, function(response) {
                pendingVerify = false;
                var pos = response.indexOf('|sign=');
                if (pos !== -1) response = response.substring(0, pos);
                var parts = response.split('|');
                if (parts[0] === 'ok') {
                    var days = parts[2] || '未知';
                    var minutes = parseInt(parts[3]) || 0;
                    var cardType = '天卡';
                    if (minutes >= 999999) cardType = '永久卡';
                    else if (minutes >= 43200) cardType = '月卡';
                    else if (minutes >= 10080) cardType = '周卡';
                    else if (minutes >= 1440) cardType = '天卡';
                    else cardType = '小时卡';
                    callback(true, days, minutes, cardType);
                } else {
                    callback(false, null, null, null);
                }
            });
        }

        // ============================================================
        // ★ 动态剩余时间计算与显示（仅更新 headerRemain，无悬浮窗）
        // ============================================================
        var remainTimer = null;

        function formatRemainTime(minutes) {
            if (minutes >= 999999) {
                return { text: '永久有效', type: 'permanent' };
            }
            if (minutes <= 0) {
                return { text: '已过期', type: 'expired' };
            }
            var days = Math.floor(minutes / 1440);
            var hours = Math.floor((minutes % 1440) / 60);
            var mins = Math.floor(minutes % 60);

            var parts = [];
            if (days > 0) parts.push(days + '天');
            if (hours > 0) parts.push(hours + '时');
            if (mins > 0) parts.push(mins + '分');
            if (parts.length === 0) parts.push('0分');

            var type = 'active';
            if (days < 1 && hours < 6) type = 'warning';
            if (days < 1 && hours < 1) type = 'danger';

            return {
                text: parts.join(''),
                type: type,
                days: days,
                hours: hours,
                mins: mins
            };
        }

        function updateRemainDisplayFromData(data) {
            var el = document.getElementById('headerRemain');
            if (!el || !data) return;

            var now = Date.now();
            var elapsedSeconds = (now - data.verifyTime) / 1000;
            var remainMinutes = Math.max(0, data.minutes - elapsedSeconds / 60);

            var result = formatRemainTime(remainMinutes);
            var label = '⏱ ';
            if (data.cardType === '永久卡') {
                el.textContent = '♾️ 永久卡';
                el.className = 'remain-time permanent';
                return;
            }
            el.textContent = label + result.text + ' · ' + data.cardType;
            el.className = 'remain-time ' + result.type;
        }

        function startRemainTimer(data) {
            if (remainTimer) {
                clearInterval(remainTimer);
                remainTimer = null;
            }

            // 立即更新一次
            updateRemainDisplayFromData(data);

            // 每秒更新
            remainTimer = setInterval(function() {
                updateRemainDisplayFromData(data);
            }, 1000);
        }

        // ============================================================
        // ★ 解绑功能
        // ============================================================
        function unbindDevice() {
            if (!confirm('确定要解绑此设备吗？\n解绑后当前设备将无法使用，需在其他设备重新激活。')) {
                return;
            }

            clearVerifyStatus();

            if (remainTimer) {
                clearInterval(remainTimer);
                remainTimer = null;
            }

            showAuth();
            document.getElementById('cardInput').value = '';
            document.getElementById('authError').textContent = '';
            document.getElementById('headerRemain').textContent = '⏱ 已解绑';

            console.log('✅ 已解绑，清除本地缓存');
        }

        // ============================================================
        // 显示/隐藏界面
        // ============================================================
        function showApp() {
            appWrap.classList.add('show');
            authOverlay.classList.add('hidden');
        }

        function showAuth() {
            appWrap.classList.remove('show');
            authOverlay.classList.remove('hidden');
        }

        // ============================================================
        // 显示验证框（备用）
        // ============================================================
        function showAuthBox() {
            showAuth();
            if (document.getElementById('authBox2')) {

            var box = document.createElement('div');

            box.style.cssText =
                'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:999999;display:flex;align-items:center;justify-content:center;font-family:sans-serif;';
            box.innerHTML =
                '<div style="background:#1a202c;padding:40px;border-radius:20px;width:400px;max-width:90%;text-align:center;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.06);">' +
                '<div style="font-size:56px;margin-bottom:12px;">🔐</div>' +
                '<h2 style="font-size:24px;margin-bottom:4px;font-weight:700;">请输入卡密验证</h2>' +
                '<p style="color:#94a3b8;font-size:14px;margin-bottom:24px;">验证通过后7天内自动登录</p>' +
                '<input id="cardInput2" type="text" placeholder="请输入卡密" style="width:100%;padding:14px 18px;border:2px solid #2d3748;border-radius:12px;background:#111827;color:#fff;font-size:16px;text-align:center;letter-spacing:2px;outline:none;font-family:monospace;box-sizing:border-box;">' +
                '<div id="authError2" style="color:#ff6b6b;font-size:13px;margin-top:8px;min-height:20px;"></div>' +
                '<button id="verifyBtn2" style="width:100%;padding:14px 0;border:none;border-radius:12px;font-size:16px;font-weight:600;color:#000;background:linear-gradient(90deg,#4096ff,#36d399);cursor:pointer;margin-top:16px;">✅ 验证卡密</button>' +
                '<div style="margin-top:12px;font-size:11px;color:#64748b;">提示：验证通过后自动保存</div>' +
                '</div>';
            document.body.appendChild(box);

            var verifyBtn = document.getElementById('verifyBtn2');
            var cardInput = document.getElementById('cardInput2');

            verifyBtn.onclick = function() {
                if (this.disabled) return;
                var card = cardInput.value.trim();
                if (!card) { document.getElementById('authError2').textContent = '请输入卡密'; return; }
                document.getElementById('authError2').textContent = '';
                this.disabled = true;
                this.textContent = '⏳ 验证中...';

                verifyWithServer(card, function(success, days, minutes, cardType) {
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = '✅ 验证卡密';
                    if (success) {
                        var now = Date.now();
                        var data = saveVerifyStatus(card, days, minutes, cardType, now);
                        var box2 = document.getElementById('authBox2');
                        if (box2) box2.style.display = 'none';
                        showApp();
                        startRemainTimer(data);
                        if (typeof renderMainApp === 'function') {
                            renderMainApp();
                        } else {
                            location.reload();
                        }
                    } else {
                        document.getElementById('authError2').textContent = '验证失败，请检查卡密';
                    }
                });
            };

            cardInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') verifyBtn.click();
            });

            var savedCard = Storage2.get('card') || getCookie('card');
            if (savedCard) {
                cardInput.value = savedCard;
                setTimeout(function() { verifyBtn.click(); }, 500);
            }
            setTimeout(function() { cardInput.focus(); }, 100);
        }

        // ============================================================
        // ★ 主流程
        // ============================================================
        (function() {
            showAuth();

            document.getElementById('unbindBtn').addEventListener('click', unbindDevice);

            var cached = checkLocalVerify();
            if (cached) {
                showApp();
                startRemainTimer(cached);
                console.log('✅ 本地缓存验证通过（' + VERIFY_CACHE_DAYS + '天有效期）');
                var waitCount = 0;
                var waitInterval = setInterval(function() {
                    if (typeof renderMainApp === 'function') {
                        clearInterval(waitInterval);
                        renderMainApp();
                    }
                    waitCount++;
                    if (waitCount > 20) {
                        clearInterval(waitInterval);
                        if (typeof renderPage === 'function') {
                            renderPage('huo');
                        }
                    }
                }, 300);
                return;
            }

            var savedCard = Storage2.get('card') || getCookie('card');
            if (savedCard) {
                console.log('📤 向服务器验证保存的卡密...');
                verifyWithServer(savedCard, function(success, days, minutes, cardType) {
                    if (success) {
                        var now = Date.now();
                        var data = saveVerifyStatus(savedCard, days, minutes, cardType, now);
                        showApp();
                        startRemainTimer(data);
                        console.log('✅ 服务器验证通过');
                        if (typeof renderMainApp === 'function') {
                            renderMainApp();
                        } else {
                            location.reload();
                        }
                    } else {
                        clearVerifyStatus();
                        showAuthBox();
                    }
                });
            } else {
                console.log('🔐 未找到保存的卡密，显示验证框');
                showAuthBox();
            }
        })();

        // ============================================================

        function fmt(n) { if (n === undefined || n === null || isNaN(n)) return '0'; return Math.round(n).toLocaleString(); }

        function getMapData(mapKey) { return CALIBRATED_DATA[mapKey] || CALIBRATED_DATA.xiangjiang; }

        function getColorPrice(mapKey, colorKey, modeKey) {
            var mapData = getMapData(mapKey);
            var price = mapData.colors[colorKey];
            if (!price) return 0;
            if (modeKey === 'aggressive' && colorKey === 'orange') return 23876;
            if (modeKey === 'aggressive' && colorKey === 'red') return Math.round(price * 1.15);
            return price;
        }

        function getModeConfig(modeKey) { return MODE_CONFIG[modeKey] || MODE_CONFIG.balanced; }

        function calcDynamicBid(baseTotal, redSubtotal, carLevel, modeKey, mapKey) {
            var mode = getModeConfig(modeKey);
            var redRatio = baseTotal > 0 ? Math.min(1, redSubtotal / baseTotal) : 0;
            var baseDisc = mode.recDiscount || 0.87;
            var redBonus = redRatio * 0.12;
            var carBonus = carLevel * 0.025;
            var finalDisc = Math.min(0.96, baseDisc + redBonus + carBonus);
            var bidPrice = Math.round(baseTotal * finalDisc);
            var estBase = 0.90 + redRatio * 0.18 + carLevel * 0.035;
            var estPrice = Math.round(baseTotal * Math.min(1.15, estBase));
            return { bidPrice: bidPrice, estPrice: estPrice, finalDisc: finalDisc, redRatio: redRatio, carBonus: carBonus };
        }

        function calcConfidence(inputCount, redRatio, carLevel, modeKey, mapKey) {
            var conf = 0.88;
            conf += Math.min(0.10, inputCount * 0.01);
            if (redRatio > 0.3) conf += 0.02;
            if (redRatio > 0.6) conf += 0.02;
            if (carLevel > 0) conf += 0.02;
            if (modeKey === 'aggressive') conf -= 0.05;
            if (mapKey === 'dicheng') conf *= 0.95;
            return Math.min(0.96, Math.max(0.55, conf));
        }

            document.getElementById('su_red_grid_avg').addEventListener('input', calcSu);
            document.getElementById('su_red_grid_cnt').addEventListener('input', calcSu);
            document.getElementById('suReset').onclick = function() {
                keys.forEach(function(key) { document.getElementById('su_' + key).value = ''; });
                document.getElementById('su_red_grid_avg').value = '';
                document.getElementById('su_red_grid_cnt').value = '';
                carBtns3.forEach(function(b, i) { b.classList.toggle('active', i === 0); });
                carLevel = 0;
                calcSu();
            };
            calcSu();
        }

        // ============================================================
        // 安可（反查）
        // ============================================================
        function renderAn() {
            var el = pageEls.an;
            var mapKey = currentMap;
            var modeKey = currentMode;
            var cfg = getModeConfig(modeKey);
            var grids = [1, 2, 3, 4, 6, 8, 9, 12, 15, 16];
            var gridSet = new Set(grids);

            el.innerHTML = '<div class="section"><div class="sec-head"><div class="sec-title"><div class="icon" style="background:linear-gradient(135deg,#4ec97a,#2a9a5a);">安</div><div><div class="name">安可 · 红品均格反查</div><div class="role">第一回合用红格道具，每回合看到轮廓后把格数输进去缩小范围。</div></div></div></div><div class="sec-body" id="anBody"></div></div>';
            var body = document.getElementById('anBody');
            body.innerHTML = '<div class="mode-tag ' + cfg.tagClass + '">' + cfg.tagText +
                '</div><div class="rev-input" style="display:flex;gap:5px;flex-wrap:wrap;align-items:flex-end;"><div class="field" style="flex:1;min-width:70px;"><label style="display:block;font-size:10px;color:var(--text-secondary);">平均格数</label><input type="number" id="anAvg" step="0.1" min="1" placeholder="如 3.5" style="width:100%;padding:5px 3px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:12px;text-align:center;outline:none;"></div><div class="field" style="flex:1;min-width:70px;"><label style="display:block;font-size:10px;color:var(--text-secondary);">红品数量（可选）</label><input type="number" id="anCount" min="1" max="50" placeholder="不限" style="width:100%;padding:5px 3px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:12px;text-align:center;outline:none;"></div><button class="btn-gold" id="anBtn" style="padding:6px 14px;background:linear-gradient(135deg,var(--accent),#c9a23e);color:#0b1526;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;min-height:34px;font-family:inherit;">推算</button></div><div style="margin-top:4px;"><label style="font-size:10px;color:var(--text-secondary);">已知格数（选填，用逗号分隔）</label><input type="text" id="anKnown" placeholder="如 4,6,8" style="width:100%;padding:5px 8px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);outline:none;"></div><div class="rev-result" id="anResult" style="margin-top:8px;"></div><div class="reset-row"><button class="btn-reset" id="anReset">重置数据</button></div>';

            document.getElementById('anBtn').onclick = function() {
                var avg = parseFloat(document.getElementById('anAvg').value);
                var count = parseInt(document.getElementById('anCount').value) || 0;
                var knownStr = document.getElementById('anKnown').value.trim();
                var known = knownStr ? knownStr.split(',').map(function(s) { return parseInt(s.trim()); })
                    .filter(function(n) { return !isNaN(n) && n > 0; }) : [];
                var result = document.getElementById('anResult');
                if (isNaN(avg) || avg < 1) { result.innerHTML = '<div class="empty">请输入有效的平均格数</div>';
                    return; }
                var combos = [];
                var maxN = count > 0 ? count : 20;
                var minN = count > 0 ? count : 1;
                for (var n = minN; n <= maxN; n++) {
                    var ok = true;
                    for (var i = 0; i < known.length; i++) { if (!gridSet.has(known[i])) { ok = false; break; } }
                    if (!ok) continue;
                    var total = Math.round(avg * n);
                    var list = [];

                    function find(rem, idx, path) {
                        if (rem === 0 && path.length === n) { list.push(path.slice()); return; }
                        if (path.length >= n) return;
                        for (var j = idx; j < grids.length; j++) {
                            var g = grids[j];
                            if (g <= rem) { path.push(g);
                                find(rem - g, j, path);
                                path.pop(); }
                        }
                    }
                    if (n <= 8) { find(total, 0, []);
                        if (list.length > 0) combos.push({ n: n, total: total, combos: list }); } else { combos
                            .push({ n: n, total: total, combos: null, approx: true }); }
                }
                if (combos.length === 0) { result.innerHTML = '<div class="empty">未找到匹配组合，请检查输入</div>';
                    return; }
                var html = '';
                var maxShow = 10;
                var rpp = getColorPrice(currentMap, 'red', currentMode);
                combos.forEach(function(item) {
                    var est = Math.round(item.n * rpp);
                    var minV = 0;
                    if (item.combos) {
                        var minTotal = Infinity;
                        item.combos.forEach(function(c) {
                            var s = 0;
                            c.forEach(function(g) { s += g * rpp * 0.7; });
                            if (s < minTotal) minTotal = s;
                        });
                        if (minTotal !== Infinity) minV = minTotal;
                    }
                    var label = '预估价值：' + fmt(est);
                    if (minV > 0) label = '最低价值：' + fmt(minV) + ' | 预估价值：' + fmt(est);
                    html += '<div class="rev-group" style="background:var(--bg-card);border:1px solid rgba(42,58,90,0.15);border-radius:10px;margin-bottom:5px;overflow:hidden;"><div class="g-head" onclick="this.parentElement.classList.toggle(\'open\')" style="padding:5px 8px;background:rgba(232,196,104,0.03);display:flex;justify-content:space-between;align-items:center;cursor:pointer;flex-wrap:wrap;gap:2px;"><span class="g-title" style="font-weight:700;font-size:12px;color:var(--accent2);">' +
                        item.n + ' 个红品（' + label +
                        '）</span><span class="g-meta" style="font-size:10px;color:var(--text-secondary);">总格数 ' +
                        item.total + ' | 共 ' + (item.combos ? item.combos.length : '多种') +
                        ' 种组合 ▶</span></div><div class="g-body" style="display:none;padding:4px 8px 6px;flex-wrap:wrap;gap:3px;">';
                    if (item.approx || !item.combos || item.combos.length === 0) {
                        html +=
                            '<span style="color:var(--text-secondary);font-size:11px;">组合较多，请减少红品数量或增加已知格数限制</span>';
                    } else {
                        var show = item.combos.slice(0, maxShow);
                        show.forEach(function(c) { html += '<span class="combo" style="display:inline-block;background:rgba(0,0,0,0.2);border:1px solid rgba(42,58,90,0.12);border-radius:6px;padding:2px 6px;margin:2px 2px 0 0;font-size:11px;white-space:nowrap;">' +
                                c.join(' + ') + '</span>'; });
                        if (item.combos.length > maxShow) html += '<span class="more-tag" style="font-size:10px;color:var(--accent);padding:4px 3px;display:inline-block;">…共 ' +
                            item.combos.length + ' 种</span>';
                    }
                    html += '</div></div>';
                });
                result.innerHTML = html;
            };
            document.getElementById('anReset').onclick = function() {
                document.getElementById('anAvg').value = '';
                document.getElementById('anCount').value = '';
                document.getElementById('anKnown').value = '';
                document.getElementById('anResult').innerHTML = '';
            };
        }

        // ============================================================
        // 启动主应用
        // ============================================================
        function renderMainApp() {
            console.log('🚀 渲染主应用，当前地图:', currentMap, '模式:', currentMode);
            renderPage(currentTab);
            updateQuickActions(0, 0, 0, 0);
        }

        initEvents();

        if (appWrap.classList.contains('show')) {
            renderMainApp();
        }

        console.log('✅ 迪城校准版已加载（悬浮窗已移除）');
        console.log('📊 迪城数据已校准：香江 × 0.19');
        console.log('🕐 剩余时间动态实时显示');
        console.log('🔓 解绑功能已内置');
        console.log('🔐 keyt.cn 云端验证已启用');
    </script>

</body>
