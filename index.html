<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>俱乐大玩家 · 超级AI v3.1</title>
    <style>
        /* ===== 样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-page: #0a0e1a;
            --bg-card: #111827;
            --bg-card2: #1a2332;
            --bg-input: #0d1422;
            --border-color: #2a3a5a;
            --text-primary: #e8eef8;
            --text-secondary: #8aa0c8;
            --accent: #e8c468;
            --accent2: #f5dd9a;
            --shadow: rgba(0, 0, 0, 0.5);
            --radius: 14px;
            --transition: 0.15s ease;
            --nav-height: 52px;
        }
        body {
            background: var(--bg-page);
            color: var(--text-primary);
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            font-size: 14px;
            line-height: 1.6;
            padding-bottom: 40px;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-page); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

        #authOverlay {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: var(--bg-page);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.4s ease;
        }
        #authOverlay.hidden { opacity: 0; pointer-events: none; }
        .auth-box {
            width: 420px;
            max-width: 100%;
            background: var(--bg-card);
            border: 1px solid rgba(232, 196, 104, 0.12);
            border-radius: var(--radius);
            padding: 34px 28px 24px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .auth-box .auth-icon { font-size: 44px; display: block; margin-bottom: 2px; }
        .auth-box .auth-title {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2px;
        }
        .auth-box .auth-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700, #f5a623);
            color: #0b1526;
            font-weight: 800;
            padding: 3px 20px;
            border-radius: 30px;
            font-size: 13px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.15);
            margin: 4px 0 12px;
        }
        .auth-box .auth-sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 10px; line-height: 1.7; }
        .auth-box .auth-input-wrap { position: relative; margin-bottom: 12px; }
        .auth-box .auth-input-wrap input {
            width: 100%;
            padding: 13px 18px;
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 4px;
            font-family: 'SF Mono', 'Menlo', monospace;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .auth-box .auth-input-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(232, 196, 104, 0.06);
        }
        .auth-box .auth-btn {
            width: 100%;
            padding: 13px 0;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            color: #0b1526;
            background: linear-gradient(135deg, var(--accent), #c9a23e);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.3s;
            box-shadow: 0 4px 20px rgba(232, 196, 104, 0.15);
        }
        .auth-box .auth-btn:active { transform: scale(0.97); }
        .auth-box .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .auth-box .auth-error { color: #f87171; font-size: 13px; min-height: 22px; margin-top: 4px; }
        .auth-box .auth-footer { margin-top: 16px; color: var(--text-secondary); font-size: 11px; opacity: 0.5; line-height: 1.8; }
        .auth-box .auth-footer .author { font-size: 12px; opacity: 0.8; color: var(--accent2); margin-top: 4px; }

        #appWrap { max-width: 820px; margin: 0 auto; padding: 0 10px 20px; display: none; }
        #appWrap.show { display: block; }

        /* ===== 导航样式 ===== */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-page);
            border-bottom: 1px solid rgba(42, 58, 90, 0.25);
            padding: 0 8px;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
            flex-wrap: nowrap;
            overflow-x: auto;
        }
        .top-nav::-webkit-scrollbar { display: none; }
        .top-nav .nav-group {
            display: flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 0;
            padding: 0 4px;
            border-right: 1px solid rgba(42, 58, 90, 0.15);
        }
        .top-nav .nav-group:last-child { border-right: none; }
        .top-nav .nav-group .label {
            font-size: 9px;
            color: var(--text-secondary);
            opacity: 0.4;
            padding-right: 2px;
            font-weight: 600;
            display: none;
        }
        .top-nav .nav-group button[data-tab] {
            padding: 4px 12px;
            font-size: 14px;
            font-weight: 700;
            min-height: 32px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            white-space: nowrap;
            font-family: inherit;
            transition: all 0.15s;
            line-height: 1.4;
        }
        .top-nav .nav-group button[data-tab].active {
            color: var(--accent2);
            background: rgba(232, 196, 104, 0.06);
        }
        .top-nav .nav-group button[data-tab].active::after {
            content: '';
            display: block;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
            margin-top: 1px;
            width: 50%;
            margin-left: auto;
            margin-right: auto;
        }
        .top-nav .nav-group button.mode-btn {
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
            min-height: 28px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            white-space: nowrap;
            font-family: inherit;
            transition: all 0.15s;
            line-height: 1.4;
        }
        .top-nav .nav-group button.mode-btn.active {
            background: rgba(232, 196, 104, 0.12);
            border: 1px solid rgba(232, 196, 104, 0.15);
            color: var(--accent2);
        }
        .top-nav .nav-right {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            padding-left: 6px;
            border-left: 1px solid rgba(42, 58, 90, 0.15);
            margin-left: auto;
        }
        .top-nav .nav-right .vip-tag {
            font-size: 9px;
            color: var(--accent2);
            border: 1px solid rgba(232, 196, 104, 0.2);
            padding: 1px 8px;
            border-radius: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .header {
            padding: 8px 4px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid rgba(42, 58, 90, 0.10);
            margin-bottom: 6px;
        }
        .header .main-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--accent2);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .header .main-title .super-tag {
            background: linear-gradient(135deg, #ffd700, #f5a623);
            color: #0b1526;
            font-weight: 800;
            padding: 1px 10px;
            border-radius: 30px;
            font-size: 9px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.12);
            display: inline-block;
            line-height: 1.6;
        }
        .header .sub-title { font-size: 10px; color: var(--text-secondary); margin-top: 1px; opacity: 0.5; letter-spacing: 0.5px; }
        .header .header-actions {
            margin-top: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header .header-actions .remain-time {
            font-size: 11px;
            font-weight: 600;
            background: rgba(78, 201, 122, 0.06);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(78, 201, 122, 0.08);
            transition: color 0.3s, border-color 0.3s;
        }
        .header .header-actions .remain-time.permanent { color: #fbbf24; border-color: rgba(251, 191, 36, 0.15); background: rgba(251, 191, 36, 0.06); }
        .header .header-actions .remain-time.active { color: #4ec97a; border-color: rgba(78, 201, 122, 0.15); background: rgba(78, 201, 122, 0.06); }
        .header .header-actions .remain-time.warning { color: #fbbf24; border-color: rgba(251, 191, 36, 0.15); background: rgba(251, 191, 36, 0.06); }
        .header .header-actions .remain-time.danger { color: #f87171; border-color: rgba(248, 113, 113, 0.15); background: rgba(248, 113, 113, 0.06); }
        .header .header-actions .unbind-btn {
            font-size: 10px;
            color: #f87171;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(248, 113, 113, 0.15);
            background: rgba(248, 113, 113, 0.05);
            transition: all 0.2s;
            user-select: none;
            font-weight: 500;
        }
        .header .header-actions .unbind-btn:hover { background: rgba(248, 113, 113, 0.12); }
        .header .header-actions .unbind-btn:active { transform: scale(0.95); }
        .header .header-actions .calibrate-status {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-left: 4px;
        }
        .header .header-actions .calibrate-status.active {
            color: #4ec97a;
            border: 1px solid rgba(78, 201, 122, 0.15);
            background: rgba(78, 201, 122, 0.06);
        }
        .header .header-actions .calibrate-status.inactive {
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.02);
        }

        .map-mode-row {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .map-mode-row .map-switch {
            display: flex;
            gap: 3px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            padding: 3px;
            border: 1px solid rgba(42, 58, 90, 0.12);
            flex: 2;
            min-width: 180px;
        }
        .map-mode-row .map-switch button {
            flex: 1;
            padding: 4px 3px;
            background: transparent;
            border: none;
            border-radius: 7px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            min-width: 30px;
            font-family: inherit;
        }
        .map-mode-row .map-switch button.on {
            background: linear-gradient(135deg, rgba(232, 196, 104, 0.12), rgba(232, 196, 104, 0.04));
            color: var(--accent2);
            box-shadow: 0 0 16px rgba(232, 196, 104, 0.04);
            border: 1px solid rgba(232, 196, 104, 0.08);
        }
        .map-mode-row .mode-switch {
            display: flex;
            gap: 3px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            padding: 3px;
            border: 1px solid rgba(42, 58, 90, 0.12);
            flex: 1;
            min-width: 120px;
        }
        .map-mode-row .mode-switch button {
            flex: 1;
            padding: 4px 3px;
            background: transparent;
            border: none;
            border-radius: 7px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            font-family: inherit;
        }
        .map-mode-row .mode-switch button.active {
            background: linear-gradient(135deg, rgba(232, 196, 104, 0.12), rgba(232, 196, 104, 0.04));
            color: var(--accent2);
            border: 1px solid rgba(232, 196, 104, 0.08);
        }

        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 5px;
            margin-bottom: 8px;
        }
        .quick-actions .qa-btn {
            background: var(--bg-card);
            border: 1px solid rgba(42, 58, 90, 0.15);
            border-radius: 8px;
            padding: 6px 4px;
            text-align: center;
            cursor: default;
            font-family: inherit;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            line-height: 1.2;
        }
        .quick-actions .qa-btn .qa-icon { display: block; font-size: 14px; margin-bottom: 1px; }
        .quick-actions .qa-btn .qa-value { color: var(--accent2); font-weight: 800; font-size: 11px; display: block; margin-top: 1px; }
        .quick-actions .qa-btn .qa-label { font-size: 8px; opacity: 0.6; }

        .section {
            background: var(--bg-card);
            border: 1px solid rgba(42, 58, 90, 0.2);
            border-radius: var(--radius);
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: 0 4px 20px var(--shadow);
        }
        .sec-head {
            padding: 6px 10px;
            border-bottom: 1px solid rgba(42, 58, 90, 0.10);
            background: rgba(0, 0, 0, 0.10);
        }
        .sec-title { display: flex; align-items: flex-start; gap: 6px; }
        .sec-title .icon {
            width: 24px;
            height: 24px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #0b1526;
            flex-shrink: 0;
        }
        .sec-title .name { font-size: 13px; font-weight: 700; color: var(--text-primary); }
        .sec-title .role { font-size: 10px; color: var(--text-secondary); opacity: 0.8; line-height: 1.4; }
        .sec-title .role .tip2 { color: var(--accent); display: block; font-size: 10px; opacity: 0.9; }
        .sec-body { padding: 6px 8px 8px; }

        .row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 2px;
            border-bottom: 1px solid rgba(42, 58, 90, 0.05);
            flex-wrap: wrap;
        }
        .row:last-child { border-bottom: none; }
        .row .lbl {
            min-width: 44px;
            font-weight: 600;
            font-size: 11px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .row .lbl .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .row .lbl .dot.red { background: #e05555; }
        .row .lbl .dot.orange { background: #e8943a; }
        .row .lbl .dot.purple { background: #a66be0; }
        .row .lbl .dot.blue { background: #4a9ae8; }
        .row .lbl .dot.green { background: #4ec97a; }

        .row .qty { width: 48px; flex-shrink: 0; }
        .row .qty input {
            width: 100%;
            padding: 3px 2px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            outline: none;
            -moz-appearance: textfield;
            transition: border-color var(--transition), box-shadow var(--transition);
            font-family: inherit;
        }
        .row .qty input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(232, 196, 104, 0.05);
        }
        .row .qty input::-webkit-outer-spin-button,
        .row .qty input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .row .btn-group {
            display: flex;
            gap: 4px;
            flex-wrap: nowrap;
            flex-shrink: 0;
        }
        .row .btn-group .qbtn {
            min-width: 30px;
            height: 28px;
            padding: 0 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-input);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.12s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            user-select: none;
            touch-action: manipulation;
        }
        .row .btn-group .qbtn:active {
            transform: scale(0.92);
            background: rgba(232, 196, 104, 0.10);
            border-color: var(--accent);
            color: var(--accent2);
        }
        .row .btn-group .qbtn:hover {
            border-color: var(--accent);
            color: var(--accent2);
        }
        .row .btn-group .qbtn.neg { color: #f87171; }
        .row .btn-group .qbtn.neg:hover { border-color: #f87171; color: #f87171; }
        .row .btn-group .qbtn.pos { color: #4ec97a; }
        .row .btn-group .qbtn.pos:hover { border-color: #4ec97a; color: #4ec97a; }

        .row .sub {
            flex: 1;
            text-align: right;
            font-weight: 700;
            font-size: 12px;
            color: var(--accent2);
            font-variant-numeric: tabular-nums;
            min-width: 36px;
            margin-left: auto;
        }

        .special-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 2px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(42, 58, 90, 0.08);
        }
        .special-row .lbl { min-width: 44px; font-weight: 600; font-size: 11px; color: var(--text-primary); }
        .special-row .qty { width: 70px; flex-shrink: 0; }
        .special-row .qty input {
            width: 100%;
            padding: 3px 2px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            outline: none;
            font-family: inherit;
        }
        .special-row .qty input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(232, 196, 104, 0.05);
        }
        .special-row .btn-group .qbtn { min-width: 34px; height: 28px; font-size: 11px; padding: 0 8px; }

        .simple-btn-group {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .simple-btn-group .sbtn {
            min-width: 26px;
            height: 26px;
            padding: 0 6px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-input);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.12s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            user-select: none;
            touch-action: manipulation;
        }
        .simple-btn-group .sbtn:active {
            transform: scale(0.92);
            background: rgba(232, 196, 104, 0.10);
            border-color: var(--accent);
            color: var(--accent2);
        }
        .simple-btn-group .sbtn.neg { color: #f87171; }
        .simple-btn-group .sbtn.neg:hover { border-color: #f87171; color: #f87171; }
        .simple-btn-group .sbtn.pos { color: #4ec97a; }
        .simple-btn-group .sbtn.pos:hover { border-color: #4ec97a; color: #4ec97a; }

        .total-bar {
            margin-top: 6px;
            padding: 5px 8px;
            background: linear-gradient(135deg, rgba(232, 196, 104, 0.04), rgba(232, 196, 104, 0.015));
            border: 1px solid rgba(232, 196, 104, 0.06);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 2px;
        }
        .total-bar .t-item { display: flex; align-items: center; gap: 4px; font-size: 10px; }
        .total-bar .t-item .label { color: var(--text-secondary); font-weight: 500; }
        .total-bar .t-item .value { font-weight: 800; color: var(--accent2); font-variant-numeric: tabular-nums; }
        .total-bar .t-item .value.rec { color: #4ec97a; }

        .confidence-bar {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 4px;
            padding: 2px 0;
        }
        .confidence-bar .bar-track {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
            min-width: 30px;
        }
        .confidence-bar .bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s ease;
            background: linear-gradient(90deg, #f87171, #fbbf24, #34d399);
        }
        .confidence-bar .label { font-weight: 500; min-width: 28px; text-align: right; color: var(--accent2); }

        .reset-row { margin-top: 5px; display: flex; justify-content: flex-end; }
        .btn-reset {
            padding: 2px 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-family: inherit;
        }
        .btn-reset:hover { border-color: #f87171; color: #f87171; }

        // ============================================================
        // ★ 核心算法模块
        // ============================================================
        function fmt(n) {
            if (n === undefined || n === null || isNaN(n)) return '0';
            return Math.round(n).toLocaleString();
        }

        function clamp(v, mn, mx) { return Math.min(Math.max(v, mn), mx); }

        function getSegKey(val) {
            var segs = APP_DATA.segments;
            for (var i = 0; i < segs.length; i++) {
                if (val >= segs[i].min && val < segs[i].max) return segs[i].key;
            }
            return 's1';
        }

        var CAL_KEY = 'calibration_factor_seg_v3';

        function getCalFactor(mapKey, val) {
            try {
                var d = JSON.parse(localStorage.getItem(CAL_KEY) || '{}');
                var sk = getSegKey(val);
                if (d[mapKey] && d[mapKey][sk] !== undefined) {
                    var f = parseFloat(d[mapKey][sk]);
                    return clamp(f, APP_DATA.algo.calibration.minFactor, APP_DATA.algo.calibration.maxFactor);
                }
                return 1.0;
            } catch (e) { return 1.0; }
        }

        function setCalFactor(mapKey, val, ratio) {
            try {
                var d = JSON.parse(localStorage.getItem(CAL_KEY) || '{}');
                if (!d[mapKey]) d[mapKey] = {};
                var sk = getSegKey(val);
                var old = d[mapKey][sk] || 1.0;
                var cal = APP_DATA.algo.calibration;
                var deviation = Math.abs(ratio - 1.0);
                var w = (deviation > cal.outlierThreshold) ? cal.outlierWeight : cal.smoothWeight;
                var nf = old * (1 - w) + ratio * w;
                nf = clamp(nf, cal.minFactor, cal.maxFactor);
                nf = Math.round(nf * 1000) / 1000;
                d[mapKey][sk] = nf;
                localStorage.setItem(CAL_KEY, JSON.stringify(d));
                return nf;
            } catch (e) { return ratio; }
        }

        function getCalStatus(mapKey) {
            try {
                var d = JSON.parse(localStorage.getItem(CAL_KEY) || '{}');
                if (!d[mapKey]) return '未校准';
                var parts = [];
                var hasAny = false;
                var segs = APP_DATA.segments;
                for (var i = 0; i < segs.length; i++) {
                    var v = d[mapKey][segs[i].key];
                    if (v !== undefined && Math.abs(v - 1.0) > 0.01) {
                        hasAny = true;
                        parts.push(segs[i].label + ':' + v.toFixed(2));
                    }
                }
                return hasAny ? parts.join(' | ') : '未校准';
            } catch (e) { return '未校准'; }
        }

        function weightedPrice(stat) {
            if (!stat) return 0;
            var avg = stat.avg || 0;
            var med = stat.med || 0;
            var min = stat.min !== undefined ? stat.min : (stat.med || 0) * 0.7;
            if (stat.min === undefined) return avg * 0.6 + med * 0.4;
            var spread = (avg - min) / (avg + 0.01);
            var spreadFactor = clamp(spread, 0, 1);
            var pw = APP_DATA.algo.priceWeight;
            var medWeight = 0.35 + spreadFactor * 0.20;
            var minWeight = 0.15 + spreadFactor * 0.15;
            var avgWeight = 1 - medWeight - minWeight;
            avgWeight = clamp(avgWeight, pw.avgMin, pw.avgMax);
            medWeight = clamp(medWeight, pw.medMin, pw.medMax);
            minWeight = clamp(minWeight, pw.minMin, pw.minMax);
            var totalW = avgWeight + medWeight + minWeight;
            avgWeight /= totalW;
            medWeight /= totalW;
            minWeight /= totalW;
            return avg * avgWeight + med * medWeight + min * minWeight;
        }

        function dynamicRecDiscount(total) {
            var disc = APP_DATA.algo.discount;
            for (var i = disc.length - 1; i >= 0; i--) {
                if (total >= disc[i].threshold) return disc[i].rate;
            }
            return disc[0].rate;
        }

        function calcConfidence(inputCount, totalValue, gridSpread) {
            var cfg = APP_DATA.algo.confidence;
            var base = cfg.base;
            var countBonus = Math.min(0.15, inputCount * cfg.countBonus);
            var valueFactor = clamp(Math.log10(totalValue + 1) / 7, 0, cfg.valueFactor);
            var spreadPenalty = clamp(gridSpread * cfg.spreadPenalty, 0, 0.12);
            var conf = base + countBonus + valueFactor - spreadPenalty;
            return clamp(conf, cfg.min, cfg.max);
        }

        function getMap() { return APP_DATA.maps[currentMap]; }

        function getRedGridPrice(grid, map) {
            var entry = map.redByGrid[grid];
            return entry ? weightedPrice(entry) : 0;
        }

        function getRedGridAvgPrice(map) { return weightedPrice(map.redStat.grid); }

        function getRedPiecePrice(map) { return weightedPrice(map.redStat.piece); }

        function getColorGridPrice(colorKey, map) {
            var data = map.colors[colorKey];
            return data ? weightedPrice(data.grid) : 0;
        }

        function getColorPiecePrice(colorKey, map) {
            var data = map.colors[colorKey];
            return data ? weightedPrice(data.piece) : 0;
        }

        // ============================================================
        function renderAn() {
            var el = document.getElementById('page-an');
            var map = getMap();
            var grids = map.gridOptions || [1, 2, 3, 4, 6, 8, 9, 12, 15, 16];

            el.innerHTML =
                '<div class="section"><div class="sec-head"><div class="sec-title"><div class="icon" style="background:linear-gradient(135deg,#4ec97a,#2a9a5a);">安</div><div><div class="name">安可 · 红品均格/件数反查</div><div class="role">输入平均格数或件数，自动推算所有可能的红品组合及估值</div></div></div></div><div class="sec-body" id="anBody"></div></div>';

            var body = document.getElementById('anBody');

            var html = '<div class="an-input-row">' +
                '<div class="input-group" id="anAvgGroup">' +
                '<span class="label">📐 ' + APP_DATA.text.anAvgLabel + '</span>' +
                '<input type="number" id="anAvg" step="0.1" min="0.1" max="16" value="">' +
                '<span class="unit">' + APP_DATA.text.anUnitGrid + '</span>' +
                '<span class="clear-btn" data-target="anAvg">✕</span>' +
                '</div>' +
                '<div class="input-group" id="anCountGroup">' +
                '<span class="label">📦 ' + APP_DATA.text.anCountLabel + '</span>' +
                '<input type="number" id="anCount" step="1" min="1" max="50" value="">' +
                '<span class="unit">' + APP_DATA.text.anUnitCount + '</span>' +
                '<span class="clear-btn" data-target="anCount">✕</span>' +
                '</div>' +
                '</div>';

            html += '<div style="font-size:10px;color:var(--text-secondary);padding:2px 4px 6px;opacity:0.5;">💡 输入均格或件数，两者互相关联自动推算</div>';

            html += '<div id="anResultSummary" class="an-result-summary" style="display:none;">' +
                '<span class="item"><span class="label">💰 推荐出价：</span><span class="value rec" id="anRec">0</span></span>' +
                '<span class="item"><span class="label">📦 仓库预估：</span><span class="value" id="anTotal">0</span></span>' +
                '<span class="item"><span class="label">🔢 组合数：</span><span class="value" id="anComboCount">0</span></span>' +
                '</div>';

            html += '<div id="anComboList"></div>';
            html += '<div class="reset-row"><button class="btn-reset" id="anReset">' + APP_DATA.text.resetLabel +
            '</button></div>';

            body.innerHTML = html;

            var anAvg = document.getElementById('anAvg');
            var anCount = document.getElementById('anCount');

            body.querySelectorAll('.clear-btn').forEach(function(btn) {
                btn.onclick = function() {
                    var target = document.getElementById(this.dataset.target);
                    if (target) { target.value = '';
                        calcAn(); }
                };
            });

            function calcAn() {
                var avgInput = parseFloat(anAvg.value);
                var countInput = parseInt(anCount.value) || 0;
                var resultSummary = document.getElementById('anResultSummary');
                var comboList = document.getElementById('anComboList');

                var useAvg = !isNaN(avgInput) && avgInput > 0;
                var useCount = countInput > 0;

                if (!useAvg && !useCount) {
                    resultSummary.style.display = 'none';
                    comboList.innerHTML = '<div class="an-empty">请输入平均格数或件数开始推算</div>';
                    updateQuickActions(0, 0, 0, 0);
                    return;
                }

                // 只输入件数 → 推算均格
                if (useCount && !useAvg) {
                    var bestAvg = map.redAvgGrid || 4.3;
                    var countFactor = Math.min(1, countInput / 10);
                    bestAvg = map.redAvgGrid * (0.7 + 0.3 * (1 - countFactor));
                    bestAvg = Math.round(bestAvg * 10) / 10;
                    anAvg.value = bestAvg;
                    avgInput = bestAvg;
                    useAvg = true;
                }

                // 只输入均格 → 推算件数
                if (useAvg && !useCount) {
                    var gridKeys = Object.keys(map.redByGrid).map(Number).sort(function(a, b) { return a - b; });
                    var countEstimate = 0;
                    for (var n = 1; n <= 30; n++) {
                        var total = Math.round(avgInput * n);
                        var match = false;
                        for (var gi = 0; gi < gridKeys.length; gi++) {
                            if (total % gridKeys[gi] === 0 && total / gridKeys[gi] <= n) {
                                match = true;
                                break;
                            }
                        }
                        if (match) { countEstimate = n; break; }
                    }
                    if (countEstimate > 0) {
                        anCount.value = countEstimate;
                        countInput = countEstimate;
                        useCount = true;
                    } else {
                        var approxCount = Math.round(30 / avgInput);
                        if (approxCount > 0) {
                            anCount.value = approxCount;
                            countInput = approxCount;
                            useCount = true;
                        }
                    }
                }

                avgInput = parseFloat(anAvg.value) || 0;
                countInput = parseInt(anCount.value) || 0;

                if (avgInput < 0.1 || countInput < 1) {
                    resultSummary.style.display = 'none';
                    comboList.innerHTML = '<div class="an-empty">请输入有效的平均格数（≥0.1）或件数（≥1）</div>';
                    updateQuickActions(0, 0, 0, 0);
                    return;
                }

                var allCombos = [];
                var maxItems = Math.min(countInput + 5, 30);
                var redAvgPrice = getRedPiecePrice(map);
                var startN = Math.max(1, countInput - 3);
                var endN = Math.min(maxItems, countInput + 5);

                for (var n2 = startN; n2 <= endN; n2++) {
                    var totalGrids = Math.round(avgInput * n2);
                    if (totalGrids < 1) continue;
                    var combosForN = [];

                    function findCombos(remaining, maxIdx, path) {
                        if (remaining === 0 && path.length === n2) {
                            combosForN.push(path.slice());
                            return;
                        }
                        if (path.length >= n2) return;
                        for (var i = maxIdx; i < grids.length; i++) {
                            var g = grids[i];
                            if (g <= remaining) {
                                path.push(g);
                                findCombos(remaining - g, i, path);
                                path.pop();
                            }
                        }
                    }

                    if (n2 <= 10) {
                        findCombos(totalGrids, 0, []);
                        if (combosForN.length > 0) {
                            allCombos.push({ n: n2, total: totalGrids, combos: combosForN, approx: false });
                        }
                    } else {
                        var tempRemain = totalGrids;
                        for (var gi2 = grids.length - 1; gi2 >= 0; gi2--) {
                            if (tempRemain >= grids[gi2]) tempRemain -= grids[gi2];
                        }
                        if (tempRemain === 0 || (tempRemain > 0 && tempRemain % grids[0] === 0)) {
                            allCombos.push({ n: n2, total: totalGrids, combos: null, approx: true });
                        }
                    }
                }

                if (allCombos.length === 0) {
                    for (var n3 = 1; n3 <= 25; n3++) {
                        var totalGrids2 = Math.round(avgInput * n3);
                        if (totalGrids2 < 1) continue;
                        var possible = false;
                        for (var gi3 = 0; gi3 < grids.length; gi3++) {
                            if (totalGrids2 % grids[gi3] === 0) { possible = true; break; }
                        }
                        if (possible) {
                            allCombos.push({ n: n3, total: totalGrids2, combos: null, approx: true });
                        }
                    }
                }

                if (allCombos.length === 0) {
                    resultSummary.style.display = 'none';
                    comboList.innerHTML = '<div class="an-empty">未找到匹配的组合，请调整均格或件数</div>';
                    updateQuickActions(0, 0, 0, 0);
                    return;
                }

                var totalEstimateSum = 0;
                var totalComboCount = 0;

                allCombos.forEach(function(group) {
                    if (group.approx) return;
                    group.combos.forEach(function(combo) {
                        var sum = 0;
                        combo.forEach(function(g) {
                            var entry = map.redByGrid[g];
                            if (entry && entry.avg) sum += entry.avg;
                            else sum += redAvgPrice * g;
                        });
                        totalEstimateSum += sum;
                        totalComboCount++;
                    });
                });

                if (totalComboCount === 0) {
                    allCombos.forEach(function(group) {
                        if (group.approx) {
                            var est = group.total * redAvgPrice;
                            totalEstimateSum += est;
                            totalComboCount++;
                        }
                    });
                }

                var avgEstimate = totalComboCount > 0 ? totalEstimateSum / totalComboCount : 0;
                var factor = getCalFactor(currentMap, avgEstimate);
                var finalEstimate = avgEstimate * factor;
                var disc = dynamicRecDiscount(finalEstimate);
                var rec = finalEstimate * disc;
                if (currentMode === 'aggressive') rec = finalEstimate * APP_DATA.algo.aggressiveDiscount;

                resultSummary.style.display = 'flex';
                document.getElementById('anRec').textContent = fmt(rec);
                document.getElementById('anTotal').textContent = fmt(finalEstimate);
                document.getElementById('anComboCount').textContent = totalComboCount;

                var listHtml = '';
                var maxShow = 12;

                allCombos.forEach(function(group, idx) {
                    var isOpen = idx === 0;
                    var comboLabel = group.approx ? '（近似）' : '';
                    var countLabel = group.approx ? '多种' : group.combos.length;

                    listHtml += '<div class="an-combo-group' + (isOpen ? ' open' : '') + '">' +
                        '<div class="g-head" onclick="this.parentElement.classList.toggle(\'open\')">' +
                        '<span class="g-title">' + group.n + ' 件藏品 ' + comboLabel + '</span>' +
                        '<span class="g-meta">总格数 ' + group.total + ' | 共 ' + countLabel +
                        ' 种组合 <span class="arrow">▶</span></span>' +
                        '</div>' +
                        '<div class="g-body">';

                    if (group.approx || !group.combos || group.combos.length === 0) {
                        var estVal = group.total * redAvgPrice * factor;
                        listHtml += '<span class="an-combo-item"><span class="grids">约 ' + group.total +
                            ' 格</span> <span class="val">≈' + fmt(estVal) + '</span></span>';
                    } else {
                        var showCombos = group.combos.slice(0, maxShow);
                        showCombos.forEach(function(combo) {
                            var sum = 0;
                            combo.forEach(function(g) {
                                var entry = map.redByGrid[g];
                                if (entry && entry.avg) sum += entry.avg;
                                else sum += redAvgPrice * g;
                            });
                            sum *= factor;
                            listHtml += '<span class="an-combo-item"><span class="grids">' + combo.join(
                                '+') +
                                '</span> <span class="val">' + fmt(sum) + '</span></span>';
                        });
                        if (group.combos.length > maxShow) {
                            listHtml += '<span class="more-tag" style="font-size:10px;color:var(--text-secondary);">…共 ' +
                                group.combos.length + ' 种</span>';
                        }
                    }

                    listHtml += '</div></div>';
                });

                comboList.innerHTML = listHtml;
                updateQuickActions(rec, finalEstimate, 0, finalEstimate * 1.2);
                updateCalibrateStatusDisplay();
            }

            anAvg.addEventListener('input', function() {
                var val = parseFloat(this.value);
                if (!isNaN(val) && val > 0) { anCount.value = ''; }
                calcAn();
            });

            anCount.addEventListener('input', function() {
                var val = parseInt(this.value);
                if (!isNaN(val) && val > 0) { anAvg.value = ''; }
                calcAn();
            });

            document.getElementById('anReset').onclick = function() {
                anAvg.value = '';
                anCount.value = '';
                document.getElementById('anResultSummary').style.display = 'none';
                document.getElementById('anComboList').innerHTML = '<div class="an-empty">请输入均格或件数开始推算</div>';
                updateQuickActions(0, 0, 0, 0);
            };

            document.getElementById('anComboList').innerHTML = '<div class="an-empty">请输入均格或件数开始推算</div>';
        }

        // ============================================================
        // ★ 认证与启动
        // ============================================================
        var appWrap = document.getElementById('appWrap');
        var authOverlay = document.getElementById('authOverlay');
        var cardInput = document.getElementById('cardInput');
        var verifyBtn = document.getElementById('verifyBtn');
        var authError = document.getElementById('authError');
        var headerRemain = document.getElementById('headerRemain');

        function showApp(data) {
            authOverlay.classList.add('hidden');
            appWrap.classList.add('show');
            if (data) updateRemainDisplay(data);
            updateCalibrateStatusDisplay();
        }

        function showAuth() {
            authOverlay.classList.remove('hidden');
            appWrap.classList.remove('show');
        }

        function setAuthError(msg) { authError.textContent = msg; }

        function updateRemainDisplay(data) {
            if (!data) return;
            var now = Date.now();
            var elapsed = (now - data.verifyTime) / 1000;
            var remainMin = Math.max(0, data.minutes - elapsed / 60);
            if (data.cardType === '永久卡') {
                headerRemain.textContent = '♾️ 永久有效';
                headerRemain.className = 'remain-time permanent';
                return;
            }
            var days = Math.floor(remainMin / 1440);
            var hours = Math.floor((remainMin % 1440) / 60);
            var mins = Math.floor(remainMin % 60);
            var parts = [];
            if (days > 0) parts.push(days + '天');
            if (hours > 0) parts.push(hours + '时');
            if (mins > 0) parts.push(mins + '分');
            if (parts.length === 0) parts.push('0分');
            var text = '⏱ 剩余 ' + parts.join('') + ' · ' + data.cardType;
            headerRemain.textContent = text;
            var type = 'active';
            if (days < 1 && hours < 6) type = 'warning';
            if (days < 1 && hours < 1) type = 'danger';
            headerRemain.className = 'remain-time ' + type;
        }

        var remainTimer = null;

        function startRemainTimer(data) {
            if (remainTimer) clearInterval(remainTimer);
            updateRemainDisplay(data);
            remainTimer = setInterval(function() {
                var cached = _getSecure();
                if (cached) {
                    var now = Date.now();
                    var elapsed = (now - cached._t) / 1000;
                    var remainMin = Math.max(0, cached._d._m - elapsed / 60);
                    if (remainMin <= 0) {
                        clearInterval(remainTimer);
                        remainTimer = null;
                        _clearSecure();
                        showAuth();
                        setAuthError('卡密已过期');
                        return;
                    }
                    updateRemainDisplay({ cardType: cached._d._ct, minutes: cached._d._m, verifyTime: cached
                            ._t });
                } else {
                    clearInterval(remainTimer);
                    remainTimer = null;
                }
            }, 10000);
        }

        document.getElementById('unbindBtn').addEventListener('click', function() {
            if (confirm('确定要解绑此设备吗？\n解绑后需要重新激活。')) {
                _clearSecure();
                if (remainTimer) clearInterval(remainTimer);
                showAuth();
                cardInput.value = '';
                setAuthError('');
                headerRemain.textContent = '⏱ 已解绑';
                location.reload();
            }
        });

        function initAuthUI() {
            var cached = _getSecure();
            if (cached) {
                var elapsed = (Date.now() - cached._t) / 1000;
                var remainMin = Math.max(0, cached._d._m - elapsed / 60);
                if (remainMin > 0) {
                    showApp({ cardType: cached._d._ct, minutes: cached._d._m, verifyTime: cached._t });
                    startRemainTimer({ cardType: cached._d._ct, minutes: cached._d._m, verifyTime: cached
                            ._t });
                    setTimeout(function() { renderMainApp(); }, 100);
                    return;
                } else {
                    _clearSecure();
                }
            }

            verifyBtn.onclick = function() {
                var card = cardInput.value.trim();
                if (!card) { setAuthError('请输入卡密'); return; }
                setAuthError('');
                verifyBtn.disabled = true;
                verifyBtn.textContent = '⏳ 验证中...';
                _verifyWithKeyt(card, function(success, days, minutes, cardType, error) {
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = '✅ 激活';
                    if (success) {
                        _saveSecure(card, { cardType: cardType, minutes: minutes, days: days });
                        showApp({ cardType: cardType, minutes: minutes, verifyTime: Date.now() });
                        startRemainTimer({ cardType: cardType, minutes: minutes, verifyTime: Date
                                .now() });
                        renderMainApp();
                    } else {
                        if (error === 'timeout' || error === 'network') setAuthError('⚠️ 网络异常，请检查后重试');
                        else setAuthError('❌ 卡密无效或已过期');
                    }
                });
            };
            cardInput.onkeydown = function(e) { if (e.key === 'Enter') verifyBtn.click(); };
            showAuth();
        }

        function renderMainApp() {
            document.querySelectorAll('.mode-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.mode === currentMode);
            });
            document.querySelectorAll('.map-switch button').forEach(function(btn) {
                btn.classList.toggle('on', btn.dataset.map === currentMap);
            });
            updateCalibrateStatusDisplay();
            var fn = { 'huo': renderHuo, 'gao': renderGao, 'su': renderSu, 'an': renderAn };
            if (fn[currentTab]) fn[currentTab]();
        }

        initAuthUI();
        setTimeout(renderMainApp, 300);

        console.log('✅ 超级AI v3.1 已启动 — 虚拟控制流混淆已启用');
        console.log('📊 数据配置层已分离，可独立修改 APP_DATA');
        console.log('🔧 安可模块支持均格/件数双模式输入，计算模型一致');
        console.log('🔐 反调试保护已启用');
    </script>
</body>
</html>
