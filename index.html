<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>俱乐大玩家 · 迪城修正版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-page: #0a0e1a;
            --bg-card: #111827;
            --bg-card2: #1a2332;
            --bg-input: #0d1422;
            --border-color: #2a3a5a;
            --text-primary: #e8eef8;
            --text-secondary: #8aa0c8;
            --accent: #e8c468;
            --accent2: #f5dd9a;
            --shadow: rgba(0,0,0,0.5);
            --radius: 14px;
            --transition: 0.2s ease;
            --nav-height: 52px;
        }
        body {
            background: var(--bg-page);
            color: var(--text-primary);
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            font-size: 14px;
            line-height: 1.6;
            padding-bottom: 40px;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-page); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

        #authOverlay {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: var(--bg-page);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.4s ease;
        }
        #authOverlay.hidden { opacity: 0; pointer-events: none; }
        .auth-box {
            width: 420px;
            max-width: 100%;
            background: var(--bg-card);
            border: 1px solid rgba(232,196,104,0.12);
            border-radius: var(--radius);
            padding: 34px 28px 24px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .auth-box .auth-icon { font-size: 44px; display: block; margin-bottom: 2px; }
        .auth-box .auth-title {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2px;
        }
        .auth-box .auth-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700, #f5a623);
            color: #0b1526;
            font-weight: 800;
            padding: 3px 20px;
            border-radius: 30px;
            font-size: 13px;
            box-shadow: 0 0 30px rgba(255,215,0,0.15);
            border: 1px solid rgba(255,215,0,0.15);
            margin: 4px 0 12px;
        }
        .auth-box .auth-sub {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 10px;
            line-height: 1.7;
        }
        .auth-box .auth-input-wrap { position: relative; margin-bottom: 12px; }
        .auth-box .auth-input-wrap input {
            width: 100%;
            padding: 13px 18px;
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 4px;
            font-family: 'SF Mono', 'Menlo', monospace;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .auth-box .auth-input-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(232,196,104,0.06);
        }
        .auth-box .auth-btn {
            width: 100%;
            padding: 13px 0;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            color: #0b1526;
            background: linear-gradient(135deg, var(--accent), #c9a23e);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.3s;
            box-shadow: 0 4px 20px rgba(232,196,104,0.15);
            letter-spacing: 0.5px;
        }
        .auth-box .auth-btn:active { transform: scale(0.97); }
        .auth-box .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .auth-box .auth-error { color: #f87171; font-size: 13px; min-height: 22px; margin-top: 4px; }

        #appWrap { max-width: 820px; margin: 0 auto; padding: 0 12px 20px; display: none; }
        #appWrap.show { display: block; }

        .top-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-page);
            border-bottom: 1px solid rgba(42,58,90,0.25);
            padding: 0 10px;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.3);
            flex-wrap: nowrap;
            overflow-x: auto;
        }
        .top-nav::-webkit-scrollbar { display: none; }
        .top-nav .nav-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            padding: 0 6px;
            border-right: 1px solid rgba(42,58,90,0.15);
        }
        .top-nav .nav-group:last-child { border-right: none; }
        .top-nav .nav-group .label {
            font-size: 10px;
            color: var(--text-secondary);
            opacity: 0.5;
            padding-right: 2px;
            font-weight: 600;
            display: none;
        }
        .top-nav .nav-group button[data-tab] {
            padding: 6px 16px;
            font-size: 15px;
            font-weight: 700;
            min-height: 36px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
            white-space: nowrap;
            font-family: inherit;
            transition: all 0.15s;
            line-height: 1.4;
        }
        .top-nav .nav-group button[data-tab].active { color: var(--accent2); background: rgba(232,196,104,0.06); }
        .top-nav .nav-group button[data-tab].active::after {
            content: '';
            display: block;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
            margin-top: 2px;
            width: 60%;
            margin-left: auto;
            margin-right: auto;
        }
        .top-nav .nav-group button.mode-btn {
            padding: 5px 14px;
            font-size: 13px;
            font-weight: 700;
            min-height: 32px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            white-space: nowrap;
            font-family: inherit;
            transition: all 0.15s;
            line-height: 1.4;
        }
        .top-nav .nav-group button.mode-btn.active {
            background: rgba(232,196,104,0.12);
            border: 1px solid rgba(232,196,104,0.15);
            color: var(--accent2);
        }
        .top-nav .nav-right {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            padding-left: 6px;
            border-left: 1px solid rgba(42,58,90,0.15);
            margin-left: auto;
        }
        .top-nav .nav-right .vip-tag {
            font-size: 9px;
            color: var(--accent2);
            border: 1px solid rgba(232,196,104,0.2);
            padding: 1px 8px;
            border-radius: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .header { padding: 10px 4px 6px; display: flex; flex-direction: column; align-items: center; text-align: center; border-bottom: 1px solid rgba(42,58,90,0.10); margin-bottom: 6px; }
        .header .main-title { font-size: 18px; font-weight: 800; color: var(--accent2); letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .header .main-title .super-tag { background: linear-gradient(135deg, #ffd700, #f5a623); color: #0b1526; font-weight: 800; padding: 1px 12px; border-radius: 30px; font-size: 10px; box-shadow: 0 0 30px rgba(255,215,0,0.12); border: 1px solid rgba(255,215,0,0.12); display: inline-block; line-height: 1.6; }
        .header .sub-title { font-size: 11px; color: var(--text-secondary); margin-top: 1px; opacity: 0.5; letter-spacing: 0.5px; }
        .header .header-actions { margin-top: 4px; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }
        .header .header-actions .remain-time { font-size: 12px; font-weight: 600; background: rgba(78,201,122,0.06); padding: 2px 14px; border-radius: 20px; border: 1px solid rgba(78,201,122,0.08); transition: color 0.3s, border-color 0.3s; }
        .header .header-actions .remain-time.permanent { color: #fbbf24; border-color: rgba(251,191,36,0.15); background: rgba(251,191,36,0.06); }
        .header .header-actions .remain-time.active { color: #4ec97a; border-color: rgba(78,201,122,0.15); background: rgba(78,201,122,0.06); }
        .header .header-actions .remain-time.warning { color: #fbbf24; border-color: rgba(251,191,36,0.15); background: rgba(251,191,36,0.06); }
        .header .header-actions .remain-time.danger { color: #f87171; border-color: rgba(248,113,113,0.15); background: rgba(248,113,113,0.06); }
        .header .header-actions .unbind-btn { font-size: 11px; color: #f87171; cursor: pointer; padding: 2px 12px; border-radius: 20px; border: 1px solid rgba(248,113,113,0.15); background: rgba(248,113,113,0.05); transition: all 0.2s; user-select: none; font-weight: 500; }
        .header .header-actions .unbind-btn:hover { background: rgba(248,113,113,0.12); }
        .header .header-actions .unbind-btn:active { transform: scale(0.95); }

        .map-mode-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .map-mode-row .map-switch { display: flex; gap: 4px; background: rgba(0,0,0,0.15); border-radius: 12px; padding: 4px; border: 1px solid rgba(42,58,90,0.12); flex: 2; min-width: 200px; }
        .map-mode-row .map-switch button { flex: 1; padding: 5px 4px; background: transparent; border: none; border-radius: 9px; color: var(--text-secondary); font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; min-width: 36px; font-family: inherit; }
        .map-mode-row .map-switch button.on { background: linear-gradient(135deg, rgba(232,196,104,0.12), rgba(232,196,104,0.04)); color: var(--accent2); box-shadow: 0 0 16px rgba(232,196,104,0.04); border: 1px solid rgba(232,196,104,0.08); }
        .map-mode-row .mode-switch { display: flex; gap: 4px; background: rgba(0,0,0,0.15); border-radius: 12px; padding: 4px; border: 1px solid rgba(42,58,90,0.12); flex: 1; min-width: 140px; }
        .map-mode-row .mode-switch button { flex: 1; padding: 5px 4px; background: transparent; border: none; border-radius: 9px; color: var(--text-secondary); font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; font-family: inherit; }
        .map-mode-row .mode-switch button.active { background: linear-gradient(135deg, rgba(232,196,104,0.12), rgba(232,196,104,0.04)); color: var(--accent2); border: 1px solid rgba(232,196,104,0.08); }

        .quick-actions { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
        .quick-actions .qa-btn { background: var(--bg-card); border: 1px solid rgba(42,58,90,0.15); border-radius: 10px; padding: 8px 4px; text-align: center; cursor: default; font-family: inherit; color: var(--text-secondary); font-size: 11px; font-weight: 600; line-height: 1.3; }
        .quick-actions .qa-btn .qa-icon { display: block; font-size: 16px; margin-bottom: 1px; }
        .quick-actions .qa-btn .qa-value { color: var(--accent2); font-weight: 800; font-size: 12px; display: block; margin-top: 1px; }
        .quick-actions .qa-btn .qa-label { font-size: 9px; opacity: 0.6; }

        .section { background: var(--bg-card); border: 1px solid rgba(42,58,90,0.2); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; box-shadow: 0 4px 20px var(--shadow); }
        .sec-head { padding: 8px 12px; border-bottom: 1px solid rgba(42,58,90,0.10); background: rgba(0,0,0,0.10); }
        .sec-title { display: flex; align-items: flex-start; gap: 8px; }
        .sec-title .icon { width: 28px; height: 28px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #0b1526; flex-shrink: 0; }
        .sec-title .name { font-size: 14px; font-weight: 700; color: var(--text-primary); }
        .sec-title .role { font-size: 11px; color: var(--text-secondary); opacity: 0.8; line-height: 1.5; }
        .sec-title .role .tip2 { color: var(--accent); display: block; font-size: 11px; opacity: 0.9; }
        .sec-body { padding: 8px 10px 10px; }

        .row { display: flex; align-items: center; gap: 5px; padding: 4px 2px; border-bottom: 1px solid rgba(42,58,90,0.05); flex-wrap: wrap; }
        .row:last-child { border-bottom: none; }
        .row .lbl { min-width: 50px; font-weight: 600; font-size: 12px; color: var(--text-primary); }
        .row .qty { width: 56px; flex-shrink: 0; }
        .row .sub { flex: 1; text-align: right; font-weight: 700; font-size: 13px; color: var(--accent2); font-variant-numeric: tabular-nums; min-width: 44px; }

        input[type="number"], input[type="text"] { width: 100%; padding: 5px 3px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-size: 12px; font-weight: 600; text-align: center; outline: none; -moz-appearance: textfield; transition: border-color var(--transition), box-shadow var(--transition); font-family: inherit; }
        input[type="number"]:focus, input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,196,104,0.05); }
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .total-bar { margin-top: 8px; padding: 6px 10px; background: linear-gradient(135deg, rgba(232,196,104,0.04), rgba(232,196,104,0.015)); border: 1px solid rgba(232,196,104,0.06); border-radius: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 2px; }
        .total-bar .t-item { display: flex; align-items: center; gap: 4px; font-size: 11px; }
        .total-bar .t-item .label { color: var(--text-secondary); font-weight: 500; }
        .total-bar .t-item .value { font-weight: 800; color: var(--accent2); font-variant-numeric: tabular-nums; }
        .total-bar .t-item .value.rec { color: #4ec97a; }
        .total-bar .t-item .value.profit { color: #fbbf24; }
        .total-bar .t-item .value.estimate { color: #60a5fa; }

        .confidence-bar { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); margin-top: 5px; padding: 2px 0; }
        .confidence-bar .bar-track { flex: 1; height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; min-width: 40px; }
        .confidence-bar .bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; background: linear-gradient(90deg, #f87171, #fbbf24, #34d399); }
        .confidence-bar .label { font-weight: 500; min-width: 30px; text-align: right; color: var(--accent2); }

        .mode-tag { display: inline-block; padding: 1px 12px; border-radius: 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.3px; margin-bottom: 6px; }
        .mode-tag.conservative { background: rgba(78,201,122,0.10); color: #4ec97a; border: 1px solid rgba(78,201,122,0.15); }
        .mode-tag.balanced { background: rgba(232,196,104,0.10); color: var(--accent2); border: 1px solid rgba(232,196,104,0.15); }
        .mode-tag.aggressive { background: rgba(248,113,113,0.12); color: #f87171; border: 1px solid rgba(248,113,113,0.20); }

        .car-pool-btns { display: flex; align-items: center; gap: 6px; margin-top: 4px; padding: 4px 0; flex-wrap: wrap; }
        .car-pool-btns .label { font-size: 12px; color: var(--text-secondary); font-weight: 500; margin-right: 4px; }
        .car-pool-btns .car-btn { padding: 4px 12px; border: 1px solid var(--border-color); border-radius: 8px; background: transparent; color: var(--text-secondary); font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit; white-space: nowrap; }
        .car-pool-btns .car-btn.active { background: rgba(232,196,104,0.12); border-color: var(--accent); color: var(--accent2); }
        .car-pool-btns .car-btn .badge { font-size: 9px; opacity: 0.6; }
        .car-pool-btns .car-tag { font-size: 11px; color: var(--accent2); font-weight: 700; min-width: 60px; }

        .reset-row { margin-top: 6px; display: flex; justify-content: flex-end; }
        .btn-reset { padding: 3px 12px; background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); border-radius: 8px; font-size: 11px; cursor: pointer; transition: all 0.2s; font-weight: 500; font-family: inherit; }
        .btn-reset:hover { border-color: #f87171; color: #f87171; }

        .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px; vertical-align: middle; flex-shrink: 0; }
        .dot.red { background: #e05555; }
        .dot.orange { background: #e8943a; }
        .dot.purple { background: #a66be0; }
        .dot.blue { background: #4a9ae8; }
        .dot.green { background: #4ec97a; }

        .page { display: none; animation: fadeUp 0.25s ease; }
        .page.active { display: block; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

        .rev-group .g-body { display: none; padding: 4px 8px 6px; flex-wrap: wrap; gap: 3px; }
        .rev-group.open .g-body { display: flex; }
        .rev-group .g-head .g-meta { font-size: 10px; color: var(--text-secondary); }
        .rev-group .g-title { font-weight: 700; font-size: 12px; color: var(--accent2); }
        .combo { display: inline-block; background: rgba(0,0,0,0.2); border: 1px solid rgba(42,58,90,0.12); border-radius: 6px; padding: 2px 6px; margin: 2px 2px 0 0; font-size: 11px; white-space: nowrap; }
        .more-tag { font-size: 10px; color: var(--accent); padding: 4px 3px; display: inline-block; }
        .empty { color: var(--text-secondary); font-size: 12px; padding: 8px 4px; }
        .btn-gold { padding: 6px 14px; background: linear-gradient(135deg, var(--accent), #c9a23e); color: #0b1526; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; min-height: 34px; font-family: inherit; }
        .field label { display: block; font-size: 10px; color: var(--text-secondary); }

        .collapse-toggle {
            padding: 4px 6px;
            text-align: center;
            font-size: 11px;
            color: var(--accent);
            cursor: pointer;
            border-top: 1px dashed rgba(42,58,90,0.12);
        }
        .collapse-toggle:hover { color: var(--accent2); }

        @media (max-width: 480px) {
            .top-nav .nav-group button[data-tab] { font-size: 13px; padding: 4px 10px; min-height: 30px; }
            .top-nav .nav-group button.mode-btn { font-size: 11px; padding: 3px 8px; min-height: 26px; }
            .top-nav .nav-group .label { display: none; }
            .top-nav .nav-right .vip-tag { font-size: 8px; padding: 1px 5px; }
            .sec-body { padding: 6px 6px 8px; }
            .row .lbl { min-width: 42px; font-size: 11px; }
            .row .qty { width: 48px; }
            .total-bar .t-item { font-size: 10px; }
            #appWrap { padding: 0 6px 16px; }
            .car-pool-btns .car-btn { padding: 3px 8px; font-size: 10px; }
            .quick-actions { grid-template-columns: 1fr 1fr; }
            .header .main-title { font-size: 16px; }
            .map-mode-row { flex-direction: column; }
            .map-mode-row .map-switch, .map-mode-row .mode-switch { flex: 1; }
            .map-mode-row .map-switch button, .map-mode-row .mode-switch button { font-size: 10px; padding: 4px 2px; min-width: 30px; }
        }
        @media (min-width: 600px) {
            .top-nav .nav-group .label { display: inline-block; }
            .quick-actions { grid-template-columns: 1fr 1fr 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="auth-box">
            <span class="auth-icon">🔐</span>
            <div class="auth-title">俱乐大玩家 · 迪城修正版</div>
            <div class="auth-badge">🌟 超级AI定制版</div>
            <div class="auth-sub">请输入卡密激活</div>
            <div class="auth-input-wrap">
                <input id="cardInput" type="text" placeholder="请输入卡密" autocomplete="off" spellcheck="false" />
            </div>
            <button id="verifyBtn" class="auth-btn">✅ 激活</button>
            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <div id="appWrap">

        <nav class="top-nav" id="topNav">
            <div class="nav-group">
                <span class="label">角色</span>
                <button class="active" data-tab="huo">霍姑姑</button>
                <button data-tab="gao">高晋</button>
                <button data-tab="su">苏琦</button>
                <button data-tab="an">安可</button>
            </div>
            <div class="nav-group">
                <span class="label">模式</span>
                <button class="mode-btn active" data-mode="balanced">⚖️ 均衡</button>
                <button class="mode-btn" data-mode="conservative">🛡️ 保守</button>
                <button class="mode-btn" data-mode="aggressive">🔥 赌大红</button>
            </div>
            <div class="nav-right">
                <span class="vip-tag">📊 迪城修正版</span>
            </div>
        </nav>

        <div class="header">
            <div class="main-title">
                俱乐大玩家 · 迪城修正版
                <span class="super-tag">📊 真实数据校准</span>
            </div>
            <div class="sub-title"></div>
            <div class="header-actions">
                <span class="remain-time" id="headerRemain">⏱ 加载中...</span>
                <span class="unbind-btn" id="unbindBtn">🔓 解绑设备</span>
            </div>

            var saved = localStorage.getItem('device_id');

            try {
                var canvas = document.createElement('canvas');
                var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    var info = gl.getExtension('WEBGL_debug_renderer_info');
                    if (info) {
                        var gpu = gl.getParameter(info.UNMASKED_RENDERER_WEBGL) || '';
                        if (gpu) parts.push('gpu:' + gpu);
                    }
                }
            } catch (e) {}
            if (parts.length === 0) {
                try {
                    var c = document.createElement('canvas');
                    c.width = 256;
                    c.height = 64;
                    var ctx = c.getContext('2d');
                    if (ctx) {

                        ctx.fill();
                        parts.push('canvas:' + CryptoJS.MD5(c.toDataURL()).toString());
                    }
                } catch (e) {}
            }
            if (parts.length === 0) {
                parts.push('screen:' + (screen.width||0) + 'x' + (screen.height||0) + 'x' + (screen.colorDepth||24));

                parts.push('os:' + os);
                parts.push('lang:' + (navigator.language || navigator.userLanguage || 'zh-CN'));
            }
            var id = 'web_' + CryptoJS.MD5(parts.join('|')).toString();
            localStorage.setItem('device_id', id);
            return id;
        }

            var xhr = new XMLHttpRequest();
            var timer = setTimeout(function() { xhr.abort();

            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {

                    if (xhr.status === 200) callback(xhr.responseText);
                    else callback('error|network_error');
                }
            };
            xhr.send();

            var url = CONFIG.API_URL + '?card=' + encodeURIComponent(card) + '&mac=' + encodeURIComponent(deviceId) +
                '&app=' + CONFIG.APP_NAME;
            requestWithTimeout(url, CONFIG.REQUEST_TIMEOUT, function(response) {
                var pos = response.indexOf('|sign=');
                if (pos !== -1) response = response.substring(0, pos);
                var parts = response.split('|');
                if (parts[0] === 'ok') {
                    var days = parts[2] || '未知';
                    var minutes = parseInt(parts[3]) || 0;
                    var cardType = '天卡';
                    if (minutes >= 999999) cardType = '永久卡';
                    else if (minutes >= 43200) cardType = '月卡';
                    else if (minutes >= 10080) cardType = '周卡';
                    else if (minutes >= 1440) cardType = '天卡';
                    else cardType = '小时卡';
                    callback(true, days, minutes, cardType);
                } else {
                    if (attempt < CONFIG.MAX_RETRIES) {
                        setTimeout(function() { verifyWithServer(card, callback, attempt + 1); }, CONFIG.RETRY_DELAY);
                    } else {
                        callback(false, null, null, null);
                    }
                }
            });
        }

        function weightedPrice(stat, adjustWeight) {
            if (!stat) return 0;
            var avg = stat.avg || 0;
            var med = stat.med || 0;
            var min = stat.min !== undefined ? stat.min : (stat.med || 0) * 0.7;
            if (stat.min === undefined) {
                return avg * 0.6 + med * 0.4;
            }
            var spread = (avg - min) / (avg + 0.01);
            var medWeight = 0.35 + Math.min(0.15, spread * 0.3);
            var minWeight = 0.25 - Math.min(0.15, spread * 0.3);
            var avgWeight = 1 - medWeight - minWeight;
            avgWeight = Math.max(0.3, Math.min(0.6, avgWeight));
            medWeight = Math.max(0.25, Math.min(0.5, medWeight));
            minWeight = Math.max(0.05, Math.min(0.3, minWeight));
            var totalW = avgWeight + medWeight + minWeight;
            avgWeight /= totalW;
            medWeight /= totalW;
            minWeight /= totalW;
            var price = avg * avgWeight + med * medWeight + min * minWeight;
            if (adjustWeight && typeof adjustWeight === 'number') {
                price = price * (1 + (adjustWeight - 1) * 0.3);
            }
            return price;
        }

        function getColorGridPrice(key, map) { var d = map.colors[key]; return d ? weightedPrice(d.grid) : 0; }
        function getColorPiecePrice(key, map) { var d = map.colors[key]; return d ? weightedPrice(d.piece) : 0; }
        function getRedPiecePrice(map) { return weightedPrice(map.redStat.piece); }
        function getRedGridAvgPrice(map) { return weightedPrice(map.redStat.grid); }

        function calcAll(baseTotal, redSubtotal, carLevel, modeKey, mapKey, redCount) {
            var mode = getModeConfig(modeKey);
            var boost = MAP_BOOST[mapKey] || 1.0;
            var redRatio = baseTotal > 0 ? Math.min(1, redSubtotal / baseTotal) : 0;

            if (mapKey === 'dicheng') {
                var baseDisc = (modeKey === 'aggressive') ? 0.92 : 0.90;
                var redBonus = Math.min(0.06, (redCount || 0) * 0.002);
                var finalDisc = Math.min(0.96, baseDisc + redBonus);
                var warehouse = Math.round(baseTotal);
                var bid = Math.round(warehouse * finalDisc);
                var high = Math.round(warehouse * 1.15);
                return { warehousePrice: warehouse, bidPrice: bid, highPrice: high, finalDisc: finalDisc, redRatio: redRatio };
            }

            var warehouse = Math.round(baseTotal * boost);
            var baseDisc = mode.recDiscount || 0.87;
            var redBonus = redRatio * 0.12;
            var carBonus = (carLevel || 0) * 0.025;
            var finalDisc = Math.min(0.96, baseDisc + redBonus + carBonus);
            var bid = Math.round(warehouse * finalDisc);
            var high = Math.round(warehouse * 1.15);
            return { warehousePrice: warehouse, bidPrice: bid, highPrice: high, finalDisc: finalDisc, redRatio: redRatio };
        }

        function calcConfidence(cnt, redRatio, carLevel, modeKey, mapKey) {
            var conf = 0.88 + Math.min(0.10, cnt * 0.01);
            if (redRatio > 0.3) conf += 0.02;
            if (redRatio > 0.6) conf += 0.02;
            if (carLevel > 0) conf += 0.02;
            if (modeKey === 'aggressive') conf -= 0.05;
            if (mapKey === 'dicheng') conf = Math.min(conf, 0.92);
            return Math.min(0.96, Math.max(0.55, conf));
        }

        function updateRemainDisplay(data) {
            if (!data) return;
            var now = Date.now();
            var elapsed = (now - data.verifyTime) / 1000;
            var remainMin = Math.max(0, data.minutes - elapsed / 60);
            if (data.cardType === '永久卡') {
                headerRemain.textContent = AUTH_TEXT.remainPermanent;
                headerRemain.className = 'remain-time permanent';
                return;
            }
            var days = Math.floor(remainMin / 1440);
            var hours = Math.floor((remainMin % 1440) / 60);
            var mins = Math.floor(remainMin % 60);
            var parts = [];
            if (days > 0) parts.push(days + '天');
            if (hours > 0) parts.push(hours + '时');
            if (mins > 0) parts.push(mins + '分');
            if (parts.length === 0) parts.push('0分');
            var text = AUTH_TEXT.remainFormat.replace('{time}', parts.join('')).replace('{type}', data.cardType);
            headerRemain.textContent = text;
            var type = 'active';
            if (days < 1 && hours < 6) type = 'warning';
            if (days < 1 && hours < 1) type = 'danger';
            headerRemain.className = 'remain-time ' + type;
        }

                else { clearInterval(remainTimer);

            var html = '<div class="section"><div class="sec-head"><div class="sec-title"><div class="icon" style="background:linear-gradient(135deg,#4ec97a,#2a9a5a);">安</div><div><div class="name">安可 · 红品均格反查</div><div class="role">第一回合用红格道具，每回合看到轮廓后把格数输进去缩小范围。</div></div></div></div><div class="sec-body" id="anBody"></div></div>';
            el.innerHTML = html;
            var body = document.getElementById('anBody');
            body.innerHTML = '<div class="mode-tag ' + cfg.tagClass + '">' + cfg.tagText +
                '</div><div class="rev-input" style="display:flex;gap:5px;flex-wrap:wrap;align-items:flex-end;"><div class="field" style="flex:1;min-width:70px;"><label style="display:block;font-size:10px;color:var(--text-secondary);">平均格数</label><input type="number" id="anAvg" step="0.1" min="1" placeholder="如 3.5" style="width:100%;padding:5px 3px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:12px;text-align:center;outline:none;"></div><div class="field" style="flex:1;min-width:70px;"><label style="display:block;font-size:10px;color:var(--text-secondary);">红品数量（可选）</label><input type="number" id="anCount" min="1" max="50" placeholder="不限" style="width:100%;padding:5px 8px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:12px;text-align:center;outline:none;"></div><button class="btn-gold" id="anBtn" style="padding:6px 14px;background:linear-gradient(135deg,var(--accent),#c9a23e);color:#0b1526;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;min-height:34px;font-family:inherit;">推算</button></div><div style="margin-top:4px;"><label style="font-size:10px;color:var(--text-secondary);">已知格数（选填，用逗号分隔）</label><input type="text" id="anKnown" placeholder="如 4,6,8" style="width:100%;padding:5px 8px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);outline:none;"></div><div class="rev-result" id="anResult" style="margin-top:8px;"></div><div class="reset-row"><button class="btn-reset" id="anReset">重置数据</button></div>';

            document.getElementById('anBtn').onclick = function() {
                var avg = parseFloat(document.getElementById('anAvg').value);
                var count = parseInt(document.getElementById('anCount').value) || 0;
                var knownStr = document.getElementById('anKnown').value.trim();
                var known = knownStr ? knownStr.split(',').map(function(s) { return parseInt(s.trim()); })
                    .filter(function(n) { return !isNaN(n) && n > 0; }) : [];
                var result = document.getElementById('anResult');
                if (isNaN(avg) || avg < 1) { result.innerHTML = '<div class="empty">请输入有效的平均格数</div>';
                    return; }
                var combos = [];
                var maxN = count > 0 ? count : 20;
                var minN = count > 0 ? count : 1;
                for (var n = minN; n <= maxN; n++) {
                    var ok = true;
                    for (var i = 0; i < known.length; i++) { if (!gridSet.has(known[i])) { ok = false; break; } }
                    if (!ok) continue;
                    var total = Math.round(avg * n);
                    var list = [];

                    function find(rem, idx, path) {
                        if (rem === 0 && path.length === n) { list.push(path.slice()); return; }
                        if (path.length >= n) return;
                        for (var j = idx; j < grids.length; j++) {
                            var g = grids[j];
                            if (g <= rem) { path.push(g);
                                find(rem - g, j, path);
                                path.pop(); }
                        }
                    }
                    if (n <= 8) { find(total, 0, []);
                        if (list.length > 0) combos.push({ n: n, total: total, combos: list }); } else { combos
                            .push({ n: n, total: total, combos: null, approx: true }); }
                }
                if (combos.length === 0) { result.innerHTML = '<div class="empty">未找到匹配组合，请检查输入</div>';
                    return; }
                var htmlResult = '';
                var maxShow = 10;
                var rpp = getRedPiecePrice(map);
                combos.forEach(function(item) {
                    var est = Math.round(item.n * rpp);
                    var minV = 0;
                    if (item.combos) {
                        var minTotal = Infinity;
                        item.combos.forEach(function(c) {
                            var s = 0;
                            c.forEach(function(g) {
                                var price = getRedGridPrice(g, map);
                                s += price;
                            });
                            if (s < minTotal) minTotal = s;
                        });
                        if (minTotal !== Infinity) minV = minTotal;
                    }
                    var label = '预估价值：' + fmt(est);
                    if (minV > 0) label = '最低价值：' + fmt(minV) + ' | 预估价值：' + fmt(est);
                    htmlResult += '<div class="rev-group" style="background:var(--bg-card);border:1px solid rgba(42,58,90,0.15);border-radius:10px;margin-bottom:5px;overflow:hidden;"><div class="g-head" onclick="this.parentElement.classList.toggle(\'open\')" style="padding:5px 8px;background:rgba(232,196,104,0.03);display:flex;justify-content:space-between;align-items:center;cursor:pointer;flex-wrap:wrap;gap:2px;"><span class="g-title" style="font-weight:700;font-size:12px;color:var(--accent2);">' +
                        item.n + ' 个红品（' + label +
                        '）</span><span class="g-meta" style="font-size:10px;color:var(--text-secondary);">总格数 ' +
                        item.total + ' | 共 ' + (item.combos ? item.combos.length : '多种') +
                        ' 种组合 ▶</span></div><div class="g-body" style="display:none;padding:4px 8px 6px;flex-wrap:wrap;gap:3px;">';
                    if (item.approx || !item.combos || item.combos.length === 0) {
                        htmlResult +=
                            '<span style="color:var(--text-secondary);font-size:11px;">组合较多，请减少红品数量或增加已知格数限制</span>';
                    } else {
                        var show = item.combos.slice(0, maxShow);
                        show.forEach(function(c) { htmlResult += '<span class="combo">' +
                                c.join(' + ') + '</span>'; });
                        if (item.combos.length > maxShow) htmlResult += '<span class="more-tag">…共 ' +
                            item.combos.length + ' 种</span>';
                    }
                    htmlResult += '</div></div>';
                });
                result.innerHTML = htmlResult;
            };
            document.getElementById('anReset').onclick = function() {
                document.getElementById('anAvg').value = '';
                document.getElementById('anCount').value = '';
                document.getElementById('anKnown').value = '';
                document.getElementById('anResult').innerHTML = '';
            };
        }

        function renderMainApp() {
            document.querySelectorAll('[data-tab]').forEach(function(btn) {
                btn.onclick = function() {
                    currentTab = btn.dataset.tab;
                    renderPage(currentTab);
                };
            });
            document.querySelectorAll('.mode-btn').forEach(function(btn) {
                btn.onclick = function() {
                    var mode = btn.dataset.mode;
                    syncModeButtons(mode);
                    renderPage(currentTab);
                };
            });
            document.querySelectorAll('.map-switch button').forEach(function(btn) {
                btn.onclick = function() {
                    currentMap = btn.dataset.map;
                    document.querySelectorAll('.map-switch button').forEach(function(b) {
                        b.classList.toggle('on', b === btn);
                    });
                    renderPage(currentTab);
                };
            });
            renderPage(currentTab);
        }

        (function() {
            showAuth();
            var cached = checkLocalVerify();
            if (cached) {
                showApp(cached);
                startRemainTimer(cached);
                setTimeout(function() { if (typeof renderMainApp === 'function') renderMainApp(); }, 100);
                return;
            }
            var savedCard = localStorage.getItem('card');
            if (savedCard) {
                setVerifyBtnDisabled(true);
                setVerifyBtnText(AUTH_TEXT.verifyBtnLoading);
                verifyWithServer(savedCard, function(success, days, minutes, cardType) {
                    setVerifyBtnDisabled(false);
                    setVerifyBtnText(AUTH_TEXT.verifyBtnText);
                    if (success) {
                        var data = saveVerifyStatus(savedCard, days, minutes, cardType, Date.now());
                        showApp(data);
                        startRemainTimer(data);
                        setTimeout(function() { if (typeof renderMainApp === 'function') renderMainApp(); }, 100);
                    } else {
                        clearVerifyStatus();
                        showAuth();
                        setAuthError(AUTH_TEXT.errorInvalid);
                        initAuthUI();
                    }
                });
            } else {
                showAuth();
                initAuthUI();
            }
        })();

        console.log('✅ 迪城修正版已启动 — 单格红已改为54774');
    </script>
</body>
</html>
