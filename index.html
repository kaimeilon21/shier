<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>俱乐大玩家超级AI</title>
    <style>
        /* ===== 全局 ===== */
        :root {
            --bg-page: #0a0e1a;
            --bg-card: #111827;
            --bg-card2: #1a2332;
            --bg-input: #0d1422;
            --border-color: #2a3a5a;
            --text-primary: #e8eef8;
            --text-secondary: #8aa0c8;
            --accent: #e8c468;
            --accent2: #f5dd9a;
            --shadow: rgba(0, 0, 0, 0.5);
            --radius: 14px;
            --transition: 0.2s ease;
            --glow: 0 0 30px rgba(232, 196, 104, 0.06);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: var(--bg-page);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            padding-bottom: 56px;
            font-size: 15px;
            line-height: 1.6;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-page);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        /* ===== 验证覆盖层 ===== */
        #authOverlay {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: var(--bg-page);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.4s ease;
        }
        #authOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .auth-box {
            width: 420px;
            max-width: 100%;
            background: var(--bg-card);
            border: 1px solid rgba(232, 196, 104, 0.12);
            border-radius: var(--radius);
            padding: 34px 28px 24px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), var(--glow);
            position: relative;
            overflow: hidden;
        }
        .auth-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(232, 196, 104, 0.03), transparent 70%);
            pointer-events: none;
        }
        .auth-box .auth-icon {
            font-size: 44px;
            margin-bottom: 2px;
            display: block;
        }
        .auth-box .auth-title {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        .auth-box .auth-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700, #f5a623);
            color: #0b1526;
            font-weight: 800;
            padding: 3px 20px;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.15);
            margin: 4px 0 12px;
        }
        .auth-box .auth-sub {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 10px;
            line-height: 1.7;
        }
        .auth-box .auth-remain {
            color: #4ec97a;
            font-size: 13px;
            padding: 5px 14px;
            border-radius: 10px;
            background: rgba(78, 201, 122, 0.05);
            display: inline-block;
            margin-bottom: 12px;
            border: 1px solid rgba(78, 201, 122, 0.08);
        }
        .auth-box .auth-remain.deleted {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.12);
            background: rgba(248, 113, 113, 0.05);
        }
        .auth-box .auth-input-wrap {
            position: relative;
            margin-bottom: 12px;
        }
        .auth-box .auth-input-wrap input {
            width: 100%;
            padding: 13px 18px;
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 4px;
            font-family: 'SF Mono', 'Menlo', monospace;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .auth-box .auth-input-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(232, 196, 104, 0.06);
        }
        .auth-box .auth-input-wrap input::placeholder {
            letter-spacing: 1px;
            font-weight: 400;
            color: var(--text-secondary);
            opacity: 0.35;
        }
        .auth-box .auth-warning {
            color: #f87171;
            font-size: 12px;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: rgba(248, 113, 113, 0.05);
            border: 1px solid rgba(248, 113, 113, 0.08);
            border-radius: 8px;
            text-align: center;
            line-height: 1.5;
        }
        .auth-box .auth-btn {
            width: 100%;
            padding: 13px 0;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            color: #0b1526;
            background: linear-gradient(135deg, var(--accent), #c9a23e);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.3s;
            box-shadow: 0 4px 20px rgba(232, 196, 104, 0.15);
            letter-spacing: 0.5px;
        }
        .auth-box .auth-btn:active {
            transform: scale(0.97);
        }
        .auth-box .auth-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .auth-box .auth-error {
            color: #f87171;
            font-size: 13px;
            min-height: 22px;
            margin-top: 4px;
        }
        .auth-box .auth-unbind {
            margin-top: 8px;
            background: rgba(248, 113, 113, 0.05);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.12);
            padding: 9px 0;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            font-weight: 500;
        }
        .auth-box .auth-unbind:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .auth-box .auth-unbind:not(:disabled):hover {
            background: rgba(248, 113, 113, 0.10);
        }
        .auth-box .auth-footer {
            margin-top: 16px;
            color: var(--text-secondary);
            font-size: 11px;
            opacity: 0.4;
            line-height: 1.8;
        }
        .auth-box .auth-footer .author {
            font-size: 11px;
            opacity: 0.5;
            margin-top: 2px;
        }

        /* ===== 主界面 ===== */
        #appWrap {
            display: block;
            padding: 0 14px 30px;
            max-width: 820px;
            margin: 0 auto;
        }
        #appWrap.hidden {
            display: none;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0 6px;
            border-bottom: 1px solid rgba(42, 58, 90, 0.2);
            flex-wrap: wrap;
            gap: 4px;
        }
        .top-bar .left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .top-bar .left .author-id {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            opacity: 0.6;
            letter-spacing: 0.3px;
        }
        .top-bar .left .vip-tag {
            background: transparent;
            padding: 1px 12px;
            border-radius: 20px;
            color: var(--accent2);
            font-weight: 700;
            font-size: 11px;
            border: 1.5px solid rgba(232, 196, 104, 0.3);
            letter-spacing: 0.5px;
            line-height: 1.6;
        }
        .top-bar .right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 3px 10px;
            color: var(--accent2);
            font-size: 16px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 3px;
            user-select: none;
            line-height: 1;
        }
        .theme-toggle:active {
            transform: scale(0.94);
        }

        /* ===== 警告横幅 ===== */
        .warning-banner {
            background: rgba(248, 113, 113, 0.05);
            border: 1px solid rgba(248, 113, 113, 0.08);
            border-radius: 8px;
            padding: 8px 12px;
            margin: 6px 0 10px;
            text-align: center;
            font-size: 13px;
            color: #f87171;
            line-height: 1.5;
        }

        /* ===== 主题面板 ===== */
        #themePanel {
            display: none;
            position: fixed;
            top: 66px;
            right: 14px;
            z-index: 101;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px 18px;
            min-width: 190px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
        }
        #themePanel.show {
            display: block;
        }
        #themePanel .tp-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent2);
            margin-bottom: 10px;
            text-align: center;
        }
        .theme-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }
        .theme-options .t-opt {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }
        .theme-options .t-opt.active {
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(232, 196, 104, 0.2);
            transform: scale(1.06);
        }
        .custom-theme-row {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .custom-theme-row label {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .custom-theme-row input[type="color"] {
            width: 26px;
            height: 26px;
            border: none;
            padding: 0;
            background: transparent;
            cursor: pointer;
            border-radius: 4px;
        }
        .tp-close {
            text-align: right;
            margin-top: 8px;
        }
        .tp-close button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
            opacity: 0.4;
        }
        #applyCustomTheme {
            background: var(--accent);
            border: none;
            border-radius: 6px;
            padding: 3px 12px;
            font-weight: 700;
            color: #0b1526;
            cursor: pointer;
            font-size: 11px;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            padding: 12px 0 4px;
        }
        .header .main-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent2);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px 12px;
        }
        .header .main-title .super-tag {
            background: linear-gradient(135deg, #ffd700, #f5a623);
            color: #0b1526;
            font-weight: 800;
            padding: 2px 16px;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.12);
            display: inline-block;
            line-height: 1.6;
        }
        .header .sub-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            opacity: 0.5;
            letter-spacing: 0.5px;
        }
        .header .header-actions {
            margin-top: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .header .header-actions .author-info {
            font-size: 11px;
            color: var(--text-secondary);
            opacity: 0.4;
        }
        .header .header-actions .unbind-link {
            font-size: 12px;
            color: #f87171;
            cursor: pointer;
            background: rgba(248, 113, 113, 0.05);
            padding: 2px 14px;
            border-radius: 20px;
            border: 1px solid rgba(248, 113, 113, 0.08);
            transition: all 0.2s;
            user-select: none;
            font-weight: 500;
        }
        .header .header-actions .unbind-link:hover {
            background: rgba(248, 113, 113, 0.10);
        }
        .header .remain-permanent {
            margin-top: 4px;
            font-size: 13px;
            color: #4ec97a;
            font-weight: 600;
            display: none;
        }
        .header .remain-permanent.show {
            display: block;
        }

        /* ===== 引导文字 ===== */
        .tour-guide {
            padding: 10px 14px 12px;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.8;
            background: rgba(232, 196, 104, 0.015);
            border-radius: var(--radius);
            border: 1px solid rgba(42, 58, 90, 0.15);
            margin: 6px 0 12px;
            opacity: 0.8;
        }

        /* ===== 地图切换 ===== */
        .map-switch {
            display: flex;
            gap: 5px;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            padding: 4px;
            overflow-x: auto;
            border: 1px solid rgba(42, 58, 90, 0.12);
        }
        .map-switch button {
            flex: 1;
            padding: 7px 4px;
            background: transparent;
            border: none;
            border-radius: 9px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            min-width: 50px;
        }
        .map-switch button.on {
            background: linear-gradient(135deg, rgba(232, 196, 104, 0.12), rgba(232, 196, 104, 0.04));
            color: var(--accent2);
            box-shadow: 0 0 16px rgba(232, 196, 104, 0.04);
            border: 1px solid rgba(232, 196, 104, 0.08);
        }

        /* ===== Tabs ===== */
        .tabs {
            display: flex;
            gap: 5px;
            padding: 0 0 12px;
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1;
            padding: 9px 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            min-width: 50px;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(232, 196, 104, 0.10), rgba(232, 196, 104, 0.03));
            color: var(--accent2);
            border-color: var(--accent);
            box-shadow: 0 0 16px rgba(232, 196, 104, 0.04);
        }

        /* ===== 页面 ===== */
        .page {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 卡片 ===== */
        .section {
            background: var(--bg-card);
            border: 1px solid rgba(42, 58, 90, 0.2);
            border-radius: var(--radius);
            margin-bottom: 14px;
            overflow: hidden;
            box-shadow: 0 4px 20px var(--shadow);
        }
        .sec-head {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(42, 58, 90, 0.10);
            background: rgba(0, 0, 0, 0.10);
        }
        .sec-title {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .sec-title .icon {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #0b1526;
            flex-shrink: 0;
        }
        .sec-title .name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .sec-title .role {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 1px;
            line-height: 1.6;
            opacity: 0.8;
        }
        .sec-title .role .tip2 {
            color: var(--accent);
            display: block;
            margin-top: 2px;
            font-size: 11px;
            opacity: 0.9;
        }
        .sec-body {
            padding: 12px 14px 14px;
        }

        /* ===== 表单行 ===== */
        .row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 2px;
            border-bottom: 1px solid rgba(42, 58, 90, 0.06);
            flex-wrap: wrap;
        }
        .row:last-child {
            border-bottom: none;
        }
        .row .lbl {
            min-width: 64px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
        }
        .row .qty {
            width: 70px;
            flex-shrink: 0;
        }
        .row .sub {
            flex: 1;
            text-align: right;
            font-weight: 700;
            font-size: 14px;
            color: var(--accent2);
            font-variant-numeric: tabular-nums;
            min-width: 64px;
        }
        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 7px 5px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            outline: none;
            -moz-appearance: textfield;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        input[type="number"]:focus,
        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(232, 196, 104, 0.05);
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* ===== 快速按钮组 ===== */
        .quick-btn-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .quick-btn-group .qbtn {
            min-width: 32px;
            height: 30px;
            padding: 0 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-input);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.12s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
            line-height: 1;
        }
        .quick-btn-group .qbtn:active {
            transform: scale(0.92);
            background: rgba(232, 196, 104, 0.10);
            border-color: var(--accent);
            color: var(--accent2);
        }
        .quick-btn-group .qbtn.neg {
            color: #f87171;
        }
        .quick-btn-group .qbtn.neg:hover {
            border-color: #f87171;
            color: #f87171;
        }
        .quick-btn-group .qbtn.pos {
            color: #4ec97a;
        }
        .quick-btn-group .qbtn.pos:hover {
            border-color: #4ec97a;
            color: #4ec97a;
        }
        .quick-btn-group .qbtn.big {
            min-width: 40px;
            font-size: 14px;
        }

        /* ===== 总计栏 ===== */
        .total-bar {
            margin-top: 10px;
            padding: 10px 14px;
            background: linear-gradient(135deg, rgba(232, 196, 104, 0.04), rgba(232, 196, 104, 0.015));
            border: 1px solid rgba(232, 196, 104, 0.06);
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }
        .total-bar .t-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .total-bar .t-item .label {
            color: var(--text-secondary);
            font-weight: 500;
        }
        .total-bar .t-item .value {
            font-weight: 800;
            color: var(--accent2);
            font-variant-numeric: tabular-nums;
        }
        .total-bar .t-item .value.rec {
            color: #4ec97a;
        }

        /* ===== 校准行 ===== */
        .calibrate-row {
            margin-top: 8px;
            padding: 8px 10px;
            background: rgba(232, 196, 104, 0.03);
            border: 1px solid rgba(232, 196, 104, 0.08);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .calibrate-row .lbl {
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            min-width: 80px;
        }
        .calibrate-row input {
            width: 120px;
            padding: 5px 8px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            outline: none;
        }
        .calibrate-row input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(232, 196, 104, 0.05);
        }
        .calibrate-row .calibrate-btn {
            padding: 5px 14px;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            font-weight: 700;
            color: #0b1526;
            cursor: pointer;

                    min = stat.min !== undefined ? stat.min : (stat.med || 0) * 0.7;
                if (stat.min === undefined) return avg * 0.6 + med * 0.4;

                var nw = 0.25 - Math.min(0.15, spread * 0.3);
                var aw = 1 - mw - nw;

                mw = Math.max(0.25, Math.min(0.5, mw));
                nw = Math.max(0.05, Math.min(0.3, nw));
                var tw = aw + mw + nw;
                return avg * (aw / tw) + med * (mw / tw) + min * (nw / tw);
            }

            function renderAn() {
                var el = document.getElementById('page-an');
                var map = getMap();
                var grids = map.gridOptions || [1, 2, 3, 4, 6, 8, 9, 12, 15, 16];

                el.innerHTML =
                    '<div class="section"><div class="sec-head"><div class="sec-title"><div class="icon" style="background:linear-gradient(135deg,#4ec97a,#2a9a5a);">安</div><div><div class="name">安可 · 红品均格反查（精准匹配）</div><div class="role">' +
                    T.anRole + '</div></div></div></div><div class="sec-body" id="anBody"></div></div>';

                var body = document.getElementById('anBody');
                var html = '<div class="rev-input"><div class="field"><label>平均格数</label><input type="number" id="anAvg" step="0.1" min="0.5" max="16" value=""></div><div class="field"><label>红品数量（可选）</label><input type="number" id="anCount" min="1" max="50" value=""></div><div class="quick-btn-group"><button class="qbtn neg" id="anM1">-1</button><button class="qbtn neg" id="anM01">-0.1</button><button class="qbtn pos" id="anP01">+0.1</button><button class="qbtn pos" id="anP1">+1</button></div></div>';

                html += '<div class="known-box"><label>已知格数（选填，用逗号分隔）</label><input type="text" id="anKnown" placeholder="如 4,6,8"></div>';

                html += '<div class="calibrate-row"><span class="lbl">📐 实际总价值</span>' +
                    '<input type="number" id="anActual" min="0" step="1000" value="" placeholder="输入实际值">' +
                    '<button class="calibrate-btn" id="anCalBtn">校准</button>' +
                    '<span class="calibrate-status" id="anCalStatus">未校准</span></div>';

                html += '<div class="total-bar"><div class="t-item"><span class="label">推荐出价</span><span class="value rec" id="anRec">0</span></div><div class="t-item"><span class="label">预估仓位价值</span><span class="value" id="anTotal">0</span></div></div>';

                html += '<div class="rev-result" id="anResult"></div>';
                html += '<div class="reset-row"><button class="btn-reset" id="anReset">重置数据</button></div>';
                body.innerHTML = html;

                var rawTotal = 0;

                document.getElementById('anM1').onclick = function() { adjustAvg(-1); };
                document.getElementById('anM01').onclick = function() { adjustAvg(-0.1); };
                document.getElementById('anP01').onclick = function() { adjustAvg(0.1); };
                document.getElementById('anP1').onclick = function() { adjustAvg(1); };

                function adjustAvg(d) {
                    var inp = document.getElementById('anAvg');
                    var cur = parseFloat(inp.value) || 0;
                    var nv = Math.max(0.1, Math.round((cur + d) * 10) / 10);
                    inp.value = nv;
                    calcAn();
                }

                function calcAn() {
                    var avg = parseFloat(document.getElementById('anAvg').value);
                    var count = parseInt(document.getElementById('anCount').value) || 0;
                    var knownStr = document.getElementById('anKnown').value.trim();
                    var known = knownStr ? knownStr.split(',').map(function(s) { return parseInt(s.trim()); }).filter(
                        function(n) { return !isNaN(n) && n > 0; }) : [];
                    var result = document.getElementById('anResult');

                    if (isNaN(avg) || avg < 0.1) {
                        result.innerHTML = '<div class="empty">请输入有效的平均格数</div>';
                        document.getElementById('anRec').textContent = '0';
                        document.getElementById('anTotal').textContent = '0';
                        return;
                    }

                    var gridSet = new Set(grids);
                    var combos = [];
                    var maxN = count > 0 ? count : 20;
                    var minN = count > 0 ? count : 1;

                    for (var n = minN; n <= maxN; n++) {
                        var knownOk = true;
                        for (var ki = 0; ki < known.length; ki++) { if (!gridSet.has(known[ki])) { knownOk = false; break; } }
                        if (!knownOk) continue;
                        var totalGrids = Math.round(avg * n);
                        var combosForN = [];

                        function findCombos(remaining, maxIdx, path) {
                            if (remaining === 0 && path.length === n) { combosForN.push(path.slice()); return; }
                            if (path.length >= n) return;
                            for (var i = maxIdx; i < grids.length; i++) {
                                var g = grids[i];
                                if (g <= remaining) {
                                    path.push(g);
                                    findCombos(remaining - g, i, path);
                                    path.pop();
                                }
                            }
                        }

                        if (n <= 8) {
                            findCombos(totalGrids, 0, []);
                            if (combosForN.length > 0) combos.push({ n: n, total: totalGrids, combos: combosForN });
                        } else {
                            combos.push({ n: n, total: totalGrids, combos: null, approx: true });
                        }
                    }

                    if (combos.length === 0) {
                        result.innerHTML = '<div class="empty">未找到匹配组合，请检查输入</div>';
                        document.getElementById('anRec').textContent = '0';
                        document.getElementById('anTotal').textContent = '0';
                        return;
                    }

                    var html2 = '';
                    var maxShow = 10;
                    var redAvgPrice = getRedPiecePrice(map);
                    var totalEst = 0;
                    var totalCnt = 0;

                    combos.forEach(function(item) {
                        var estValue = Math.round(item.n * redAvgPrice);
                        var minValue = 0;
                        if (item.combos) {
                            var minTotal = Infinity;
                            item.combos.forEach(function(combo) {
                                var sum = 0;
                                combo.forEach(function(g) {
                                    var entry = map.redByGrid[g];
                                    if (entry && entry.min) sum += entry.min;
                                    else sum += 0;
                                });
                                if (sum < minTotal) minTotal = sum;
                            });
                            if (minTotal !== Infinity) minValue = minTotal;
                        }
                        var valueLabel = '预估：' + fmt(estValue);
                        if (minValue > 0) valueLabel = '最低：' + fmt(minValue) + ' | 预估：' + fmt(estValue);
                        html2 += '<div class="rev-group"><div class="g-head" onclick="this.parentElement.classList.toggle(\'open\')"><span class="g-title">' +
                            item.n + ' 个红品（' + valueLabel + '）</span><span class="g-meta">总格数 ' + item.total +
                            ' | 共 ' + (item.combos ? item.combos.length : '多种') +
                            ' 种组合 <span class="arrow">▶</span></span></div><div class="g-body">';

                        if (item.approx || !item.combos || item.combos.length === 0) {
                            html2 += '<span style="color:var(--text-secondary);font-size:12px;">组合较多，请减少红品数量或增加已知格数限制</span>';
                        } else {
                            var show = item.combos.slice(0, maxShow);
                            show.forEach(function(c) { html2 += '<span class="combo">' + c.join(' + ') +
                                    '</span>'; });
                            if (item.combos.length > maxShow) html2 += '<span class="more-tag">…共 ' + item.combos
                                .length + ' 种</span>';
                        }
                        html2 += '</div></div>';

                        if (item.combos && item.combos.length > 0) {
                            var avgEst = 0;
                            var sumAll = 0;
                            item.combos.forEach(function(combo) {
                                var s = 0;
                                combo.forEach(function(g) {
                                    var entry = map.redByGrid[g];
                                    if (entry && entry.avg) s += entry.avg;
                                    else s += redAvgPrice * g;
                                });
                                sumAll += s;
                            });
                            avgEst = sumAll / item.combos.length;
                            totalEst += avgEst * item.combos.length;
                            totalCnt += item.combos.length;
                        } else {
                            totalEst += item.total * redAvgPrice;
                            totalCnt++;
                        }
                    });

                    var avgEstimate = totalCnt > 0 ? totalEst / totalCnt : 0;
                    var factor = _getCalFactor(currentMap, avgEstimate);
                    var finalEstimate = avgEstimate * factor;
                    var disc = dynamicRecDiscount(finalEstimate);
                    var rec = finalEstimate * disc;
                    if (currentMode === 'aggressive') rec = finalEstimate * 0.95;

                    document.getElementById('anRec').textContent = fmt(rec);
                    document.getElementById('anTotal').textContent = fmt(finalEstimate);

                    result.innerHTML = html2;
                    rawTotal = avgEstimate;
                    updateQuickStats(rec, finalEstimate, 0, finalEstimate * 1.2);
                }

                document.getElementById('anCalBtn').onclick = function() {
                    var actual = parseFloat(document.getElementById('anActual').value);
                    if (!actual || actual <= 0) { alert('请输入有效数值'); return; }
                    if (rawTotal <= 0) { alert('请先输入数据计算估值'); return; }
                    var ratio = actual / rawTotal;
                    _setCalFactor(currentMap, rawTotal, ratio);
                    document.getElementById('anActual').value = '';
                    var statusEl = document.getElementById('anCalStatus');
                    if (statusEl) {
                        var s = _getCalStatus(currentMap);
                        statusEl.textContent = s ? '✓ 已校准' : '未校准';
                        statusEl.className = 'calibrate-status' + (s ? ' active' : '');
                    }
                    calcAn();
                };

                document.getElementById('anAvg').addEventListener('input', calcAn);
                document.getElementById('anAvg').addEventListener('change', calcAn);
                document.getElementById('anCount').addEventListener('input', calcAn);
                document.getElementById('anKnown').addEventListener('input', calcAn);

                document.getElementById('anReset').onclick = function() {
                    document.getElementById('anAvg').value = '';
                    document.getElementById('anCount').value = '';
                    document.getElementById('anKnown').value = '';
                    document.getElementById('anActual').value = '';
                    document.getElementById('anResult').innerHTML = '';
                    document.getElementById('anRec').textContent = '0';
                    document.getElementById('anTotal').textContent = '0';
                    rawTotal = 0;
                    updateQuickStats(0, 0, 0, 0);
                };
                calcAn();
            }

            function renderRev() {
                var el = document.getElementById('page-rev');
                var map = getMap();
                var grids = map.gridOptions || [1, 2, 3, 4, 6, 8, 9, 12, 15, 16];

                el.innerHTML =
                    '<div class="section"><div class="sec-head"><div class="sec-title"><div class="icon" style="background:linear-gradient(135deg,#e8c468,#c9a23e);">?</div><div><div class="name">红品均格反查（精准匹配）</div><div class="role">' +
                    T.revRole + '</div></div></div></div><div class="sec-body" id="revBody"></div></div>';

                var body = document.getElementById('revBody');
                var html = '<div class="rev-input"><div class="field"><label>平均格数</label><input type="number" id="revAvg" step="0.1" min="0.5" max="16" value=""></div><div class="field"><label>红品数量（可选）</label><input type="number" id="revCount" min="1" max="50" value=""></div><button class="btn-gold" id="revBtn">推算</button></div>';

                html += '<div class="known-box"><label>已知格数（选填，用逗号分隔）</label><input type="text" id="revKnown" placeholder="如 4,6,8"></div>';
                html += '<div class="rev-result" id="revResult"></div>';
                html += '<div class="reset-row"><button class="btn-reset" id="revReset">重置数据</button></div>';
                body.innerHTML = html;

                document.getElementById('revBtn').onclick = function() {
                    var avg = parseFloat(document.getElementById('revAvg').value);
                    var count = parseInt(document.getElementById('revCount').value) || 0;
                    var knownStr = document.getElementById('revKnown').value.trim();
                    var known = knownStr ? knownStr.split(',').map(function(s) { return parseInt(s.trim()); }).filter(
                        function(n) { return !isNaN(n) && n > 0; }) : [];
                    var result = document.getElementById('revResult');

                    if (isNaN(avg) || avg < 0.1) {
                        result.innerHTML = '<div class="empty">请输入有效的平均格数</div>';
                        return;
                    }

                    var gridSet = new Set(grids);
                    var combos = [];
                    var maxN = count > 0 ? count : 20;
                    var minN = count > 0 ? count : 1;

                    for (var n = minN; n <= maxN; n++) {
                        var knownOk = true;
                        for (var ki = 0; ki < known.length; ki++) { if (!gridSet.has(known[ki])) { knownOk = false; break; } }
                        if (!knownOk) continue;
                        var totalGrids = Math.round(avg * n);
                        var combosForN = [];

                        function findCombos(remaining, maxIdx, path) {
                            if (remaining === 0 && path.length === n) { combosForN.push(path.slice()); return; }
                            if (path.length >= n) return;
                            for (var i = maxIdx; i < grids.length; i++) {
                                var g = grids[i];
                                if (g <= remaining) {
                                    path.push(g);
                                    findCombos(remaining - g, i, path);
                                    path.pop();
                                }
                            }
                        }

                        if (n <= 8) {
                            findCombos(totalGrids, 0, []);
                            if (combosForN.length > 0) combos.push({ n: n, total: totalGrids, combos: combosForN });
                        } else {
                            combos.push({ n: n, total: totalGrids, combos: null, approx: true });
                        }
                    }

                    if (combos.length === 0) {
                        result.innerHTML = '<div class="empty">未找到匹配组合，请检查输入</div>';
                        return;
                    }

                    var html2 = '';
                    var maxShow = 10;
                    var redAvgPrice = getRedPiecePrice(map);

                    combos.forEach(function(item) {
                        var estValue = Math.round(item.n * redAvgPrice);
                        var minValue = 0;
                        if (item.combos) {
                            var minTotal = Infinity;
                            item.combos.forEach(function(combo) {
                                var sum = 0;
                                combo.forEach(function(g) {
                                    var entry = map.redByGrid[g];
                                    if (entry && entry.min) sum += entry.min;
                                    else sum += 0;
                                });
                                if (sum < minTotal) minTotal = sum;
                            });
                            if (minTotal !== Infinity) minValue = minTotal;
                        }
                        var valueLabel = '预估：' + fmt(estValue);
                        if (minValue > 0) valueLabel = '最低：' + fmt(minValue) + ' | 预估：' + fmt(estValue);
                        html2 += '<div class="rev-group"><div class="g-head" onclick="this.parentElement.classList.toggle(\'open\')"><span class="g-title">' +
                            item.n + ' 个红品（' + valueLabel + '）</span><span class="g-meta">总格数 ' + item.total +
                            ' | 共 ' + (item.combos ? item.combos.length : '多种') +
                            ' 种组合 <span class="arrow">▶</span></span></div><div class="g-body">';

                        if (item.approx || !item.combos || item.combos.length === 0) {
                            html2 += '<span style="color:var(--text-secondary);font-size:12px;">组合较多，请减少红品数量或增加已知格数限制</span>';
                        } else {
                            var show = item.combos.slice(0, maxShow);
                            show.forEach(function(c) { html2 += '<span class="combo">' + c.join(' + ') +
                                    '</span>'; });
                            if (item.combos.length > maxShow) html2 += '<span class="more-tag">…共 ' + item.combos
                                .length + ' 种</span>';
                        }
                        html2 += '</div></div>';
                    });

                    result.innerHTML = html2;
                };

                document.getElementById('revReset').onclick = function() {
                    document.getElementById('revAvg').value = '';
                    document.getElementById('revCount').value = '';
                    document.getElementById('revKnown').value = '';
                    document.getElementById('revResult').innerHTML = '';
                };
            }

            // ---- 认证系统 ----
            var appWrap = document.getElementById('appWrap');
            var authOverlay = document.getElementById('authOverlay');
            var cardInput = document.getElementById('cardInput');
            var verifyBtn = document.getElementById('verifyBtn');
            var authError = document.getElementById('authError');
            var headerRemain = document.getElementById('remainPermanent');

            function showApp(data) {
                authOverlay.classList.add('hidden');
                appWrap.classList.remove('hidden');
                if (data) updateRemain(data);
                updateCalibStatus();
            }

            function showAuth() {
                authOverlay.classList.remove('hidden');
                appWrap.classList.add('hidden');
            }

            function updateRemain(data) {
                if (!data) return;
                var el = document.getElementById('remainPermanent');
                if (data.cardType === '永久卡') {
                    el.textContent = '♾️ 剩余时间：永久';
                    el.className = 'remain-permanent show';
                    return;
                }
                var now = Date.now();
                var elapsed = (now - data.verifyTime) / 1000;
                var rm = Math.max(0, data.minutes - elapsed / 60);
                var d = Math.floor(rm / 1440),
                    h = Math.floor((rm % 1440) / 60),
                    m = Math.floor(rm % 60);
                var parts = [];
                if (d > 0) parts.push(d + '天');
                if (h > 0) parts.push(h + '小时');
                if (m > 0 || parts.length === 0) parts.push(m + '分钟');
                el.textContent = '⏱ 剩余时间：' + parts.join('');
                el.className = 'remain-permanent show';
            }

            var remainTimer = null;

            function startRemainTimer(data) {
                if (remainTimer) clearInterval(remainTimer);
                updateRemain(data);
                remainTimer = setInterval(function() {
                    var cached = _getSecure();
                    if (cached) {
                        var now = Date.now();
                        var elapsed = (now - cached._t) / 1000;
                        var rm = Math.max(0, cached._d._m - elapsed / 60);
                        if (rm <= 0) {
                            clearInterval(remainTimer);
                            remainTimer = null;
                            _clearSecure();
                            showAuth();
                            return;
                        }
                        updateRemain({ cardType: cached._d._ct, minutes: cached._d._m, verifyTime: cached
                                ._t });
                    } else {
                        clearInterval(remainTimer);
                        remainTimer = null;
                    }
                }, 10000);
            }

            document.getElementById('unbindBtn').onclick = function() {
                if (confirm('确定要解绑此设备吗？解绑后需要重新激活。')) {
                    _clearSecure();
                    if (remainTimer) clearInterval(remainTimer);
                    showAuth();
                    cardInput.value = '';
                    location.reload();
                }
            };
            document.getElementById('headerUnbindLink').onclick = document.getElementById('unbindBtn').onclick;

            function initAuth() {
                var cached = _getSecure();
                if (cached) {
                    var elapsed = (Date.now() - cached._t) / 1000;
                    var rm = Math.max(0, cached._d._m - elapsed / 60);
                    if (rm > 0) {
                        showApp({ cardType: cached._d._ct, minutes: cached._d._m, verifyTime: cached._t });
                        startRemainTimer({ cardType: cached._d._ct, minutes: cached._d._m, verifyTime: cached
                                ._t });
                        setTimeout(function() { renderMain(); }, 100);
                        return;
                    } else { _clearSecure(); }
                }

                verifyBtn.onclick = function() {
                    var card = cardInput.value.trim();
                    if (!card) { authError.textContent = '请输入卡密'; return; }
                    authError.textContent = '';
                    verifyBtn.disabled = true;
                    verifyBtn.textContent = '⏳ 验证中…';
                    _verifyWithKeyt(card, function(success, days, minutes, cardType, error) {
                        verifyBtn.disabled = false;
                        verifyBtn.textContent = '激活';
                        if (success) {
                            var data = { _c: card, _ct: cardType, _m: minutes, _d: days, _t: Date.now() };
                            _saveSecure(card, { cardType: cardType, minutes: minutes, days: days });
                            showApp({ cardType: cardType, minutes: minutes, verifyTime: Date.now() });
                            startRemainTimer({ cardType: cardType, minutes: minutes, verifyTime: Date
                                    .now() });
                            renderMain();
                        } else {
                            authError.textContent = error === 'timeout' || error === 'network' ? '网络异常' :
                                '卡密无效或已过期';
                        }
                    });
                };
                cardInput.onkeydown = function(e) { if (e.key === 'Enter') verifyBtn.click(); };
                showAuth();
            }

            function renderMain() {
                document.getElementById('guideText').textContent = T.guide;
                var fns = { huo: renderHuo, gao: renderGao, su: renderSu, an: renderAn, rev: renderRev };
                if (fns[currentTab]) fns[currentTab]();
                updateCalibStatus();
                var activeTab = document.querySelector('.tab-btn.active');
                if (!activeTab) { document.querySelector('.tab-btn[data-tab="huo"]').classList.add('active'); }
            }

            // ---- 主题系统 ----
            var themes = {
                'default': { '--bg-page': '#0a0e1a', '--bg-card': '#111827', '--bg-card2': '#1a2332',
                    '--bg-input': '#0d1422', '--border-color': '#2a3a5a', '--text-primary': '#e8eef8',
                    '--text-secondary': '#8aa0c8', '--accent': '#e8c468', '--accent2': '#f5dd9a' },
                'light': { '--bg-page': '#eef0f4', '--bg-card': '#ffffff', '--bg-card2': '#f5f7fa',
                    '--bg-input': '#e4e8ee', '--border-color': '#c8d0d8', '--text-primary': '#1a2332',
                    '--text-secondary': '#5a6f90', '--accent': '#d4a83a', '--accent2': '#c99a2e' },
                'gold': { '--bg-page': '#1a150a', '--bg-card': '#2a2212', '--bg-card2': '#3a301a',
                    '--bg-input': '#1f180c', '--border-color': '#5a4a2a', '--text-primary': '#f5e6c8',
                    '--text-secondary': '#c9b28a', '--accent': '#e8b830', '--accent2': '#f5d060' },
                'green': { '--bg-page': '#0a1a12', '--bg-card': '#142b1e', '--bg-card2': '#1a3828',
                    '--bg-input': '#0c2216', '--border-color': '#2a5a3a', '--text-primary': '#d4f0e0',
                    '--text-secondary': '#8ab8a0', '--accent': '#4ec97a', '--accent2': '#7ad8a0' },
                'purple': { '--bg-page': '#120a1a', '--bg-card': '#221a30', '--bg-card2': '#2e2240',
                    '--bg-input': '#1a1026', '--border-color': '#4a3a6a', '--text-primary': '#e8d8f5',
                    '--text-secondary': '#b098d0', '--accent': '#a66be0', '--accent2': '#c89af0' },
                'dark': { '--bg-page': '#080808', '--bg-card': '#161616', '--bg-card2': '#222222',
                    '--bg-input': '#121212', '--border-color': '#3a3a3a', '--text-primary': '#e0e0e0',
                    '--text-secondary': '#999999', '--accent': '#aaaaaa', '--accent2': '#cccccc' }
            };

            function applyTheme(themeName) {
                var vars = themes[themeName];
                if (!vars) return;
                var root = document.documentElement;
                for (var key in vars) root.style.setProperty(key, vars[key]);
                localStorage.setItem('selectedTheme', themeName);
                var opts = document.querySelectorAll('.t-opt');
                opts.forEach(function(el) { el.classList.toggle('active', el.dataset.theme === themeName); });
                document.getElementById('themePanel').classList.remove('show');
            }

            function initTheme() {
                var saved = localStorage.getItem('selectedTheme');
                if (saved && themes[saved]) applyTheme(saved);
                else applyTheme('default');
                var container = document.getElementById('themeOptions');
                var html = '';
                var themeNames = { 'default': '默认', 'light': '亮白', 'gold': '暖金', 'green': '翠绿', 'purple': '星紫',
                    'dark': '暗夜' };
                for (var key in themes) {
                    var color = themes[key]['--accent'];
                    html += '<div class="t-opt" data-theme="' + key + '" style="background:' + color + ';" title="' +
                        themeNames[key] + '"></div>';
                }
                container.innerHTML = html;
                container.querySelectorAll('.t-opt').forEach(function(el) {
                    el.onclick = function() { applyTheme(el.dataset.theme); };
                });
                var saved2 = localStorage.getItem('selectedTheme') || 'default';
                container.querySelectorAll('.t-opt').forEach(function(el) {
                    el.classList.toggle('active', el.dataset.theme === saved2);
                });
            }

            document.getElementById('themeToggleBtn').onclick = function(e) {
                e.stopPropagation();
                document.getElementById('themePanel').classList.toggle('show');
            };
            document.getElementById('themePanelClose').onclick = function() {
                document.getElementById('themePanel').classList.remove('show');
            };
            document.addEventListener('click', function(e) {
                var panel = document.getElementById('themePanel');
                if (panel.classList.contains('show')) {
                    var target = e.target;
                    if (!panel.contains(target) && target !== document.getElementById('themeToggleBtn') && !document
                        .getElementById('themeToggleBtn').contains(target)) {
                        panel.classList.remove('show');
                    }
                }
            });
            document.getElementById('applyCustomTheme').onclick = function() {
                var primary = document.getElementById('customPrimary').value;
                var bg = document.getElementById('customBg').value;
                var root = document.documentElement;
                root.style.setProperty('--bg-page', bg);
                root.style.setProperty('--bg-card', bg);
                root.style.setProperty('--accent', primary);
                root.style.setProperty('--accent2', primary);
                localStorage.setItem('selectedTheme', 'custom');
                document.getElementById('themePanel').classList.remove('show');
            };

            // ---- 启动 ----
            initTheme();
            initAuth();
            setTimeout(renderMain, 200);
            console.log('✅ 俱乐大玩家超级AI v2.0 已加载（第一版UI + 所有新功能）');
        })();
    </script>
</body>
</html>
