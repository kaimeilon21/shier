<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>俱乐大玩家超级AI · 霓虹纪元</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 自定义滚动条 ===== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00d4ff, #7b2ffc);
            border-radius: 4px;
        }

        /* ===== 全局变量 ===== */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            --text-primary: #f0f4ff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent-1: #00d4ff;
            --accent-2: #7b2ffc;
            --accent-3: #ff6fd8;
            --bg-page: #08080e;
            --radius: 16px;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: var(--bg-page);
            min-height: 100vh;
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Inter', sans-serif;
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        /* ===== 动态光效背景 ===== */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(0, 212, 255, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(123, 47, 252, 0.08) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 111, 216, 0.04) 0%, transparent 50%);
            animation: bgFloat 30s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgFloat {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                transform: translate(2%, -2%) rotate(2deg);
            }
            66% {
                transform: translate(-1%, 3%) rotate(-1deg);
            }
            100% {
                transform: translate(1%, -1%) rotate(0deg);
            }
        }

        /* ===== 背景粒子 ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== 内容容器 ===== */
        #appWrap {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        /* ===== 验证前隐藏内容 ===== */
        #appWrap,
        .top-bar,
        .warning-banner,
        .header,
        .tour-guide,
        .map-switch,
        .tabs,
        #pagesContainer {
            display: none;
        }

        body.verified #appWrap,
        body.verified .top-bar,
        body.verified .warning-banner,
        body.verified .header,
        body.verified .tour-guide,
        body.verified .map-switch,
        body.verified .tabs,
        body.verified #pagesContainer {
            display: block;
        }

        /* ============================================================
                   验证界面
                   ============================================================ */
        #authBox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 8, 14, 0.92);
            backdrop-filter: blur(20px);
            animation: authFadeIn 0.8s ease;
        }

        @keyframes authFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        #authBox .auth-card {
            position: relative;
            width: 440px;
            max-width: 92%;
            padding: 48px 40px 40px;
            background: linear-gradient(145deg, rgba(20, 20, 40, 0.8), rgba(10, 10, 25, 0.9));
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            text-align: center;
            overflow: hidden;
            animation: authCardFloat 3s ease-in-out infinite alternate;
        }

        @keyframes authCardFloat {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-6px);
            }
        }

        #authBox .auth-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 30px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc, #ff6fd8, #00d4ff);
            background-size: 300% 300%;
            z-index: -1;
            animation: borderGlow 4s ease-in-out infinite;
            opacity: 0.5;
        }

        @keyframes borderGlow {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        #authBox .auth-icon {
            font-size: 64px;
            margin-bottom: 8px;
            display: inline-block;
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%,
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.2));
            }
            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 40px rgba(123, 47, 252, 0.4));
            }
        }

        #authBox .auth-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc, #ff6fd8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        #authBox .auth-sub {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin-top: 4px;
            margin-bottom: 28px;
            letter-spacing: 1px;
            font-weight: 300;
        }

        #authBox .auth-input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            letter-spacing: 3px;
            font-family: 'Monaco', 'Menlo', monospace;
            outline: none;
            transition: all var(--transition);
            box-sizing: border-box;
        }

        #authBox .auth-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.08), inset 0 0 30px rgba(0, 212, 255, 0.03);
            background: rgba(255, 255, 255, 0.06);
        }

        #authBox .auth-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }

        #authBox .auth-error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 10px;
            min-height: 20px;
            font-weight: 400;
        }

        #authBox .auth-btn {
            width: 100%;
            padding: 16px 0;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            cursor: pointer;
            margin-top: 18px;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }

        #authBox .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.25);
        }

        #authBox .auth-btn:active {
            transform: scale(0.97);
        }

        #authBox .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ============================================================
                   主程序
                   ============================================================ */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 60px;
            backdrop-filter: blur(24px);
            box-shadow: var(--glass-shadow);
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .top-bar .left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            position: relative;
            z-index: 1;
        }

        .top-bar .left .author-id {
            opacity: 0.3;
            font-size: 12px;
        }

        .top-bar .left .vip-tag {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            font-weight: 700;
            padding: 3px 16px;
            border-radius: 30px;
            font-size: 11px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
        }

        .top-bar .right {
            display: flex;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .theme-toggle {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 4px 14px;
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            transition: all var(--transition);
            user-select: none;
            line-height: 1.4;
        }

        .theme-toggle:hover {
            border-color: rgba(0, 212, 255, 0.3);
            color: #00d4ff;
        }

        .warning-banner {
            background: rgba(255, 107, 107, 0.06);
            border: 1px solid rgba(255, 107, 107, 0.08);
            border-radius: 12px;
            padding: 10px 16px;
            margin: 8px 0 16px;
            text-align: center;
            font-size: 13px;
            color: #ff6b6b;
            backdrop-filter: blur(8px);
            position: relative;
        }

        .warning-banner::before {
            content: '⚡';
            margin-right: 8px;
        }

        .header {
            text-align: center;
            padding: 18px 0 14px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            backdrop-filter: blur(24px);
            box-shadow: var(--glass-shadow);
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d4ff, #7b2ffc, #ff6fd8, transparent);
            animation: headerLine 3s ease-in-out infinite;
        }

        @keyframes headerLine {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }

        .header .main-title {
            font-size: 30px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px 16px;
        }

        .header .main-title .gradient-text {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc, #ff6fd8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .main-title .super-tag {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            font-weight: 700;
            padding: 4px 20px;
            border-radius: 40px;
            font-size: 14px;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
            -webkit-text-fill-color: #fff;
        }

        .header .sub-title {
            font-size: 13px;
            color: var(--text-secondary);
            opacity: 0.5;
            margin-top: 4px;
            letter-spacing: 2px;
        }

        .header .header-actions {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .header .header-actions .author-info {
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0.3;
        }

        .header .header-actions .unbind-link {
            font-size: 13px;
            color: #ff6b6b;
            cursor: pointer;
            background: rgba(255, 107, 107, 0.06);
            padding: 4px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 107, 107, 0.1);
            transition: all var(--transition);
            font-weight: 500;
        }

        .header .header-actions .unbind-link:hover {
            background: rgba(255, 107, 107, 0.12);
            border-color: rgba(255, 107, 107, 0.3);
        }

        .header .remain-permanent {
            margin-top: 8px;
            font-size: 16px;
            color: #00d4ff;
            font-weight: 600;
            min-height: 28px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
        }

        .header .remain-permanent.expired {
            color: #ff6b6b;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.1);
        }

        .tour-guide {
            padding: 14px 18px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.8;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            backdrop-filter: blur(12px);
            margin: 10px 0 16px;
            opacity: 0.7;
            border-left: 2px solid rgba(0, 212, 255, 0.2);
        }

        .map-switch {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 60px;
            padding: 4px;
            overflow-x: auto;
        }

        .map-switch button {
            flex: 1;
            padding: 10px 8px;
            background: transparent;
            border: none;
            border-radius: 40px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            min-width: 50px;
        }

        .map-switch button.on {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            box-shadow: 0 4px 24px rgba(0, 212, 255, 0.2);
        }

        .map-switch button:hover:not(.on) {
            color: #fff;
        }

        .tabs {
            display: flex;
            gap: 6px;
            padding: 0 0 14px;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 6px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            min-width: 50px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(123, 47, 252, 0.15));
            color: #00d4ff;
            border-color: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.05);
        }

        .tab-btn:hover:not(.active) {
            border-color: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .page {
            display: none;
            animation: pageFade 0.4s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes pageFade {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: var(--glass-shadow);
            transition: all var(--transition);
        }

        .section:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .sec-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.02);
        }

        .sec-title {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .sec-title .icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.15);
        }

        .sec-title .name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .sec-title .role {
            font-size: 13px;
            color: var(--text-secondary);
            opacity: 0.7;
            line-height: 1.5;
        }

        .sec-title .role .tip2 {
            color: #00d4ff;
            display: block;
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
        }

        .sec-body {
            padding: 16px 18px 18px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            flex-wrap: wrap;
        }

        .row:last-child {
            border-bottom: none;
        }

        .row .lbl {
            min-width: 60px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
        }

        .row .qty {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }

        .row .qty input[type="number"] {
            width: 50px;
            min-width: 40px;
            padding: 6px 4px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            outline: none;
            -moz-appearance: textfield;
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .row .qty input[type="number"]:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.05);
            background: rgba(0, 0, 0, 0.4);
        }

        .row .qty input[type="number"]::-webkit-outer-spin-button,
        .row .qty input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* ---- 快捷按键样式 ---- */
        .qty-btns {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            align-items: center;
        }

        .qty-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            height: 28px;
            padding: 0 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .qty-btn:active {
            transform: scale(0.92);
            background: rgba(0, 212, 255, 0.15);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .qty-btn:hover:not(:active) {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .qty-btn.primary {
            background: rgba(0, 212, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.15);
            color: #00d4ff;
        }

        .qty-btn.primary:active {
            background: rgba(0, 212, 255, 0.25);
            border-color: #00d4ff;
        }

        .qty-btn.danger:active {
            background: rgba(255, 107, 107, 0.2);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .qty-btn {
                min-width: 32px;
                height: 32px;
                font-size: 12px;
                padding: 0 8px;
            }
            .row .qty input[type="number"] {
                width: 44px;
                min-width: 36px;
                font-size: 12px;
                padding: 5px 3px;
            }
            .row .lbl {
                min-width: 48px;
                font-size: 12px;
            }
            .qty-btns {
                gap: 2px;
            }
        }

        @media (max-width: 380px) {
            .qty-btn {
                min-width: 26px;
                height: 26px;
                font-size: 10px;
                padding: 0 4px;
            }
            .row .qty input[type="number"] {
                width: 36px;
                min-width: 30px;
                font-size: 11px;
                padding: 4px 2px;
            }
            .row .lbl {
                min-width: 40px;
                font-size: 11px;
            }
        }

        .row .sub {
            text-align: right;
            font-weight: 700;
            font-size: 14px;
            color: #00d4ff;
            font-variant-numeric: tabular-nums;
            min-width: 50px;
            flex-shrink: 0;
        }

        .total-bar {
            margin-top: 12px;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.04), rgba(123, 47, 252, 0.04));
            border: 1px solid rgba(0, 212, 255, 0.06);
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .total-bar .t-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .total-bar .t-item .label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .total-bar .t-item .value {
            font-weight: 800;
            color: #00d4ff;
            font-variant-numeric: tabular-nums;
        }

        .total-bar .t-item .value.rec {

    <script>
        // ============================================================
        // 粒子背景
        // ============================================================
        (function() {
            var canvas = document.getElementById('particles-canvas');
            var ctx = canvas.getContext('2d');
            var particles = [];
            var mouseX = 0,
                mouseY = 0;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            var colors = ['#00d4ff', '#7b2ffc', '#ff6fd8', 'rgba(255,255,255,0.2)'];

            function createParticle() {
                return {
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2.5 + 0.5,
                    speedX: (Math.random() - 0.5) * 0.4,
                    speedY: (Math.random() - 0.5) * 0.4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    opacity: Math.random() * 0.3 + 0.1
                };
            }

            for (var i = 0; i < 120; i++) {
                particles.push(createParticle());
            }

            function drawLines() {
                for (var i = 0; i < particles.length; i++) {
                    for (var j = i + 1; j < particles.length; j++) {
                        var dx = particles[i].x - particles[j].x;
                        var dy = particles[i].y - particles[j].y;
                        var dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) {
                            var alpha = (1 - dist / 120) * 0.08;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(function(p) {
                    p.x += p.speedX;
                    p.y += p.speedY;

                    var dx = mouseX - p.x;
                    var dy = mouseY - p.y;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        var force = (1 - dist / 150) * 0.3;
                        p.x += dx * force * 0.01;
                        p.y += dy * force * 0.01;
                    }

                    if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.opacity;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });

                drawLines();
                requestAnimationFrame(animate);
            }

            animate();
        })();

        var CONFIG = {

                e2) {}
            },
            get: function(key) {
                try { var val = localStorage.getItem(key); if (val !== null) return val; } catch (e) {}
                try { var match = document.cookie.match(new RegExp('(^| )' + key + '=([^;]+)')); if (match) return decodeURIComponent(
                        match[2]); } catch (e2) {}
                return null;
            },
            remove: function(key) {
                try { localStorage.removeItem(key); } catch (e) {}
                try { document.cookie = key + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;'; } catch (e2) {}
            }
        };

        function getDeviceId() {
            var saved = Storage.get('device_id');
            if (saved) return saved;
            var parts = [];
            try {
                var canvas = document.createElement('canvas');
                var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    var info = gl.getExtension('WEBGL_debug_renderer_info');
                    if (info) {
                        var gpu = gl.getParameter(info.UNMASKED_RENDERER_WEBGL) || '';
                        if (gpu) parts.push('gpu:' + gpu);
                    }
                }
            } catch (e) {}
            if (parts.length === 0) {
                try {
                    var c = document.createElement('canvas');
                    c.width = 256;
                    c.height = 64;

                        ctx.font = '14px Arial';

                        ctx.fillStyle = 'rgba(100,200,50,0.5)';
                        ctx.beginPath();

                        ctx.fill();

            if (parts.length === 0) {

                var os = navigator.platform || '';

                else if (os.indexOf('Linux') !== -1) os = 'Linux';
                else if (os.indexOf('iPhone') !== -1 || os.indexOf('iPad') !== -1) os = 'iOS';
                else if (os.indexOf('Android') !== -1) os = 'Android';
                else os = 'Other';
                parts.push('os:' + os);
                parts.push('lang:' + (navigator.language || navigator.userLanguage || 'zh-CN'));
            }
            var raw = parts.join('|');
            var deviceId = 'web_' + CryptoJS.MD5(raw).toString();

        function request(url, callback) {

        // ============================================================
        // 动态剩余时间（修复版 - 不会主动触发登出）
        // ============================================================
        function updateRemainDisplay() {
            var el = document.getElementById('remainPermanent');
            if (!el) return;

            var expireTimestamp = parseInt(Storage.get('card_expire_timestamp')) || 0;
            var daysStr = Storage.get('remain_days') || '';

            if (daysStr === '永久' || expireTimestamp >= 9999999999999) {
                el.textContent = '♾️ 剩余时间：永久有效';
                el.className = 'remain-permanent';
                return;
            }

            if (!expireTimestamp || expireTimestamp <= 0) {
                el.textContent = '⏱ 加载中...';
                return;
            }

            var now = Date.now();
            var remainingMs = expireTimestamp - now;

            // ✅ 修复：只显示状态，不自动触发登出
            if (remainingMs <= 0) {
                el.textContent = '⏱ 卡密已过期，请点击"解绑激活码"重新验证';
                el.className = 'remain-permanent expired';
                return;
            }

            var totalSeconds = Math.floor(remainingMs / 1000);
            var days = Math.floor(totalSeconds / 86400);
            var hours = Math.floor((totalSeconds % 86400) / 3600);
            var mins = Math.floor((totalSeconds % 3600) / 60);
            var secs = Math.floor(totalSeconds % 60);

            var parts = [];
            if (days > 0) parts.push(days + '天');
            if (hours > 0) parts.push(hours + '时');
            if (mins > 0) parts.push(mins + '分');
            if (secs > 0 || parts.length === 0) parts.push(secs + '秒');

            el.textContent = '⏱ 剩余时间：' + parts.join(' ');
            el.className = 'remain-permanent';

            var floatEl = document.getElementById('remainTimeDisplay');
            if (floatEl) {
                var fParts = [];
                if (days > 0) fParts.push(days + '天');
                if (hours > 0) fParts.push(hours + '时');
                if (mins > 0) fParts.push(mins + '分');
                if (secs > 0 || fParts.length === 0) fParts.push(secs + '秒');
                floatEl.textContent = '⏱ ' + fParts.join(' ');
            }
        }

        // ============================================================
        function startHeartbeat() {
            var card = Storage.get('card');
            if (!card) return;

            setInterval(function() {
                var deviceId = getDeviceId();
                var url = CONFIG.API_URL + '?card=' + encodeURIComponent(card) + '&mac=' + encodeURIComponent(deviceId) +
                    '&app=' + CONFIG.APP_NAME;

                request(url, function(response) {
                    try {
                        var pos = response.indexOf('|sign=');
                        if (pos !== -1) response = response.substring(0, pos);
                        var parts = response.split('|');

                        if (parts[0] !== 'ok') {
                            console.warn('⚠️ 心跳检测失败，不触发登出');
                            return;
                        }

                        var minutes = parseInt(parts[3]) || 0;
                        if (minutes <= 0) {
                            console.warn('⚠️ 卡密剩余时间为0，可能已过期');
                            return;
                        }

                        var now = Date.now();
                        var expireTimestamp = now + (minutes * 60 * 1000);
                        Storage.set('remain_minutes', minutes);
                        Storage.set('card_expire_timestamp', expireTimestamp.toString());

                        updateRemainDisplay();

                    } catch (e) {
                        console.warn('⚠️ 心跳处理异常:', e);
                    }
                });
            }, 60000);
        }

            function weightedPrice(stat) {
                if (!stat) return 0;
                var avg = stat.avg || 0;
                var med = stat.med || 0;
                var min = stat.min !== undefined ? stat.min : med * 0.7;
                var spread = (avg - min) / (avg + 0.01);
                var medWeight = 0.35 + Math.min(0.15, spread * 0.3);
                var minWeight = 0.25 - Math.min(0.15, spread * 0.3);
                var avgWeight = 1 - medWeight - minWeight;
                avgWeight = Math.max(0.3, Math.min(0.6, avgWeight));
                medWeight = Math.max(0.25, Math.min(0.5, medWeight));
                minWeight = Math.max(0.05, Math.min(0.3, minWeight));
                var totalW = avgWeight + medWeight + minWeight;
                avgWeight /= totalW;
                medWeight /= totalW;
                minWeight /= totalW;
                return avg * avgWeight + med * medWeight + min * minWeight;
            }

            function dynamicRecDiscount(total) {
                if (total < 500000) return 0.85;

                RED_BOOST_MAX_TIER: [0.28, 0.40],
                GOLD_MULTIPLIER_PER: [0.020, 0.045],
                VALUE_SCALE_THRESHOLD: 200000,
                VALUE_SCALE_DECAY: 0.06,
                FINAL_JITTER: 0.02
            };
            var MAP_EST_MAP_CONFIG = {
                1: { name: '一图', minMultiplier: 1.15, maxMultiplier: 1.45 },
                2: { name: '二图', minMultiplier: 1.25, maxMultiplier: 1.65 },

            function mapEstRandomFloat(a, b) { return Math.random() * (b - a) + a; }

            function mapEstRandomInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

            function mapEstEstimate(mapId, revealed, red, gold) {
                var cfg = MAP_EST_MAP_CONFIG[mapId];
                if (!cfg) throw new Error('未知地图');
                var minMult = cfg.minMultiplier,
                    maxMult = cfg.maxMultiplier;
                var rMin, rMax;
                if (red <= 0) { rMin = 0;
                    rMax = 0; } else if (red === 1) { rMin = MAP_EST_CONFIG.RED_BOOST_TIERS[1][0];
                    rMax = MAP_EST_CONFIG.RED_BOOST_TIERS[1][1]; } else if (red === 2) { rMin = MAP_EST_CONFIG.RED_BOOST_TIERS[2][0];
                    rMax = MAP_EST_CONFIG.RED_BOOST_TIERS[2][1]; } else if (red === 3) { rMin = MAP_EST_CONFIG.RED_BOOST_TIERS[3][0];
                    rMax = MAP_EST_CONFIG.RED_BOOST_TIERS[3][1]; } else if (red === 4) { rMin = MAP_EST_CONFIG.RED_BOOST_TIERS[4][0];
                    rMax = MAP_EST_CONFIG.RED_BOOST_TIERS[4][1]; } else { rMin = MAP_EST_CONFIG.RED_BOOST_MAX_TIER[0];
                    rMax = MAP_EST_CONFIG.RED_BOOST_MAX_TIER[1]; }
                if (red > 5) { var extra = (red - 5) * 0.015;
                    rMin += extra;
                    rMax += extra * 1.2; }
                minMult += rMin;
                maxMult += rMax;
                if (gold > 0) {
                    var gMult = mapEstRandomFloat(MAP_EST_CONFIG.GOLD_MULTIPLIER_PER[0], MAP_EST_CONFIG
                    .GOLD_MULTIPLIER_PER[1]) * gold;
                    minMult += gMult * 0.7;
                    maxMult += gMult;
                }
                if (revealed > MAP_EST_CONFIG.VALUE_SCALE_THRESHOLD) {
                    var decay = MAP_EST_CONFIG.VALUE_SCALE_DECAY * Math.min(1, (revealed - MAP_EST_CONFIG
                        .VALUE_SCALE_THRESHOLD) / 300000);
                    minMult *= (1 - decay);
                    maxMult *= (1 - decay);
                }
                minMult = Math.max(1.0, minMult);
                maxMult = Math.max(minMult + 0.05, maxMult);
                var mult = mapEstRandomFloat(minMult, maxMult);
                var val = revealed * mult;
                if (gold > 0) { var gBonus = mapEstRandomInt(MAP_EST_CONFIG.GOLD_BONUS_MIN, MAP_EST_CONFIG
                    .GOLD_BONUS_MAX) * gold;
                    val += gBonus; }
                val -= MAP_EST_CONFIG.BASE_DEDUCTION;
                val *= (1 + mapEstRandomFloat(-MAP_EST_CONFIG.FINAL_JITTER, MAP_EST_CONFIG.FINAL_JITTER));
                val = Math.max(0, val);
                return {
                    mapName: cfg.name,
                    value: val,
                    multiplier: mult,
                    minMultiplier: minMult,
                    maxMultiplier: maxMult,
                    redBoostMin: rMin,
                    redBoostMax: rMax,
                    deduction: MAP_EST_CONFIG.BASE_DEDUCTION,
                    goldBonusTotal: gold > 0 ? mapEstRandomInt(MAP_EST_CONFIG.GOLD_BONUS_MIN, MAP_EST_CONFIG
                        .GOLD_BONUS_MAX) * gold : 0
                };

                        var minV = Math.min.apply(null, vals);
                        var spread = (maxV - minV) / (maxV + 0.01);

            function initAdvanced() {
                var currentAdvMap = 1;
                var advBtns = document.querySelectorAll('#advMapSwitch button');
                advBtns.forEach(function(btn) {
                    btn.onclick = function() {
                        advBtns.forEach(function(b) { b.classList.remove('on'); });
                        btn.classList.add('on');
                        currentAdvMap = parseInt(btn.dataset.map);
                        var container = document.getElementById('advResultContainer');
                        if (container && container.style.display !== 'none') { document.getElementById(
                                'advCalcBtn').click(); }
                    };
                });
                document.getElementById('advCalcBtn').onclick = function() {
                    var revealed = parseFloat(document.getElementById('advRevealed').value) || 0;
                    var red = parseInt(document.getElementById('advRed').value) || 0;
                    var gold = parseInt(document.getElementById('advGold').value) || 0;
                    var container = document.getElementById('advResultContainer');
                    if (revealed <= 0) { container.style.display = 'none';
                        alert(TEXT.advEmpty); return; }
                    try {
                        var result = mapEstEstimate(currentAdvMap, revealed, red, gold);
                        container.style.display = 'block';
                        document.getElementById('advTotal').textContent = fmt(result.value);
                        var rec = Math.round(result.value * dynamicRecDiscount(result.value));
                        document.getElementById('advRec').textContent = fmt(rec);
                        document.getElementById('advMapName').textContent = result.mapName;
                        document.getElementById('advMultiplier').textContent = result.multiplier.toFixed(3);
                        document.getElementById('advMultiplierRange').textContent = '[' + result.minMultiplier
                            .toFixed(2) + ', ' + result.maxMultiplier.toFixed(2) + ']';
                        document.getElementById('advRedBoost').textContent = '[' + result.redBoostMin.toFixed(
                            2) + ', ' + result.redBoostMax.toFixed(2) + ']';
                        document.getElementById('advDeduction').textContent = '-' + result.deduction
                        .toLocaleString();
                        var conf = 0.70;
                        var inputs = 0;
                        if (revealed > 0) inputs++;
                        if (red > 0) inputs++;
                        if (gold > 0) inputs++;
                        conf += inputs * 0.08;
                        conf = Math.min(0.96, conf);
                        var fill = document.getElementById('advConfidenceFill');
                        var label = document.getElementById('advConfidenceLabel');
                        if (fill) {
                            fill.style.width = (conf * 100) + '%';
                            fill.style.background = conf > 0.8 ? 'linear-gradient(90deg,#4ec97a,#6ee7b7)' : (conf >
                                0.65 ? 'linear-gradient(90deg,#ffd93d,#f59e0b)' :
                                'linear-gradient(90deg,#ff6b6b,#ef4444)');
                        }
                        if (label) label.textContent = Math.round(conf * 100) + '%';
                    } catch (e) { alert('计算异常：' + e.message); }
                };
                document.getElementById('advClearBtn').onclick = function() {
                    document.getElementById('advRevealed').value = '';
                    document.getElementById('advRed').value = '';
                    document.getElementById('advGold').value = '';
                    document.getElementById('advResultContainer').style.display = 'none';
                    var fill = document.getElementById('advConfidenceFill');
                    var label = document.getElementById('advConfidenceLabel');
                    if (fill) fill.style.width = '70%';
                    if (label) label.textContent = '70%';
                };
            }

                el.innerHTML = '<div class="section"><div class="sec-head"><div class="sec-title"><div class="icon">安</div><div><div class="name">' +
                    TEXT.anTitle + '</div><div class="role">' + TEXT.anRole +

                var body = document.getElementById('anBody');
                body.innerHTML = '<div class="rev-input"><div class="field"><label>' + TEXT.avgGridLabel +
                    '</label><input type="number" id="anAvg" step="0.1" min="1" max="16" placeholder="如 3.5"></div><div class="field"><label>' +
                    TEXT.countLabel +
                    '</label><input type="number" id="anCount" min="1" max="50" placeholder="不限"></div><button class="btn-gold" id="anBtn">' +
                    TEXT.calcBtn + '</button></div>' +
                    '<div class="known-box"><label>' + TEXT.knownLabel +
                    '</label><input type="text" id="anKnown" placeholder="如 4,6,8" style="width:100%;padding:8px 12px;background:rgba(0,0,0,0.2);border:1px solid var(--glass-border);border-radius:10px;color:var(--text-primary);outline:none;transition:all var(--transition);"></div>' +
                    '<div class="rev-result" id="anResult"></div>' +
                    '<div class="reset-row"><button class="btn-reset" id="anReset">' + TEXT.resetLabel +
                    '</button></div>';
                document.getElementById('anBtn').onclick = function() {
                    var avg = parseFloat(document.getElementById('anAvg').value);
                    var count = parseInt(document.getElementById('anCount').value) || 0;
                    var knownStr = document.getElementById('anKnown').value.trim();
                    var known = knownStr ? knownStr.split(',').map(function(s) { return parseInt(s.trim()); })
                        .filter(function(n) { return !isNaN(n) && n > 0; }) : [];
                    var result = document.getElementById('anResult');
                    if (isNaN(avg) || avg < 1) { result.innerHTML =
                            '<div class="empty">请输入有效的平均格数</div>'; return; }
                    var combos = [];
                    var maxN = count > 0 ? count : 20;
                    var minN = count > 0 ? count : 1;
                    for (var n = minN; n <= maxN; n++) {
                        var knownOk = true;
                        for (var ki = 0; ki < known.length; ki++) { if (!gridSet.has(known[ki])) { knownOk = false;
                                break; } }
                        if (!knownOk) continue;
                        var totalGrids = Math.round(avg * n);
                        var combosForN = [];

                        function findCombos(remaining, maxIdx, path) {
                            if (remaining === 0 && path.length === n) { combosForN.push(path.slice()); return; }
                            if (path.length >= n) return;
                            for (var i = maxIdx; i < grids.length; i++) {
                                var g = grids[i];
                                if (g <= remaining) {
                                    path.push(g);
                                    findCombos(remaining - g, i, path);
                                    path.pop();
                                }
                            }
                        }
                        if (n <= 8) {
                            findCombos(totalGrids, 0, []);
                            if (combosForN.length > 0) combos.push({ n: n, total: totalGrids, combos: combosForN });
                        } else {
                            combos.push({ n: n, total: totalGrids, combos: null, approx: true });
                        }
                    }
                    if (combos.length === 0) { result.innerHTML = '<div class="empty">' + TEXT.noMatch +
                        '</div>'; return; }
                    var html = '';
                    var maxShow = 10;
                    var redAvgPrice = getRedPiecePrice(map);
                    combos.forEach(function(item) {
                        var estValue = Math.round(item.n * redAvgPrice);
                        var minValue = 0;
                        if (item.combos) {
                            var minTotal = Infinity;
                            item.combos.forEach(function(combo) {
                                var sum = 0;
                                combo.forEach(function(g) {
                                    var entry = map.redByGrid[g];
                                    if (entry && entry.min) sum += entry.min;
                                    else sum += 0;
                                });
                                if (sum < minTotal) minTotal = sum;
                            });
                            if (minTotal !== Infinity) minValue = minTotal;
                        }
                        var valueLabel = '预估价值：' + fmt(estValue);
                        if (minValue > 0) valueLabel = '最低价值：' + fmt(minValue) + ' | 预估价值：' + fmt(
                            estValue);
                        var rec = Math.round(estValue * dynamicRecDiscount(estValue));
                        html += '<div class="rev-group"><div class="g-head" onclick="this.parentElement.classList.toggle(\'open\')"><span class="g-title">' +
                            item.n + ' 个红品（' + valueLabel + '）</span><span class="g-meta">推荐出价：<span style="color:#4ec97a;font-weight:700;">' +
                            fmt(rec) + '</span> | 总格数 ' + item.total + ' | 共 ' + (item.combos ? item.combos
                            .length : '多种') + ' 种组合 <span class="arrow">▶</span></span></div><div class="g-body">';
                        if (item.approx || !item.combos || item.combos.length === 0) {
                            html += '<span style="color:var(--text-secondary);font-size:12px;">' + TEXT
                                .comboMany + '</span>';
                        } else {
                            var show = item.combos.slice(0, maxShow);
                            show.forEach(function(c) { html += '<span class="combo">' + c.join(' + ') +
                                '</span>'; });
                            if (item.combos.length > maxShow) html += '<span class="more-tag">…共 ' + item
                                .combos.length + ' 种</span>';
                        }
                        html += '</div></div>';
                    });
                    result.innerHTML = html;
                };
                document.getElementById('anReset').onclick = function() {
                    document.getElementById('anAvg').value = '';
                    document.getElementById('anCount').value = '';
                    document.getElementById('anKnown').value = '';
                    document.getElementById('anResult').innerHTML = '';
                };
            }

                    TEXT.calcBtn + '</button></div>' +

                document.getElementById('revBtn').onclick = function() {

                    var result = document.getElementById('revResult');
                    if (isNaN(avg) || avg < 1) { result.innerHTML =
                            '<div class="empty">请输入有效的平均格数</div>'; return; }
                    var combos = [];
                    var maxN = count > 0 ? count : 20;
                    var minN = count > 0 ? count : 1;
                    for (var n = minN; n <= maxN; n++) {
                        var knownOk = true;
                        for (var ki = 0; ki < known.length; ki++) { if (!gridSet.has(known[ki])) { knownOk = false;
                                break; } }
                        if (!knownOk) continue;
                        var totalGrids = Math.round(avg * n);
                        var combosForN = [];

                        function findCombos(remaining, maxIdx, path) {
                            if (remaining === 0 && path.length === n) { combosForN.push(path.slice()); return; }
                            if (path.length >= n) return;
                            for (var i = maxIdx; i < grids.length; i++) {
                                var g = grids[i];
                                if (g <= remaining) {
                                    path.push(g);
                                    findCombos(remaining - g, i, path);
                                    path.pop();
                                }
                            }
                        }
                        if (n <= 8) {
                            findCombos(totalGrids, 0, []);
                            if (combosForN.length > 0) combos.push({ n: n, total: totalGrids, combos: combosForN });
                        } else {
                            combos.push({ n: n, total: totalGrids, combos: null, approx: true });
                        }
                    }
                    if (combos.length === 0) { result.innerHTML = '<div class="empty">' + TEXT.noMatch +
                        '</div>'; return; }
                    var html = '';
                    var maxShow = 10;
                    var redAvgPrice = getRedPiecePrice(map);
                    combos.forEach(function(item) {
                        var estValue = Math.round(item.n * redAvgPrice);
                        var minValue = 0;
                        if (item.combos) {
                            var minTotal = Infinity;
                            item.combos.forEach(function(combo) {
                                var sum = 0;
                                combo.forEach(function(g) {
                                    var entry = map.redByGrid[g];
                                    if (entry && entry.min) sum += entry.min;
                                    else sum += 0;
                                });
                                if (sum < minTotal) minTotal = sum;
                            });
                            if (minTotal !== Infinity) minValue = minTotal;
                        }
                        var valueLabel = '预估价值：' + fmt(estValue);
                        if (minValue > 0) valueLabel = '最低价值：' + fmt(minValue) + ' | 预估价值：' + fmt(
                            estValue);
                        var rec = Math.round(estValue * dynamicRecDiscount(estValue));
                        html += '<div class="rev-group"><div class="g-head" onclick="this.parentElement.classList.toggle(\'open\')"><span class="g-title">' +
                            item.n + ' 个红品（' + valueLabel + '）</span><span class="g-meta">推荐出价：<span style="color:#4ec97a;font-weight:700;">' +
                            fmt(rec) + '</span> | 总格数 ' + item.total + ' | 共 ' + (item.combos ? item.combos
                            .length : '多种') + ' 种组合 <span class="arrow">▶</span></span></div><div class="g-body">';
                        if (item.approx || !item.combos || item.combos.length === 0) {
                            html += '<span style="color:var(--text-secondary);font-size:12px;">' + TEXT
                                .comboMany + '</span>';
                        } else {
                            var show = item.combos.slice(0, maxShow);
                            show.forEach(function(c) { html += '<span class="combo">' + c.join(' + ') +
                                '</span>'; });
                            if (item.combos.length > maxShow) html += '<span class="more-tag">…共 ' + item
                                .combos.length + ' 种</span>';
                        }
                        html += '</div></div>';
                    });
                    result.innerHTML = html;
                };
                document.getElementById('revReset').onclick = function() {
                    document.getElementById('revAvg').value = '';
                    document.getElementById('revCount').value = '';
                    document.getElementById('revKnown').value = '';
                    document.getElementById('revResult').innerHTML = '';
                };
            }

            renderHuo();
            renderGao();
            renderSu();
            renderAn();
            renderRev();

            document.querySelector('.tab-btn.active')?.click();

            console.log('✦ 俱乐大玩家超级AI · 霓虹纪元已启动（含迪城地图 + 快捷按键）');
            console.log('✦ 卡密验证 · 动态倒计时 · 心跳检测');
        }
    </script>
