<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>俱乐大玩家 · 超级AI v5.0</title>
    <style>
        /* ===== 样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-page: #0a0e1a;
            --bg-card: #111827;
            --bg-input: #0d1422;
            --border-color: #2a3a5a;
            --text-primary: #e8eef8;
            --text-secondary: #8aa0c8;
            --accent: #e8c468;
            --accent2: #f5dd9a;
            --radius: 14px;
            --nav-height: 52px;
        }
        body {
            background: var(--bg-page);
            color: var(--text-primary);
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            font-size: 14px;
            line-height: 1.6;
            padding-bottom: 40px;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-page); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

        #authOverlay {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: var(--bg-page);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.4s ease;
        }
        #authOverlay.hidden { opacity: 0; pointer-events: none; }
        .auth-box {
            width: 420px;
            max-width: 100%;
            background: var(--bg-card);
            border: 1px solid rgba(232, 196, 104, 0.12);
            border-radius: var(--radius);
            padding: 34px 28px 24px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .auth-box .auth-icon { font-size: 44px; display: block; margin-bottom: 2px; }
        .auth-box .auth-title {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .auth-box .auth-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700, #f5a623);
            color: #0b1526;
            font-weight: 800;
            padding: 3px 20px;
            border-radius: 30px;
            font-size: 13px;
            margin: 4px 0 12px;
        }
        .auth-box .auth-sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 10px; }
        .auth-box .auth-input-wrap input {
            width: 100%;
            padding: 13px 18px;
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 4px;
            font-family: monospace;
            outline: none;
            transition: border-color 0.15s;
        }
        .auth-box .auth-input-wrap input:focus { border-color: var(--accent); }
        .auth-box .auth-btn {
            width: 100%;
            padding: 13px 0;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            color: #0b1526;
            background: linear-gradient(135deg, var(--accent), #c9a23e);
            cursor: pointer;
            transition: transform 0.15s;
        }
        .auth-box .auth-btn:active { transform: scale(0.97); }
        .auth-box .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .auth-box .auth-error { color: #f87171; font-size: 13px; min-height: 22px; margin-top: 4px; }
        .auth-box .auth-footer { margin-top: 16px; color: var(--text-secondary); font-size: 11px; opacity: 0.5; }
        .auth-box .auth-footer .author { font-size: 12px; opacity: 0.8; color: var(--accent2); margin-top: 4px; }

        #appWrap { max-width: 820px; margin: 0 auto; padding: 0 10px 20px; display: none; }
        #appWrap.show { display: block; }

        .top-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-page);
            border-bottom: 1px solid rgba(42, 58, 90, 0.25);
            padding: 0 8px;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(12px);
            flex-wrap: nowrap;
            overflow-x: auto;
        }
        .top-nav::-webkit-scrollbar { display: none; }
        .top-nav .nav-group {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 0 4px;
            border-right: 1px solid rgba(42, 58, 90, 0.15);
            flex-shrink: 0;
        }
        .top-nav .nav-group:last-child { border-right: none; }
        .top-nav .nav-group button {
            padding: 4px 12px;
            font-size: 14px;
            font-weight: 700;
            min-height: 32px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            white-space: nowrap;
            font-family: inherit;
            transition: all 0.15s;
        }
        .top-nav .nav-group button.active {
            color: var(--accent2);
            background: rgba(232, 196, 104, 0.06);
        }
        .top-nav .nav-group button.active::after {
            content: '';
            display: block;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
            margin-top: 1px;
            width: 50%;
            margin-left: auto;
            margin-right: auto;
        }
        .top-nav .nav-right {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            padding-left: 6px;
            border-left: 1px solid rgba(42, 58, 90, 0.15);
            margin-left: auto;
        }
        .top-nav .nav-right .vip-tag {
            font-size: 9px;
            color: var(--accent2);
            border: 1px solid rgba(232, 196, 104, 0.2);
            padding: 1px 8px;
            border-radius: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .header {
            padding: 8px 4px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid rgba(42, 58, 90, 0.10);
            margin-bottom: 6px;
        }
        .header .main-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--accent2);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .header .main-title .super-tag {
            background: linear-gradient(135deg, #ffd700, #f5a623);
            color: #0b1526;
            font-weight: 800;
            padding: 1px 10px;
            border-radius: 30px;
            font-size: 9px;
            display: inline-block;
            line-height: 1.6;
        }
        .header .header-actions {
            margin-top: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header .header-actions .remain-time {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(78, 201, 122, 0.08);
        }
        .header .header-actions .remain-time.permanent { color: #fbbf24; border-color: rgba(251, 191, 36, 0.15); }
        .header .header-actions .remain-time.active { color: #4ec97a; border-color: rgba(78, 201, 122, 0.15); }
        .header .header-actions .remain-time.warning { color: #fbbf24; border-color: rgba(251, 191, 36, 0.15); }
        .header .header-actions .remain-time.danger { color: #f87171; border-color: rgba(248, 113, 113, 0.15); }
        .header .header-actions .unbind-btn {
            font-size: 10px;
            color: #f87171;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(248, 113, 113, 0.15);
            background: rgba(248, 113, 113, 0.05);
            user-select: none;
        }
        .header .header-actions .calibrate-status {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
        }
        .header .header-actions .calibrate-status.active {
            color: #4ec97a;
            border: 1px solid rgba(78, 201, 122, 0.15);
        }
        .header .header-actions .calibrate-status.inactive {
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .page { display: none; animation: fadeUp 0.2s ease; }
        .page.active { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .map-mode-row {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .map-mode-row .map-switch {
            display: flex;
            gap: 3px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            padding: 3px;
            border: 1px solid rgba(42, 58, 90, 0.12);
            flex: 2;
            min-width: 180px;
        }
        .map-mode-row .map-switch button {
            flex: 1;
            padding: 4px 3px;
            background: transparent;
            border: none;
            border-radius: 7px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            font-family: inherit;
        }
        .map-mode-row .map-switch button.on {
            background: linear-gradient(135deg, rgba(232, 196, 104, 0.12), rgba(232, 196, 104, 0.04));
            color: var(--accent2);
            border: 1px solid rgba(232, 196, 104, 0.08);
        }
        .map-mode-row .mode-switch {
            display: flex;
            gap: 3px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            padding: 3px;
            border: 1px solid rgba(42, 58, 90, 0.12);
            flex: 1;
            min-width: 120px;
        }
        .map-mode-row .mode-switch button {
            flex: 1;
            padding: 4px 3px;
            background: transparent;
            border: none;
            border-radius: 7px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .map-mode-row .mode-switch button.active {
            background: linear-gradient(135deg, rgba(232, 196, 104, 0.12), rgba(232, 196, 104, 0.04));
            color: var(--accent2);
            border: 1px solid rgba(232, 196, 104, 0.08);
        }

        .section {
            background: var(--bg-card);
            border: 1px solid rgba(42, 58, 90, 0.2);
            border-radius: var(--radius);
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .sec-head {
            padding: 6px 10px;
            border-bottom: 1px solid rgba(42, 58, 90, 0.10);
            background: rgba(0, 0, 0, 0.10);
        }
        .sec-title { display: flex; align-items: flex-start; gap: 6px; }
        .sec-title .icon {
            width: 24px;
            height: 24px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #0b1526;
            flex-shrink: 0;
        }
        .sec-title .name { font-size: 13px; font-weight: 700; color: var(--text-primary); }
        .sec-title .role { font-size: 10px; color: var(--text-secondary); opacity: 0.8; line-height: 1.4; }
        .sec-title .role .tip2 { color: var(--accent); display: block; font-size: 10px; opacity: 0.9; }
        .sec-body { padding: 6px 8px 8px; }

        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 5px;
            margin-bottom: 8px;
        }
        .quick-actions .qa-btn {
            background: var(--bg-card);
            border: 1px solid rgba(42, 58, 90, 0.15);
            border-radius: 8px;
            padding: 6px 4px;
            text-align: center;
            font-family: inherit;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            line-height: 1.2;
        }
        .quick-actions .qa-btn .qa-icon { display: block; font-size: 14px; margin-bottom: 1px; }
        .quick-actions .qa-btn .qa-value { color: var(--accent2); font-weight: 800; font-size: 11px; display: block; margin-top: 1px; }
        .quick-actions .qa-btn .qa-label { font-size: 8px; opacity: 0.6; }

        .row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 2px;
            border-bottom: 1px solid rgba(42, 58, 90, 0.05);
            flex-wrap: wrap;
        }
        .row:last-child { border-bottom: none; }
        .row .lbl {
            min-width: 44px;
            font-weight: 600;
            font-size: 11px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .row .lbl .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .row .lbl .dot.red { background: #e05555; }
        .row .lbl .dot.orange { background: #e8943a; }
        .row .lbl .dot.purple { background: #a66be0; }
        .row .lbl .dot.blue { background: #4a9ae8; }
        .row .lbl .dot.green { background: #4ec97a; }

        .row .qty { width: 48px; flex-shrink: 0; }
        .row .qty input {
            width: 100%;
            padding: 3px 2px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            outline: none;
            -moz-appearance: textfield;
            font-family: inherit;
        }
        .row .qty input:focus { border-color: var(--accent); }
        .row .qty input::-webkit-outer-spin-button,
        .row .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .row .btn-group { display: flex; gap: 4px; flex-shrink: 0; }
        .row .btn-group .qbtn {
            min-width: 30px;
            height: 28px;
            padding: 0 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-input);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .row .btn-group .qbtn:active { transform: scale(0.92); }
        .row .btn-group .qbtn.neg { color: #f87171; }
        .row .btn-group .qbtn.pos { color: #4ec97a; }

        .row .sub {
            flex: 1;
            text-align: right;
            font-weight: 700;
            font-size: 12px;
            color: var(--accent2);
            min-width: 36px;
            margin-left: auto;
        }

        .special-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 2px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(42, 58, 90, 0.08);
        }
        .special-row .lbl { min-width: 44px; font-weight: 600; font-size: 11px; color: var(--text-primary); }
        .special-row .qty { width: 70px; flex-shrink: 0; }
        .special-row .qty input {
            width: 100%;
            padding: 3px 2px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            outline: none;
            font-family: inherit;
        }
        .special-row .qty input:focus { border-color: var(--accent); }
        .special-row .btn-group .qbtn { min-width: 34px; height: 28px; font-size: 11px; padding: 0 8px; }

        .simple-btn-group {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .simple-btn-group .sbtn {
            min-width: 26px;
            height: 26px;
            padding: 0 6px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-input);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .simple-btn-group .sbtn:active { transform: scale(0.92); }
        .simple-btn-group .sbtn.neg { color: #f87171; }
        .simple-btn-group .sbtn.pos { color: #4ec97a; }

        .total-bar {
            margin-top: 6px;
            padding: 5px 8px;
            background: rgba(232, 196, 104, 0.03);
            border: 1px solid rgba(232, 196, 104, 0.06);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 2px;
        }
        .total-bar .t-item { display: flex; align-items: center; gap: 4px; font-size: 10px; }
        .total-bar .t-item .label { color: var(--text-secondary); font-weight: 500; }
        .total-bar .t-item .value { font-weight: 800; color: var(--accent2); }
        .total-bar .t-item .value.rec { color: #4ec97a; }

        .confidence-bar {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 4px;
            padding: 2px 0;
        }
        .confidence-bar .bar-track {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
            min-width: 30px;
        }
        .confidence-bar .bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s ease;
            background: linear-gradient(90deg, #f87171, #fbbf24, #34d399);
        }
        .confidence-bar .label { font-weight: 500; min-width: 28px; text-align: right; color: var(--accent2); }

        .reset-row { margin-top: 5px; display: flex; justify-content: flex-end; }
        .btn-reset {
            padding: 2px 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-reset:hover { border-color: #f87171; color: #f87171; }

        .config-status {
            text-align: center;
            font-size: 9px;
            color: var(--text-secondary);
            opacity: 0.3;
            padding: 8px 0 2px;
            border-top: 1px solid rgba(42, 58, 90, 0.05);
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            .quick-actions { grid-template-columns: 1fr 1fr; }
            .row .lbl { min-width: 36px; font-size: 10px; }
            .row .qty { width: 38px; }
            .row .btn-group .qbtn { min-width: 26px; height: 24px; font-size: 10px; padding: 0 4px; }
            .map-mode-row { flex-direction: column; }
            .top-nav .nav-group button { font-size: 12px; padding: 3px 8px; min-height: 26px; }
        }
        @media (min-width: 600px) {
            .quick-actions { grid-template-columns: 1fr 1fr 1fr 1fr; }
        }
    </style>
</head>
<body>

    <!-- ===== 认证界面 ===== -->
    <div id="authOverlay">
        <div class="auth-box">
            <span class="auth-icon">🎯</span>
            <div class="auth-title" id="authTitle">俱乐大玩家 · 超级AI v5.0</div>
            <div class="auth-badge" id="authBadge">🌟 外部配置版</div>
            <div class="auth-sub" id="authSub">请输入卡密激活</div>
            <div class="auth-input-wrap">
                <input id="cardInput" type="text" placeholder="请输入卡密" autocomplete="off" spellcheck="false" />
            </div>
            <button id="verifyBtn" class="auth-btn">✅ 激活</button>
            <div id="authError" class="auth-error"></div>
            <div class="auth-footer">
                <span>☁️ 外部配置 · 无硬编码</span>
                <div class="author">作者 QQ：204443214</div>
            </div>
        </div>
    </div>

    <!-- ===== 主应用 ===== -->
    <div id="appWrap">
        <nav class="top-nav" id="topNav">
            <div class="nav-group">
                <span class="label">角色</span>
                <button class="active" data-tab="huo">霍姑姑</button>
                <button data-tab="gao">高晋</button>
                <button data-tab="su">苏琦</button>
                <button data-tab="an">安可</button>
            </div>
            <div class="nav-group">
                <span class="label">模式</span>
                <button class="mode-btn active" data-mode="classic">⚖️ 经典</button>
                <button class="mode-btn" data-mode="aggressive">🔥 激烈</button>
            </div>
            <div class="nav-right">
                <span class="vip-tag">📊 v5.0 外部配置</span>
            </div>
        </nav>

        <div class="header">
            <div class="main-title">
                <span id="appTitle">俱乐大玩家 · 超级AI</span>
                <span class="super-tag">⚡ 外部配置版</span>
            </div>
            <div class="sub-title"></div>
            <div class="header-actions">
                <span class="remain-time" id="headerRemain">⏱ 加载中...</span>
                <span class="unbind-btn" id="unbindBtn">🔓 解绑设备</span>
                <span id="calibrateStatus" class="calibrate-status inactive">未校准</span>
            </div>
        </div>

        <div class="map-mode-row" id="mapRow">
            <div class="map-switch" id="mapSwitch">
                <button data-map="dicheng" class="on">迪城 ⭐</button>
                <button data-map="xunhui">巡回</button>
                <button data-map="yanjing">燕京</button>
                <button data-map="xiangjiang">香江</button>
                <button data-map="nicheng">霓城</button>
            </div>
            <div class="mode-switch" id="modeSwitchBottom">
                <button class="mode-btn active" data-mode="classic">⚖️ 经典</button>
                <button class="mode-btn" data-mode="aggressive">🔥 激烈</button>

            // ---- 设备指纹 ----
            function getDeviceFP() {
                try {
                    var saved = localStorage.getItem('device_fp_v5');
                    if (saved) return saved;
                    var parts = [];
                    parts.push('screen:' + (screen.width || 0) + 'x' + (screen.height || 0));
                    parts.push('color:' + (screen.colorDepth || 24));
                    parts.push('agent:' + (navigator.userAgent || '').substring(0, 50));
                    var hash = 0;
                    var str = parts.join('|') + 'fp_salt_2026';
                    for (var i = 0; i < str.length; i++) {
                        hash = ((hash << 5) - hash) + str.charCodeAt(i);
                        hash = hash & hash;
                    }
                    var fp = Math.abs(hash).toString(16).padStart(8, '0') +
                        Date.now().toString(16).slice(-4);
                    localStorage.setItem('device_fp_v5', fp);
                    return fp;
                } catch (e) { return 'unknown_' + Date.now(); }

                log('🔑 验证卡密: ' + card.substring(0, 4) + '****', 'info');

                if (OFFLINE_MODE) {
                    log('📴 离线模式，跳过验证', 'info');
                    if (callback) callback({
                        success: true,
                        cardType: '永久卡',
                        minutes: 99999999,
                        days: '永久'
                    });
                    return;
                }

                var fp = getDeviceFP();
                var url = API_URL + '?card=' + encodeURIComponent(card) +
                    '&mac=' + encodeURIComponent(fp) + '&app=a';

                log('🌐 请求: ' + url.replace(/card=[^&]+/, 'card=***'), 'info');

                var xhr = new XMLHttpRequest();
                var timer = setTimeout(function() {
                    xhr.abort();
                    log('⏰ 验证超时', 'error');
                    if (callback) callback({ success: false, error: 'timeout' });
                }, TIMEOUT);

                xhr.open('GET', url, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        clearTimeout(timer);

                        if (xhr.status === 200) {
                            var response = xhr.responseText;
                            log('📄 响应: ' + response, 'info');

                            var pos = response.indexOf('|sign=');
                            if (pos !== -1) response = response.substring(0, pos);

                            var parts = response.split('|');

                            if (parts[0] === 'ok') {
                                var days = parts[2] || '未知';
                                var minutes = parseInt(parts[3]) || 0;

                                var cardType = '天卡';
                                if (minutes >= 999999 * 1440) cardType = '永久卡';
                                else if (minutes >= 43200) cardType = '月卡';
                                else if (minutes >= 10080) cardType = '周卡';
                                else if (minutes >= 1440) cardType = '天卡';
                                else cardType = '小时卡';

                                log('✅ 验证成功: ' + cardType, 'success');
                                if (callback) callback({
                                    success: true,
                                    cardType: cardType,
                                    minutes: minutes,
                                    days: days
                                });
                                return;
                            }

                            log('❌ 验证失败: ' + parts[0], 'error');
                            if (callback) callback({ success: false, error: 'invalid' });
                        } else {
                            log('❌ 网络错误: HTTP ' + xhr.status, 'error');
                            if (callback) callback({ success: false, error: 'network' });
                        }
                    }
                };

                xhr.onerror = function() {
                    clearTimeout(timer);
                    log('❌ 请求失败', 'error');
                    if (callback) callback({ success: false, error: 'network' });
                };

                xhr.send();
            }

                    headerRemain.textContent = '♾️ 永久有效';

                document.getElementById('anStepMinus01').onclick = function() { adjustAvg(-0.1); };
                document.getElementById('anStepPlus01').onclick = function() { adjustAvg(0.1); };
                document.getElementById('anStepPlus1').onclick = function() { adjustAvg(1); };

                function adjustAvg(delta) {
                    var inp = document.getElementById('anAvg');
                    var cur = parseFloat(inp.value) || 0;
                    var newVal = Math.max(0.1, Math.round((cur + delta) * 10) / 10);
                    inp.value = newVal;
                    calcAn();
                }

                function calcAn() {
                    var avgInput = parseFloat(document.getElementById('anAvg').value);
                    var resultSummary = document.getElementById('anResultSummary');
                    var comboList = document.getElementById('anComboList');

                    if (isNaN(avgInput) || avgInput < 0.1) {
                        resultSummary.style.display = 'none';
                        comboList.innerHTML = '<div class="an-empty">请输入有效的平均格数（≥0.1）</div>';
                        return;
                    }

                    var allCombos = [];
                    var maxItems = 20;
                    var redAvgPrice = getRedPiecePrice(map);

                    for (var n = 1; n <= maxItems; n++) {
                        var totalGrids = Math.round(avgInput * n);
                        if (totalGrids < 1) continue;
                        var combosForN = [];

                        function findCombos(remaining, maxIdx, path) {
                            if (remaining === 0 && path.length === n) {
                                combosForN.push(path.slice());
                                return;
                            }
                            if (path.length >= n) return;
                            for (var i = maxIdx; i < grids.length; i++) {
                                var g = grids[i];
                                if (g <= remaining) {
                                    path.push(g);
                                    findCombos(remaining - g, i, path);
                                    path.pop();
                                }
                            }
                        }

                        if (n <= 8) {
                            findCombos(totalGrids, 0, []);
                            if (combosForN.length > 0) {
                                allCombos.push({ n: n, total: totalGrids, combos: combosForN, approx: false });
                            }
                        } else {
                            var tempRemain = totalGrids;
                            for (var gi = grids.length - 1; gi >= 0; gi--) {
                                if (tempRemain >= grids[gi]) tempRemain -= grids[gi];
                            }
                            if (tempRemain === 0 || (tempRemain > 0 && tempRemain % grids[0] === 0)) {
                                allCombos.push({ n: n, total: totalGrids, combos: null, approx: true });
                            }
                        }
                    }

                    if (allCombos.length === 0) {
                        resultSummary.style.display = 'none';
                        comboList.innerHTML = '<div class="an-empty">未找到匹配的组合，请调整平均格数</div>';
                        return;
                    }

                    var totalEstimateSum = 0;
                    var totalComboCount = 0;

                    allCombos.forEach(function(group) {
                        if (group.approx) return;
                        group.combos.forEach(function(combo) {
                            var sum = 0;
                            combo.forEach(function(g) {
                                var entry = map.redByGrid[g];
                                if (entry && entry.avg) sum += entry.avg;
                                else sum += redAvgPrice * g;
                            });
                            totalEstimateSum += sum;
                            totalComboCount++;
                        });
                    });

                    if (totalComboCount === 0) {
                        allCombos.forEach(function(group) {
                            if (group.approx) {
                                var est = group.total * redAvgPrice;
                                totalEstimateSum += est;
                                totalComboCount++;
                            }
                        });
                    }

                    var avgEstimate = totalComboCount > 0 ? totalEstimateSum / totalComboCount : 0;
                    var finalEstimate = avgEstimate;
                    var disc = dynamicRecDiscount(finalEstimate);
                    var rec = finalEstimate * disc;
                    if (currentMode === 'aggressive') rec = finalEstimate * 0.95;

                    resultSummary.style.display = 'flex';
                    document.getElementById('anRec').textContent = fmt(rec);
                    document.getElementById('anTotal').textContent = fmt(finalEstimate);
                    document.getElementById('anComboCount').textContent = totalComboCount;

                    var listHtml = '';
                    var maxShow = 12;

                    allCombos.forEach(function(group, idx) {
                        var isOpen = idx === 0;
                        var comboLabel = group.approx ? '（近似）' : '';
                        var countLabel = group.approx ? '多种' : group.combos.length;

                        listHtml += '<div class="an-combo-group' + (isOpen ? ' open' : '') + '">' +
                            '<div class="g-head" onclick="this.parentElement.classList.toggle(\'open\')">' +
                            '<span class="g-title">' + group.n + ' 件藏品 ' + comboLabel + '</span>' +
                            '<span class="g-meta">总格数 ' + group.total + ' | 共 ' + countLabel +
                            ' 种组合 <span class="arrow">▶</span></span>' +
                            '</div>' +
                            '<div class="g-body">';

                        if (group.approx || !group.combos || group.combos.length === 0) {
                            var estVal = group.total * redAvgPrice;
                            listHtml += '<span class="an-combo-item"><span class="grids">约 ' + group.total +
                                ' 格</span> <span class="val">≈' + fmt(estVal) + '</span></span>';
                        } else {
                            var showCombos = group.combos.slice(0, maxShow);
                            showCombos.forEach(function(combo) {
                                var sum = 0;
                                combo.forEach(function(g) {
                                    var entry = map.redByGrid[g];
                                    if (entry && entry.avg) sum += entry.avg;
                                    else sum += redAvgPrice * g;
                                });
                                listHtml += '<span class="an-combo-item"><span class="grids">' + combo.join(
                                    '+') +
                                    '</span> <span class="val">' + fmt(sum) + '</span></span>';
                            });
                            if (group.combos.length > maxShow) {
                                listHtml += '<span class="more-tag" style="font-size:10px;color:var(--text-secondary);">…共 ' +
                                    group.combos.length + ' 种</span>';
                            }
                        }

                        listHtml += '</div></div>';
                    });

                    comboList.innerHTML = listHtml;
                    updateQuickActions(rec, finalEstimate, 0, finalEstimate * 1.2);
                    updateCalibrateStatusDisplay();
                }

                document.getElementById('anAvg').addEventListener('input', calcAn);
                document.getElementById('anAvg').addEventListener('change', calcAn);

                document.getElementById('anReset').onclick = function() {
                    document.getElementById('anAvg').value = '';
                    document.getElementById('anResultSummary').style.display = 'none';
                    document.getElementById('anComboList').innerHTML = '<div class="an-empty">请输入平均格数开始推算</div>';
                    updateQuickActions(0, 0, 0, 0);
                };

                document.getElementById('anComboList').innerHTML = '<div class="an-empty">请输入平均格数开始推算</div>';
            }

            // ---- 切换控制 ----
            function setMode(mode) {
                currentMode = mode;
                document.querySelectorAll('.mode-btn').forEach(function(btn) {
                    btn.classList.toggle('active', btn.dataset.mode === mode);
                });
                var fn = { 'huo': renderHuo, 'gao': renderGao, 'su': renderSu, 'an': renderAn };
                if (fn[currentTab]) fn[currentTab]();
            }

            document.querySelectorAll('.mode-btn').forEach(function(btn) {
                btn.onclick = function() { setMode(this.dataset.mode); };
            });

            function switchTab(tab) {
                currentTab = tab;
                document.querySelectorAll('[data-tab]').forEach(function(btn) {
                    btn.classList.toggle('active', btn.dataset.tab === tab);
                });
                document.querySelectorAll('.page').forEach(function(page) {
                    page.classList.toggle('active', page.id === 'page-' + tab);
                });
                var fn = { 'huo': renderHuo, 'gao': renderGao, 'su': renderSu, 'an': renderAn };
                if (fn[tab]) fn[tab]();
            }

            document.querySelectorAll('[data-tab]').forEach(function(btn) {
                btn.onclick = function() { switchTab(this.dataset.tab); };
            });

            function setMap(mapKey) {
                if (MAPS[mapKey]) {
                    currentMap = mapKey;
                    document.querySelectorAll('.map-switch button').forEach(function(btn) {
                        btn.classList.toggle('on', btn.dataset.map === mapKey);
                    });
                    var fn = { 'huo': renderHuo, 'gao': renderGao, 'su': renderSu, 'an': renderAn };
                    if (fn[currentTab]) fn[currentTab]();
                }
            }

            document.querySelectorAll('.map-switch button').forEach(function(btn) {
                btn.onclick = function() { setMap(this.dataset.map); };
            });

            // ---- 主渲染 ----
            function renderMainApp() {
                document.querySelectorAll('.mode-btn').forEach(function(btn) {
                    btn.classList.toggle('active', btn.dataset.mode === currentMode);
                });
                document.querySelectorAll('.map-switch button').forEach(function(btn) {
                    btn.classList.toggle('on', btn.dataset.map === currentMap);
                });
                var fn = { 'huo': renderHuo, 'gao': renderGao, 'su': renderSu, 'an': renderAn };
                if (fn[currentTab]) fn[currentTab]();
                document.getElementById('configStatusText').textContent = '✅ 应用已启动 · 配置版 v5.0';
                log('✅ 主界面渲染完成', 'success');
            }

            // ---- 启动 ----
            initAuth();

        })();
    </script>
</body>
</html>
