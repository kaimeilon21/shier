<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>俱乐大玩家 · 价值计算器</title>
    <style>
        :root {
            --bg-page: #0a0e1a;
            --bg-card: #111827;
            --bg-card2: #1a2332;
            --bg-input: #0d1422;
            --border-color: #2a3a5a;
            --text-primary: #e8eef8;
            --text-secondary: #8aa0c8;
            --accent: #e8c468;
            --accent2: #f5dd9a;
            --shadow: rgba(0, 0, 0, 0.5);
            --radius: 14px;
            --transition: 0.2s ease;
            --nav-height: 52px;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            background: var(--bg-page);
            color: var(--text-primary);
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            font-size: 14px;
            line-height: 1.6;
            padding-bottom: 40px;
        }
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:var(--bg-page); }
        ::-webkit-scrollbar-thumb { background:var(--accent); border-radius:4px; }

        #authOverlay {
            position:fixed; inset:0; z-index:999999; background:var(--bg-page);
            display:flex; align-items:center; justify-content:center; padding:20px;
            transition:opacity 0.4s ease;
        }
        #authOverlay.hidden { opacity:0; pointer-events:none; }
        .auth-box {
            width:420px; max-width:100%; background:var(--bg-card);
            border:1px solid rgba(232,196,104,0.12); border-radius:var(--radius);
            padding:34px 28px 24px; text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,0.6); position:relative; overflow:hidden;
        }
        .auth-box .auth-icon { font-size:44px; display:block; margin-bottom:2px; }
        .auth-box .auth-title {
            font-size:22px; font-weight:800;
            background:linear-gradient(135deg,var(--accent2),var(--accent));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
            margin-bottom:2px;
        }
        .auth-box .auth-badge {
            display:inline-block; background:linear-gradient(135deg,#ffd700,#f5a623);
            color:#0b1526; font-weight:800; padding:3px 20px; border-radius:30px; font-size:13px;
            box-shadow:0 0 30px rgba(255,215,0,0.15);
            border:1px solid rgba(255,215,0,0.15); margin:4px 0 12px;
        }
        .auth-box .auth-sub { color:var(--text-secondary); font-size:13px; margin-bottom:10px; line-height:1.7; }
        .auth-box .auth-input-wrap { position:relative; margin-bottom:12px; }
        .auth-box .auth-input-wrap input {
            width:100%; padding:13px 18px; background:var(--bg-input);
            border:2px solid var(--border-color); border-radius:12px;
            color:var(--text-primary); font-size:17px; font-weight:600; text-align:center;
            letter-spacing:4px; font-family:'SF Mono','Menlo',monospace; outline:none;
            transition:border-color var(--transition), box-shadow var(--transition);
        }
        .auth-box .auth-input-wrap input:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(232,196,104,0.06); }
        .auth-box .auth-btn {
            width:100%; padding:13px 0; border:none; border-radius:12px; font-size:16px; font-weight:700;
            color:#0b1526; background:linear-gradient(135deg,var(--accent),#c9a23e);
            cursor:pointer; transition:transform 0.15s, box-shadow 0.3s;
            box-shadow:0 4px 20px rgba(232,196,104,0.15); letter-spacing:0.5px;
        }
        .auth-box .auth-btn:active { transform:scale(0.97); }
        .auth-box .auth-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
        .auth-box .auth-error { color:#f87171; font-size:13px; min-height:22px; margin-top:4px; }
        .auth-box .auth-footer { margin-top:16px; color:var(--text-secondary); font-size:11px; opacity:0.4; line-height:1.8; }
        .auth-box .auth-footer .author { font-size:11px; opacity:0.5; margin-top:2px; }

        #appWrap { max-width:820px; margin:0 auto; padding:0 12px 20px; display:none; }
        #appWrap.show { display:block; }

        .top-nav {
            position:sticky; top:0; z-index:1000; background:var(--bg-page);
            border-bottom:1px solid rgba(42,58,90,0.25);
            padding:0 10px; height:var(--nav-height); display:flex; align-items:center; gap:6px;
            backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
            box-shadow:0 2px 20px rgba(0,0,0,0.3); flex-wrap:nowrap; overflow-x:auto;
        }
        .top-nav::-webkit-scrollbar { display:none; }
        .top-nav .nav-group { display:flex; align-items:center; gap:4px; flex-shrink:0; padding:0 6px; border-right:1px solid rgba(42,58,90,0.15); }
        .top-nav .nav-group:last-child { border-right:none; }
        .top-nav .nav-group .label { font-size:10px; color:var(--text-secondary); opacity:0.5; padding-right:2px; font-weight:600; display:none; }
        .top-nav .nav-group button[data-tab] {
            padding:6px 16px; font-size:15px; font-weight:700; min-height:36px; border:none;
            background:transparent; color:var(--text-secondary); cursor:pointer; border-radius:8px;
            white-space:nowrap; font-family:inherit; transition:all 0.15s; line-height:1.4;
        }
        .top-nav .nav-group button[data-tab].active { color:var(--accent2); background:rgba(232,196,104,0.06); }
        .top-nav .nav-group button[data-tab].active::after {
            content:''; display:block; height:2px; background:var(--accent); border-radius:2px;
            margin-top:2px; width:60%; margin-left:auto; margin-right:auto;
        }
        .top-nav .nav-group button.mode-btn {
            padding:5px 14px; font-size:13px; font-weight:700; min-height:32px; border:none;
            background:transparent; color:var(--text-secondary); cursor:pointer; border-radius:6px;
            white-space:nowrap; font-family:inherit; transition:all 0.15s; line-height:1.4;
        }
        .top-nav .nav-group button.mode-btn.active {
            background:rgba(232,196,104,0.12); border:1px solid rgba(232,196,104,0.15); color:var(--accent2);
        }
        .top-nav .nav-right { display:flex; align-items:center; gap:4px; flex-shrink:0; padding-left:6px; border-left:1px solid rgba(42,58,90,0.15); margin-left:auto; }
        .top-nav .nav-right .vip-tag { font-size:9px; color:var(--accent2); border:1px solid rgba(232,196,104,0.2); padding:1px 8px; border-radius:12px; font-weight:700; white-space:nowrap; }

        .header { padding:10px 4px 6px; display:flex; flex-direction:column; align-items:center; text-align:center; border-bottom:1px solid rgba(42,58,90,0.10); margin-bottom:6px; }
        .header .main-title { font-size:18px; font-weight:800; color:var(--accent2); letter-spacing:0.5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center; }
        .header .main-title .super-tag { background:linear-gradient(135deg,#ffd700,#f5a623); color:#0b1526; font-weight:800; padding:1px 12px; border-radius:30px; font-size:10px; box-shadow:0 0 30px rgba(255,215,0,0.12); border:1px solid rgba(255,215,0,0.12); display:inline-block; line-height:1.6; }
        .header .sub-title { font-size:11px; color:var(--text-secondary); margin-top:1px; opacity:0.5; letter-spacing:0.5px; }
        .header .header-actions { margin-top:4px; display:flex; justify-content:center; align-items:center; gap:12px; flex-wrap:wrap; }
        .header .header-actions .remain-time { font-size:12px; font-weight:600; background:rgba(78,201,122,0.06); padding:2px 14px; border-radius:20px; border:1px solid rgba(78,201,122,0.08); transition:color 0.3s, border-color 0.3s; }
        .header .header-actions .remain-time.permanent { color:#fbbf24; border-color:rgba(251,191,36,0.15); background:rgba(251,191,36,0.06); }
        .header .header-actions .remain-time.active { color:#4ec97a; border-color:rgba(78,201,122,0.15); background:rgba(78,201,122,0.06); }
        .header .header-actions .remain-time.warning { color:#fbbf24; border-color:rgba(251,191,36,0.15); background:rgba(251,191,36,0.06); }
        .header .
